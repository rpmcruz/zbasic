        await new Promise(r => setTimeout(r, 0));
        await fireEventHandlers();
        // Fire null event when queue is empty (simulates Mac null event)
        if (onEventHandler) await callEventHandler(onEventHandler);
        return;
      }
      if (stmt.keyword === 'OFF') { dialogOn = false; return; }
      console.log(`unsupported: EVENT ${stmt.keyword ?? ''}`); return;

    case 'MENU':
      if (stmt.keyword === 'ON')  { renderMenuBar(); return; }
      if (stmt.keyword === 'OFF') { return; }
      // fall through to MENU menuId, itemId, state [, title] handling below
      {
        const a0 = args[0];
        let menuId, itemId, enabled, title;
        if (a0 && a0.x !== undefined) {
          // (menuId, state) parsed as exprPoint — 2-arg form: enable/disable whole menu
          menuId = Math.floor(Number(await evalExpr(a0.x, env))) || 0;
          const st = Math.floor(Number(await evalExpr(a0.y, env)));
          if (menuId > 0 && menuDefs[menuId]) {
            menuDefs[menuId].enabled = st !== 0;
            renderMenuBar();
          }
          return;
        }
        menuId  = Number(await a(0)) || 0;
        itemId  = Number(await a(1)) || 0;
        enabled = Number(await a(2));
        title   = args[3] ? String(await a(3)) : null;
        if (menuId === 0) return;
        if (title !== null) {
          setMenu(menuId, itemId, !!enabled, title);
        } else {
          if (menuDefs[menuId]) {
            if (itemId === 0) { menuDefs[menuId].enabled = enabled !== 0; menuDefs[menuId].checked = enabled === 2; }
            else if (menuDefs[menuId].items[itemId]) { menuDefs[menuId].items[itemId].enabled = enabled !== 0; menuDefs[menuId].items[itemId].checked = enabled === 2; }
            renderMenuBar();
          }
        }
        return;
      }

    case 'FLUSHEVENTS': {
      eventQueue.length = 0;
      return;
    }

    case 'BUTTON': {
      const id = Math.floor(await n(0));

      if (stmt.keyword === 'CLOSE') { destroyCtrl(id); return; }

      if (args.length >= 3 && args[2] !== null) {
        // BUTTON id, condition, title$, rect, type  OR
        // BUTTON id, condition, (rect), title$, type  (when literal rect in pos 2)
        let title, rectArg;
        if (args[2]?.from) { rectArg = args[2]; title = args[3] ? String(await evalExpr(args[3], env)) : ''; }
        else { title = String(await evalExpr(args[2], env) ?? ''); rectArg = args[3]; }
        const active = Math.floor(await n(1));
        const type = args[4] ? Math.floor(await n(4)) : 1;  // 1=push, 2=checkbox, 3=radio
        const rect = await resolveCtrlRect(rectArg, env);

        if (!rect) {
          // No rect — update existing button state and text (BUTTON id, state, title$)
          const ctrl = controlStore[id];
          if (ctrl) {
            ctrl.value = active;
            ctrl.title = title;
            if (ctrl.el) {
              ctrl.el.disabled = (active === 0);
              ctrl.el.textContent = title;
              if (active === 2) ctrl.el.classList.add('selected');
              else ctrl.el.classList.remove('selected');
            }
          }
          return;
        }

        destroyCtrl(id);
        const wdef = ctrlWdef();
        if (!wdef) return;

        const el = document.createElement('button');
        el.className = 'mac-ctrl mac-btn';
        el.textContent = title;
        el.disabled = (active === 0);
        if (active === 2) el.classList.add('selected');
        el.addEventListener('mousedown', e => e.stopPropagation());
        el.addEventListener('click', () => {
          const r = el.getBoundingClientRect();
          const [mx, my] = canvasCoords(r.left + r.width/2, r.top + r.height/2);
          mouseX = mx; mouseY = my; mouseDown = true;
          lastDialogId = id;
          pushEvent('button', {id, code: 1});
          setTimeout(() => { mouseDown = false; }, 100);
        });
        wdef.container.appendChild(el);
        placeCtrl(el, rect[0], rect[1], rect[2], rect[3]);
        controlStore[id] = {el, type: 'button', value: active, title};
        return;
      }

      // BUTTON id [, state] — state change (0=disable, 1=normal, 2=selected/invert)
      const state = args[1] ? Math.floor(await n(1)) : 1;
      const ctrl = controlStore[id];
      if (ctrl) {
        ctrl.value = state;
        if (ctrl.el) {
          ctrl.el.disabled = (state === 0);
          if (state === 2) ctrl.el.classList.add('selected');
          else ctrl.el.classList.remove('selected');
        }
      }
      return;
    }

    case 'GLOBALS': {
      // GLOBALS GOSUB label / GLOBALS GOTO label — call subroutine in global context
      if (stmt.keyword === 'GOSUB' && args[0]) throw new GosubSignal(labelOf(args[0]));
      if (stmt.keyword === 'GOTO'  && args[0]) throw new GotoSignal(labelOf(args[0]));
      // GLOBALS "filename" — execute the GLBL file's DIM/equate statements
      if (args[0]?.type === 'literal' && typeof args[0].value === 'string') {
        const glblName = args[0].value;
        if (files[glblName]) {
          try {
            const glblStmts = flattenIncludes(parser.parse(files[glblName], {parseFile: () => []}));
            await execBlock(glblStmts, globalVars);
          } catch(e) {
            if (!(e instanceof GotoSignal) && !(e instanceof GosubSignal) && !(e instanceof ReturnSignal)) {
              console.warn(`GLOBALS "${glblName}" exec error: ${e.message ?? e}`);
            }
          }
        }
      }
      return;
    }

    case 'WIDTH': {
      penWidth = Math.max(1, await n(0));
      if (ctx) ctx.lineWidth = penWidth;
      return;
    }

    case 'WAIT': {
      const ticks = await n(0);
      if (ticks > 0) await new Promise(r => setTimeout(r, ticks * 1000 / 60));
      return;
    }

    case 'TRACE':   { debugMode = true;  return; }
    case 'NOTRACE': { debugMode = false; return; }

    case 'PT': {
      showCanvas();
      const a0 = args[0];
      let px, py;
      if (a0?.x !== undefined) { px = await evalExpr(a0.x, env); py = await evalExpr(a0.y, env); }
      else                      { px = await n(0); py = await n(1); }
      ctx.fillStyle = currentFg;
      ctx.fillRect(Math.floor(px), Math.floor(py), 1, 1);
      return;
    }

    case 'SEGMENT': {
      if (stmt.keyword === 'RETURN') throw new ReturnSignal();
      // SEGMENT (cx,cy), radius, startAngle, endAngle [FILL]
      showCanvas();
      const a0 = args[0];
      let cx, cy, r, ang1, ang2;
      if (a0?.x !== undefined) {
        cx = await evalExpr(a0.x, env); cy = await evalExpr(a0.y, env);
        r = await n(1); ang1 = await n(2); ang2 = await n(3);
      } else {
        cx = await n(0); cy = await n(1); r = await n(2); ang1 = await n(3); ang2 = await n(4);
      }
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, Math.abs(r), ang1 * Math.PI / 180, ang2 * Math.PI / 180);
      ctx.closePath();
      if (stmt.keyword === 'FILL') { ctx.fillStyle = currentFg; ctx.fill(); }
      else { ctx.strokeStyle = currentFg; ctx.lineWidth = penWidth; ctx.stroke(); }
      return;
    }

    case 'VTAB': { textY = Math.max(1, await n(0)) * (textSize + 2); return; }
    case 'HTAB': { textX = Math.max(0, (await n(0) - 1)) * Math.round(textSize * 0.6); return; }

    case 'INVERSE': { const tmp = currentFg; currentFg = currentBg; currentBg = tmp; return; }
    case 'NORMAL':  { currentFg = '#000000'; currentBg = '#ffffff'; return; }

    case 'KILL': {
      // KILL PICTURE handle — discard a picture buffer
      // KILL "filename" — delete file (no-op in browser)
      if (stmt.keyword === 'PICTURE' && args[0]) {
        const handle = String(await evalExpr(args[0], env));
        delete spriteBuffer[handle];
      }
      return;
    }

    case 'PICTURE': {
      // PICTURE (x,y), handle — draw a PICT resource at position
      if (!ctx || !args[0] || !args[1]) return;
      const px = Math.floor(Number(await evalExpr(args[0].x ?? args[0].from?.[0], env)));
      const py = Math.floor(Number(await evalExpr(args[0].y ?? args[0].from?.[1], env)));
      const handle = Math.floor(Number(await evalExpr(args[1], env)));
      const pict = pictHandleMap[handle];
      if (pict) {
        ctx.fillStyle = pict.color;
        ctx.fillRect(px, py, pict.w, pict.h);
      }
      return;
    }

    case 'BLOCKMOVE': {
      // BLOCKMOVE src, @dstVar, len — copy fake memory bytes into a variable
      if (args.length < 2) return;
      const dst = args[1];
      if (dst && dst.type === 'unary' && dst.operator === '@' && dst.expression?.type === 'variable') {
        const src = Math.floor(Number(await evalExpr(args[0], env)));
        const len = args[2] ? Math.floor(Number(await evalExpr(args[2], env))) : 8;
        if (len === 8 || len === 4) {
          // Read as rect (top, left, bottom, right) or point (v, h)
          const top  = fakeReadU16(src);
          const left = fakeReadU16(src + 2);
          const bot  = len >= 8 ? fakeReadU16(src + 4) : 0;
          const rgt  = len >= 8 ? fakeReadU16(src + 6) : 0;
          const varName = dst.expression.name;
          const obj = len >= 8 ? {top, left, bottom: bot, right: rgt, v: top, h: left}
                                : {v: top, h: left};
          writeVar(env, varName, obj);
          // Also set individual fields if they exist in globalVars as a struct
          if (globalVars[varName] && typeof globalVars[varName] === 'object')
            Object.assign(globalVars[varName], obj);
        }
      }
      return;
    }

    // No-op stubs — compiler directives or Mac-only features not available in a browser
    case 'COORDINATE':
    case 'RESOURCES': case 'COMPILE': case 'DEFSTR': case 'GLOBALS':
    case 'LIBRARY': case 'TOOLBOX': case 'INLINE': case 'CHAIN':
    case 'TALK':
    case 'MINWINDOW': case 'MAXWINDOW': case 'SETZOOM':
    case 'SPEED': case 'LPRINT': case 'LLIST':
    case 'HPLOT': case 'HCOLOR': case 'HGRAPH': case 'SCRN':
    case 'FLASH': case 'POKE': case 'RESUME': case 'APPLE':
    case 'ROUTE': case 'RATIO': case 'SETSELECT': case 'PUSH': case 'LOCAL':
    case 'RANDOM':
      return;

    case 'EDIT': {
      if (stmt.keyword !== 'FIELD') return;

      // EDIT FIELD CLOSE id (via trailer)
      const closeTrailer = stmt.trailer?.find(t => t.keyword === 'CLOSE');
      if (closeTrailer) {
        const cid = Math.floor(Number(await evalExpr(closeTrailer.args[0], env)));
        destroyCtrl(cid);
        if (currentEditField === cid) currentEditField = null;
        return;
      }

      // Field ID: channel (#id) or expression
      const a0 = args[0];
      if (!a0) return;
      const fieldId = a0.type === 'channel'
        ? Math.floor(Number(await evalExpr(a0.n, env)))
        : Math.floor(await n(0));

      if (args.length <= 1 || args[1] === null) {
        // Focus: EDIT FIELD id
        currentEditField = fieldId;
        controlStore[fieldId]?.el?.focus();
        return;
      }

      // Create/update: EDIT FIELD id, text$, rect, type, justify
      const text = args[1] ? String(await evalExpr(args[1], env) ?? '') : '';
      const rect = args[2] ? await resolveCtrlRect(args[2], env) : null;

      if (rect) destroyCtrl(fieldId);

      const wdef = ctrlWdef();
      if (!wdef) return;

      let ctrl = controlStore[fieldId];
      if (!ctrl?.el) {
        const el = document.createElement('input');
        el.type = 'text';
        el.className = 'mac-ctrl mac-editfield';
        el.value = text;
        el.addEventListener('focus', () => {
          currentEditField = fieldId;
          lastDialogId = fieldId;
          pushEvent('editfield', {id: fieldId, code: 2});
        });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 6}); }
          else if (e.key === 'Tab') { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 7}); }
        });
        wdef.container.appendChild(el);
        ctrl = controlStore[fieldId] = {el, type: 'editfield', value: text};
        currentEditField = fieldId;
      } else {
        ctrl.el.value = text;
        ctrl.value = text;
      }
      if (rect) placeCtrl(ctrl.el, rect[0], rect[1], rect[2], rect[3]);
      return;
    }

    case 'CURSOR': {
      const cursorMap = {0: 'default', 1: 'text', 2: 'crosshair', 4: 'wait', 5: 'wait'};
      const val = args.length > 0 ? await n(0) : 0;
      document.body.style.cursor = cursorMap[val] ?? 'default';
      return;
    }

    default: console.log(`unsupported syscall: ${cmd}`); return;
  }
}

// ── control flow ──────────────────────────────────────────────
async function execIf(stmt, env) {
  const cond = await evalExpr(stmt.condition, env);
  if (isTruthy(cond)) return execBlock(stmt.body, env);
  if (stmt.else)      return execBlock(stmt.else, env);
}

async function execFor(stmt, env) {
  const varName = stmt.variable;
  let val = await evalExpr(stmt.start, env);
  const end  = await evalExpr(stmt.end, env);
  const step = stmt.step ? await evalExpr(stmt.step, env) : 1;
  while ((step > 0 && val <= end) || (step < 0 && val >= end)) {
    await maybeYield();
    env[varName] = val;
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
    val += step;
  }
}

async function execWhile(stmt, env) {
  while (isTruthy(await evalExpr(stmt.condition, env))) {
    await maybeYield();
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  }
}

async function execDoWhile(stmt, env) {
  do {
    await maybeYield();
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  } while (!isTruthy(await evalExpr(stmt.condition, env)));
}

async function execSelect(stmt, env) {
  const val = await evalExpr(stmt.expr, env);
  for (const c of stmt.cases) {
    if (c.values === 'else') return execBlock(c.body, env);
    for (const cv of c.values) {
      let match = false;
      if (cv.type === 'range') {
        const from = await evalExpr(cv.from, env), to = await evalExpr(cv.to, env);
        match = Number(val) >= Number(from) && Number(val) <= Number(to);
      } else if (cv.type === 'relational') {
        match = compareOp(cv.op, val, await evalExpr(cv.expr, env));
      } else {
        const cval = await evalExpr(cv, env);
        match = val === cval || String(val).toLowerCase() === String(cval).toLowerCase();
      }
      if (match) return execBlock(c.body, env);
    }
  }
}

async function execOn(stmt, env) {
  const val = Math.floor(Number(await evalExpr(stmt.expr, env))) - 1;
  if (val < 0 || val >= stmt.targets.length) return;
  const tgt = stmt.targets[val];
  // Targets are label names stored as variable/expression nodes — extract the name
  const lbl = (tgt && typeof tgt === 'object'
    ? (tgt.name ?? tgt.value ?? tgt.label ?? String(await evalExpr(tgt, env)))
    : String(tgt ?? '')).toLowerCase();
  if (stmt.cmd === 'GOTO') throw new GotoSignal(lbl);
  if (stmt.cmd === 'GOSUB') throw new GosubSignal(lbl);
}

function parseMenuItems(str) {
  const items = [];
  for (const raw of str.split(';')) {
    let text = raw.trim();
    if (!text) continue;
    if (text === '-' || text === '(-' || text.startsWith('---')) { items.push({title: '-', enabled: false}); continue; }
    let enabled = true;
    if (text.startsWith('(')) { enabled = false; text = text.slice(1); }
    text = text.replace(/\/.$/, '');  // strip /K keyboard shortcut
    items.push({title: text.trim(), enabled, checked: false});
  }
  return items;
}

async function execProcCall(stmt, env) {
  const name = stmt.name;
  const ev = i => evalExpr(stmt.args?.[i], env);

  // Built-in Mac Toolbox calls
  switch (name) {
    case 'clearmenubar':
      Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
      renderMenuBar(); return;
    case 'drawmenubar': return;  // we render immediately; no-op here
    case 'setmenubar':
      if (savedMenuBar) {
        Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
        Object.assign(menuDefs, JSON.parse(JSON.stringify(savedMenuBar)));
        renderMenuBar();
      }
      return;
    case 'appendmenu': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const itemStr = String((await ev(1)) ?? '');
      if (!menuDefs[handle]) menuDefs[handle] = {title: '', enabled: true, items: {}};
      const startIdx = Math.max(0, ...Object.keys(menuDefs[handle].items).map(Number)) + 1;
      parseMenuItems(itemStr).forEach((it, i) => { menuDefs[handle].items[startIdx + i] = it; });
      renderMenuBar(); return;
    }
    case 'insertmenu': { renderMenuBar(); return; }
    case 'enableitem': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = true;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = true;
        renderMenuBar();
      }
      return;
    }
    case 'disableitem': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = false;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = false;
        renderMenuBar();
      }
      return;
    }
    case 'checkitem': {
      const handle  = Math.floor(Number(await ev(0))) || 0;
      const item    = Math.floor(Number(await ev(1))) || 0;
      const checked = !!(await ev(2));
      if (menuDefs[handle]?.items[item]) {
        menuDefs[handle].items[item].checked = checked;
        renderMenuBar();
      }
      return;
    }
    case 'getitem': {
      // CALL GETITEM(hMenu, item, str$) — get menu item title into a string variable
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      const strArg = stmt.args?.[2];
      if (strArg?.type === 'variable' && menuDefs[handle]?.items[item]) {
        writeVar(env, strArg.name, menuDefs[handle].items[item].title ?? '');
      }
      return;
    }
    case 'deletemenu': case 'disposemenu': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      if (menuDefs[handle]) { delete menuDefs[handle]; renderMenuBar(); }
      return;
    }
    // ── Cursor ───────────────────────────────────────────────────
    case 'initcursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'default';
      return;
    }
    case 'setcursor': {
      const cursors = ['default','text','crosshair','cell','wait','pointer'];
      const idx = Math.floor(Number(await ev(0))) || 0;
      const cur = cursors[idx] ?? 'default';
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = cur;
      return;
    }
    case 'showcursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'default';
      return;
    }
    case 'hidecursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'none';
      return;
    }
    case 'getmouse': {
      // CALL GETMOUSE(pt) — writes current mouse position as packed Mac Point (v<<16|h)
      const arg0 = stmt.args?.[0];
      if (arg0) {
        const assignName = arg0.type === 'callable' ? arg0.name : (arg0.type === 'variable' ? arg0.name : null);
        if (assignName) {
          const arr = env[assignName] ?? globalVars[assignName];
          if (Array.isArray(arr)) { arr[0] = mouseX; arr[1] = mouseY; }
          else { writeVar(env, assignName, ((mouseY & 0xFFFF) << 16) | (mouseX & 0xFFFF)); }
        }
      }
      return;
    }

    // ── Regions ──────────────────────────────────────────────────
    case 'setclip': {
      const h = Math.floor(Number(await ev(0))) || 0;
      applyClip(h);
      return;
    }
    case 'cliprect': {
      // CALL CLIPRECT(rect(i)) or CLIPRECT(rect(i,j))
      const arg0 = stmt.args?.[0];
      if (arg0?.type === 'callable') {
        const arrName = arg0.name;
        const i0 = arg0.args?.[0] ? Math.floor(Number(await evalExpr(arg0.args[0], env))) : 0;
        const i1 = arg0.args?.[1] ? Math.floor(Number(await evalExpr(arg0.args[1], env))) : null;
        const arr = env[arrName] ?? globalVars[arrName];
        if (Array.isArray(arr)) {
          let target = arr, base = i0;
          if (i1 !== null && Array.isArray(arr[i0])) { target = arr[i0]; base = i1; }
          const h = newRegion();
          setRegionRect(h, target[base], target[base+1], target[base+2], target[base+3]);
          applyClip(h);
          return;
        }
      }
      return;
    }
    case 'disposergn': {
      const h = Math.floor(Number(await ev(0))) || 0;
      delete regionStore[h];
      return;
    }
    case 'openrgn': case 'closergn': case 'getclip':
    case 'invalrect': case 'validrect': case 'beginupdate': case 'endupdate':
      return;
    case 'hilitemenu': {
      const mid = Math.floor(Number(await ev(0))) || 0;
      document.querySelectorAll('#dynamic-menubar .dyn-menu.open')
        .forEach(el => el.classList.remove('open'));
      if (mid !== 0) {
        const el = document.querySelector(`#dynamic-menubar .dyn-menu[data-menu-id="${mid}"]`);
        if (el) el.classList.add('open');
      }
      return;
    }
    case 'flashmenubar': {
      const mid = Math.floor(Number(await ev(0))) || 0;
      const sel = mid
        ? `#dynamic-menubar .dyn-menu[data-menu-id="${mid}"]`
        : '#dynamic-menubar';
      const el = document.querySelector(sel);
      if (el) {
        el.style.filter = 'invert(1)';
        setTimeout(() => { el.style.filter = ''; }, 80);
      }
      return;
    }

    // ── setrect / rect math — write back to array via AST arg ───
    case 'setrect': case 'offsetrect': case 'insetrect': {
      const arg0 = stmt.args?.[0];
      if (arg0?.type === 'variable') {
        // CALL SETRECT(rect, left, top, right, bottom) — write struct to variable
        const varName = arg0.name;
        const cur = readVar(env, varName) ?? {};
        if (name === 'setrect') {
          const obj = {left: Number(await ev(1))||0, top: Number(await ev(2))||0,
                       right: Number(await ev(3))||0, bottom: Number(await ev(4))||0};
          writeVar(env, varName, {...(typeof cur==='object'?cur:{}), ...obj});
        } else if (name === 'offsetrect') {
          const dh = Number(await ev(1))||0, dv = Number(await ev(2))||0;
          if (typeof cur === 'object') { cur.top+=dv; cur.left+=dh; cur.bottom+=dv; cur.right+=dh; writeVar(env, varName, cur); }
        } else if (name === 'insetrect') {
          const dh = Number(await ev(1))||0, dv = Number(await ev(2))||0;
          if (typeof cur === 'object') { cur.top+=dv; cur.left+=dh; cur.bottom-=dv; cur.right-=dh; writeVar(env, varName, cur); }
        }
        return;
      }
      if (arg0?.type === 'callable') {
        const arrName = arg0.name;
        const i0 = arg0.args?.[0] ? Math.floor(Number(await evalExpr(arg0.args[0], env))) : 0;
        const i1 = arg0.args?.[1] ? Math.floor(Number(await evalExpr(arg0.args[1], env))) : null;
        const arr = readVar(env, arrName);
        if (Array.isArray(arr)) {
          let target = arr, base = i0;
          if (i1 !== null && Array.isArray(arr[i0])) { target = arr[i0]; base = i1; }
          if (name === 'setrect') {
            target[base]   = Number(await ev(1)) || 0;
            target[base+1] = Number(await ev(2)) || 0;
            target[base+2] = Number(await ev(3)) || 0;
            target[base+3] = Number(await ev(4)) || 0;
          } else if (name === 'offsetrect') {
            const dh = Number(await ev(1)) || 0, dv = Number(await ev(2)) || 0;
            target[base]   += dh; target[base+1] += dv;
            target[base+2] += dh; target[base+3] += dv;
          } else if (name === 'insetrect') {
            const dh = Number(await ev(1)) || 0, dv = Number(await ev(2)) || 0;
            target[base]   += dh; target[base+1] += dv;
            target[base+2] -= dh; target[base+3] -= dv;
          }
        }
      }
      return;
    }

    case 'unionrect': {
      // CALL UNIONRECT(src1(i), src2(i), dst(i))
      const readRect = async argN => {
        const a = stmt.args?.[argN];
        if (a?.type !== 'callable') return null;
        const arr = env[a.name] ?? globalVars[a.name];
        if (!Array.isArray(arr)) return null;
        const i = a.args?.[0] ? Math.floor(Number(await evalExpr(a.args[0], env))) : 0;
        return { arr, i };
      };
      const s1 = await readRect(0), s2 = await readRect(1), dst = await readRect(2);
      if (s1 && s2 && dst) {
        dst.arr[dst.i]   = Math.min(s1.arr[s1.i],   s2.arr[s2.i]);
        dst.arr[dst.i+1] = Math.min(s1.arr[s1.i+1], s2.arr[s2.i+1]);
        dst.arr[dst.i+2] = Math.max(s1.arr[s1.i+2], s2.arr[s2.i+2]);
        dst.arr[dst.i+3] = Math.max(s1.arr[s1.i+3], s2.arr[s2.i+3]);
      }
      return;
    }

    case 'rectrgn': {
      // CALL RECTRGN(rgnHandle, rect(i))
      const h = Math.floor(Number(await ev(0))) || 0;
      const arg1 = stmt.args?.[1];
      if (arg1?.type === 'callable') {
        const arrName = arg1.name;
        const startIdx = arg1.args?.[0] ? Math.floor(Number(await evalExpr(arg1.args[0], env))) : 0;
        const arr = env[arrName] ?? globalVars[arrName];
        if (Array.isArray(arr))
          setRegionRect(h, arr[startIdx], arr[startIdx+1], arr[startIdx+2], arr[startIdx+3]);
      }
      return;
    }

    // ── TextEdit ──────────────────────────────────────────────────
    case 'tenew': {
      // CALL TENEW(outVar, viewRect) — write handle into outVar
      const arg0 = stmt.args?.[0];
      let varName = null;
      if (arg0?.type === 'variable') varName = arg0.name;
      else if (arg0?.type === 'callable' && !arg0.args?.length) varName = arg0.name;
      const handle = await makeTeHandle(stmt.args?.[1], env);
      if (varName) writeVar(env, varName, handle);
      return;
    }
    case 'tesettext': {
      // CALL TESETTEXT(textPtr, len, hTE) — Mac API order
      const textPtr = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const len     = Math.floor(Number(await evalExpr(stmt.args?.[1], env))) || 0;
      const handle  = Math.floor(Number(await evalExpr(stmt.args?.[2], env))) || 0;
      const rec = teHandleMap[handle];
      const _rh = env['rhand&'] ?? globalVars['rhand&'];
      console.log(`TE TESETTEXT: ptr=0x${textPtr.toString(16)} len=${len} handle=${handle} rec=${!!rec} rhand&=${_rh} fakeRead(${_rh})=${fakeReadU32(_rh)}`);
      if (rec) { rec.text = macRomanToStr(fakeReadBytes(textPtr, len)); console.log(`  text="${rec.text.slice(0,60)}"`); renderTeDiv(rec); }
      else console.warn(`  no TE record for handle ${handle}`);
      return;
    }
    case 'tecaltext': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        const lines = rec.text.split('\r').length;
        fakeWriteU16(fakeReadU32(handle) + 94, lines);
        console.log(`TE TECALTEXT: handle=${handle} lines=${lines}`);
      } else console.warn(`TE TECALTEXT: no record for handle ${handle}`);
      return;
    }
    case 'teupdate': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[1], env))) || 0;
      const rec = teHandleMap[handle];
      console.log(`TE TEUPDATE: handle=${handle} rec=${!!rec} text="${rec?.text?.slice(0,40)}"`);
      if (rec) renderTeDiv(rec);
      return;
    }
    case 'tescroll': {
      const dH     = Number(await evalExpr(stmt.args?.[0], env)) || 0;
      const dV     = Number(await evalExpr(stmt.args?.[1], env)) || 0;
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[2], env))) || 0;
      const rec = teHandleMap[handle];
      console.log(`TE TESCROLL: dH=${dH} dV=${dV} handle=${handle}`);
      if (rec) { rec.div.scrollLeft += dH; rec.div.scrollTop += dV; }
      return;
    }
    case 'tedispose': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) { rec.div.remove(); delete teHandleMap[handle]; }
      return;
    }
    case 'teactivate': case 'teleactivate': case 'drawcontrols':
      return;

    case 'setitem': {
      // CALL SETITEM(hMenu, item, str$) — set menu item title
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      const title  = String((await ev(2)) ?? '');
      if (menuDefs[handle]?.items[item]) {
        menuDefs[handle].items[item].title = title;
        renderMenuBar();
      }
      return;
    }

    // Mac Toolbox stubs — not fully implemented
    case 'textbox': case 'setpenstate': case 'getpenstate':
    case 'invertrect': case 'framerect': case 'paintrect': case 'eraserect':
    case 'fillrect': case 'frameoval': case 'paintoval': case 'eraseoval':
    case 'invertroundrgn': case 'invertrgn': case 'paintrgn': case 'framergn':
    case 'frameroundrect': case 'paintroundrect': case 'eraserundrect':
    case 'drawchar': case 'drawstring': case 'drawtext':
      return;
    case 'moveto': case 'move': {
      penX = Number(await ev(0)) || 0;
      penY = Number(await ev(1)) || 0;
      if (gfxPenMode === 10 && xorSnapshot) {
        // Restore clean-canvas snapshot to erase any previous rubber-band line
        ctx.putImageData(xorSnapshot, 0, 0);
      }
      return;
    }
    case 'lineto': case 'line': {
      const tx = Number(await ev(0)) || 0, ty = Number(await ev(1)) || 0;
      ctx.strokeStyle = currentFg; ctx.lineWidth = penWidth;
      ctx.beginPath(); ctx.moveTo(penX, penY); ctx.lineTo(tx, ty); ctx.stroke();
      penX = tx; penY = ty;
      return;
    }
    case 'penmode': {
      const mode = Math.round(Number(await ev(0)) || 0);
      if (mode === 10 && gfxPenMode !== 10) {
        gfxPenMode = 10;
        if (!xorSnapshot) xorSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      } else if (mode !== 10 && gfxPenMode === 10) {
        gfxPenMode = mode;
        if (xorSnapshot) { ctx.putImageData(xorSnapshot, 0, 0); xorSnapshot = null; }
      } else {
        gfxPenMode = mode;
      }
      return;
    }
    case 'pensize': {
      const pw = Number(await ev(0)) || 1, ph = Number(await ev(1)) || pw;
      penWidth = Math.max(1, pw); penHeight = Math.max(1, ph);
      ctx.lineWidth = penWidth;
      return;
    }
    case 'textfont': case 'textface': case 'textmode': case 'textsize':
    case 'setport': case 'getport': case 'initport': case 'getwtitle':
    case 'sysclosedeskfiles': case 'nop':
    case 'getwmgrport': case 'getport': case 'setctype':
    case 'paramtext': case 'selitext': case 'setitext': case 'getitext':
    case 'getctitle': {
      // CALL GETCTITLE(handle&, title$) — read control title into variable
      const handle = Math.floor(Number(await ev(0)));
      const titleArg = stmt.args?.[1];
      if (titleArg?.type === 'variable' || titleArg?.type === 'callable') {
        const varName = titleArg.name;
        const ctrl = controlStore[handle];
        writeVar(env, varName, ctrl?.title ?? '');
      }
      return;
    }
    case 'getditem': case 'setditem': case 'setctitle':
    case 'getresinfo': case 'releaseresource': case 'useresfile':
    case 'pennormal': case 'penpat': case 'openrgn': case 'closergn':
    case 'setrectrgn': case 'sectrgn': case 'diffrgn': case 'unionrgn':
    case 'modaldialog': case 'begindialog': case 'enddialog':
    case 'teautoview': case 'tesettext': return;  // override if previously defined
    case 'drawmenubar': return;
    case 'getkeys': {
      // CALL GETKEYS(arr) — fill key state array with zeros (no key pressed)
      const arg0 = stmt.args?.[0];
      if (arg0?.type === 'callable' || arg0?.type === 'variable') {
        const n = arg0.type === 'callable' ? arg0.name : arg0.name;
        const arr = env[n] ?? globalVars[n];
        if (Array.isArray(arr)) arr.fill(0);
        else writeVar(env, n, 0);
      }
      return;
    }
    case 'getfontinfo': {
      // CALL GETFONTINFO(ascent) — fill font metric variables (DIM FAsc,FDes,FWid,FLead,Fht)
      // Variables are laid out consecutively: FAsc, FDes, FWid, FLead, Fht
      writeVar(env, 'fasc', textSize); writeVar(env, 'fdes', 2);
      writeVar(env, 'fwid', Math.round(textSize * 0.6)); writeVar(env, 'flead', 1);
      writeVar(env, 'fht', textSize + 3);
      return;
    }
    case 'getpen': {
      // CALL GETPEN(arr) — fill arr[0]=v(y), arr[1]=h(x) with current text pen position
      const arg0 = stmt.args?.[0];
      const arrName = arg0?.name ?? (arg0?.type === 'callable' ? arg0.name : null);
      if (arrName) {
        const baseIdx = arg0?.args?.[0] ? Math.floor(Number(await evalExpr(arg0.args[0], env))) : 0;
        const arr = env[arrName] ?? globalVars[arrName];
        if (Array.isArray(arr)) {
          arr[baseIdx]     = Math.round(gfxPenY);
          arr[baseIdx + 1] = Math.round(gfxPenX);
        }
      }
      return;
    }
    case 'blockmove': return;  // memory copy stub
    case 'offsetrect': {
      // Standalone CALL OFFSETRECT(T, dh, dv) on scalar T — try DIM'd consecutive vars
      // (can't implement properly without memory layout — just no-op)
      return;
    }
  }

  const fn = funcDefs[name];
  if (!fn) { console.log(`undefined: ${name}`); return; }
  if (debugMode) console.log(`▶ CALL ${name}`);
  const local = Object.create(env);
  if (fn.args) for (let i = 0; i < fn.args.length; i++)
    local[fn.args[i].name] = await evalExpr(stmt.args?.[i], env);
  await execBlock(fn.body, local);
}

let savedMenuBar = null;

async function execUserFuncCall(stmt, env) {
  const fn = funcDefs[stmt.name];
  if (!fn) {
    // Built-in Toolbox FN calls
    const ev = i => evalExpr(stmt.args?.[i], env);
    switch (stmt.name) {
      case 'newmenu': {
        const menuId = Math.floor(Number(await ev(0))) || 0;
        const title  = String((await ev(1)) ?? '');
        menuDefs[menuId] = {title, enabled: true, items: {}};
        renderMenuBar();
        return menuId;
      }
      case 'getmenubar':
        savedMenuBar = JSON.parse(JSON.stringify(menuDefs));
        return 1;
      case 'getmhandle': {
        // Return the menu ID as its own "handle" (we use IDs directly)
        const mid = Math.floor(Number(await ev(0))) || 0;
        return mid;
      }
      case 'countmitems': {
        const handle = Math.floor(Number(await ev(0))) || 0;
        return menuDefs[handle] ? Object.keys(menuDefs[handle].items).length : 0;
      }
      case 'finderinfo': return 0;
      case 'count1resources': return 0;
      case 'getindresource': case 'get1indresource': return 0;
      case 'getresource': case 'get1resource': {
        // FN GETRESOURCE(type&, id%) -> handle
        // For PICT resources, create a fake handle with picSize + picFrame rect
        const typeArg = stmt.args?.[0];
        const isPict = typeArg && typeArg.type === 'namedConst' && typeArg.name.toUpperCase() === 'PICT';
        if (!isPict) return 0;
        const pictId = Math.floor(Number(await ev(1)) ?? 0);
        // Dimensions for known PICT IDs in the Supermarket app
        const pictDims = {4000:[280,500,'#888888'], 5000:[30,50,'#c8a060'], 5001:[20,8,'#00aa00'], 5004:[20,20,'#0066cc']};
        const [ph, pw, color] = pictDims[pictId] ?? [20, 20, '#aaaaaa'];
        // PICT data: 2-byte picSize + 8-byte picFrame (top,left,bottom,right as int16 big-endian)
        const dataAddr = fakeMalloc(10);
        fakeWriteU16(dataAddr, 10);          // picSize
        fakeWriteU16(dataAddr+2, 0);         // top
        fakeWriteU16(dataAddr+4, 0);         // left
        fakeWriteU16(dataAddr+6, ph);        // bottom
        fakeWriteU16(dataAddr+8, pw);        // right
        const handle = fakeMalloc(4);
        fakeWriteU32(handle, dataAddr);
        pictHandleMap[handle] = {id: pictId, w: pw, h: ph, color};
        return handle;
      }
      case 'getnamedresource': case 'get1namedresource': {
        // FN GETNAMEDRESOURCE(type&, name$) -> handle or 0
        const name = String((await ev(1)) ?? '').toLowerCase();
        const text = rsrcTexts[name];
        if (!text) return 0;
        const bytes = new Uint8Array(text.length);
        for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xFF;
        // data block: [2-byte length][text bytes]
        const dataAddr = fakeMalloc(2 + bytes.length);
        fakeWriteU16(dataAddr, bytes.length);
        fakeWriteBytes(dataAddr + 2, bytes);
        // handle = master pointer (4 bytes) -> dataAddr
        const handle = fakeMalloc(4);
        fakeWriteU32(handle, dataAddr);
        console.log(`TE GETNAMEDRESOURCE: "${name}" len=${bytes.length} dataAddr=${dataAddr} handle=${handle}`);
        return handle;
      }
      case 'openresfile': case 'openrfperm': case 'homeresfile': return 0;
      case 'curresfile': case 'homeresfile': return 0;
      case 'newrgn': return newRegion();
      case 'bittst': return 0;       // FN BITTST(ptr,bit) — keyboard/memory bit test stub
      case 'stringwidth': return 0;  // handled below in evalCallable default path
      case 'sizeresource': return 0; // FN SIZERESOURCE(handle) — resource byte count stub
      case 'gethandlesize': return 0;
      case 'zeroscrap': return 0;
      case 'putscrap': return 0;
      case 'gestalt': return 0;
      case 'aeinstalleventhandler': return 0;
      case 'alert': case 'notealert': case 'caution': return 1;  // always OK
      case 'getnewdialog': return 0;
      case 'getcrefcon': return 0;
      case 'getcref': return 0;
      case 'pstr$': return '';  // Pascal string pointer to string
      case 'tehandle': return 0;
      case 'tenew': {
        const h = await makeTeHandle(stmt.args?.[1], env);
        console.log(`TE TENEW: handle=${h}`);
        return h;
      }
      case 'ptinrect': {
        // FN PTINRECT(pt, rect) — use current mouseX/mouseY against the rect
        const ri = stmt.args?.[1];
        let left = 0, top = 0, right = 512, bottom = 512;
        if (ri?.type === 'callable') {
          const arrName = ri.name;
          const ri0 = ri.args?.[0] ? Math.floor(Number(await evalExpr(ri.args[0], env))) : 0;
          const ri1 = ri.args?.[1] ? Math.floor(Number(await evalExpr(ri.args[1], env))) : null;
          const arr = env[arrName] ?? globalVars[arrName];
          if (Array.isArray(arr)) {
            let row = arr, base = ri0;
            if (ri1 !== null && Array.isArray(arr[ri0])) { row = arr[ri0]; base = ri1; }
            left = Number(row[base] ?? 0); top = Number(row[base+1] ?? 0);
            right = Number(row[base+2] ?? 0); bottom = Number(row[base+3] ?? 0);
          }
        }
        return (mouseX >= left && mouseX < right && mouseY >= top && mouseY < bottom) ? -1 : 0;
      }
      case 'countresources': case 'count1resources': return 0;
      case 'getctitle': return '';
      case 'button': { const bid = Math.floor(Number(await A(0)??0)); return controlStore[bid]?.value ?? 0; }
      case 'button&': { const bid = Math.floor(Number(await A(0)??0)); return controlStore[bid] ? bid : 0; }
      case 'pGgetitemname$': case 'pGgetitemname': return '';
    }
    return null;
  }
  if (fn.using) {
    // DEF FN foo USING bar& — dispatch through function pointer stored in bar&
    const ptrName = fn.using.name;
    const handle = Math.floor(Number(env[ptrName] ?? globalVars[ptrName] ?? 0));
    const targetName = fnPtrTable[handle];
    // pGbuild(wndClass) — pointer is 0 (unresolved PG:PRO stub); create window + fire update
    if (!targetName && stmt.name.replace(/\s+/g,'').toLowerCase() === 'pgbuild') {
      const wndNum = Math.floor(Number(await evalExpr(stmt.args?.[0], env) ?? 1));
      getOrCreateWindow(wndNum, null, 512, 342);
      setOutputWindow(wndNum);
      eventQueue.push({type:'dialog', code:5, winRef:wndNum});
      return null;
    }
    if (!targetName || !funcDefs[targetName]) return null;
    return execUserFuncCall({...stmt, name: targetName}, env);
  }
  if (debugMode) console.log(`▶ FN ${stmt.name}`);
  const local = Object.create(env);
  if (fn.args) for (let i = 0; i < fn.args.length; i++)
    local[fn.args[i].name] = await evalExpr(stmt.args?.[i], env);
  if (fn.type === 'defFn') return evalExpr(fn.value, local);
  await execBlock(fn.body, local);
  return fn.ret ? evalExpr(fn.ret, local) : null;
}

// ── Expression evaluator ──────────────────────────────────────
async function evalExpr(node, env) {
  if (node === null || node === undefined) return null;
  switch(node.type) {
    case 'constant':    return node.value;
    case 'literal':     return node.value;
    case 'variable': {
      const rv = readVar(env, node.name);
      return rv !== undefined ? rv : 0;
    }
    case 'chainAccess': {
      if (node.args !== null) {
        // Struct array: gShopper.SLoc.v%(0) → flat array key = 'gshopper.sloc.v%'
        const flatName = (node.name + '.' + node.fields.join('.')).toLowerCase();
        const idx = Math.floor(Number(await evalExpr(node.args?.[0], env) ?? 0));
        const arr = env[flatName] ?? globalVars[flatName];
        return (Array.isArray(arr) ? arr[idx] : null) ?? 0;
      }
      let v = env[node.name] ?? globalVars[node.name] ?? {};
      for (const f of node.fields) v = (v && typeof v === 'object') ? v[f] : null;
      return v ?? 0;
    }
    case 'binary':      return evalBinary(node, env);
    case 'unary':       return evalUnary(node, env);
    case 'callable':    return evalCallable(node, env);
    case 'userFuncCall': return execUserFuncCall(node, env);
    case 'namedConst':  return 0;
    case 'lineRef':     return node.label;
    case 'deref': { const addr = Math.floor(Number(await evalExpr(node.expr, env))); return fakeReadU32(addr); }
    case 'compileConst': return evalExpr(node.expr, env);
    default: return 0;
  }
}

async function evalBinary(node, env) {
  const L = await evalExpr(node.left, env);
  const R = await evalExpr(node.right, env);
  switch(node.operator) {
    case '+': return (typeof L === 'string' || typeof R === 'string') ? String(L??'') + String(R??'') : (Number(L)||0) + (Number(R)||0);
    case '-': return (Number(L)||0) - (Number(R)||0);
    case '*': return (Number(L)||0) * (Number(R)||0);
    case '/': { const d = Number(R); return d ? (Number(L)||0)/d : 0; }
    case '\\': { const d = Number(R)|0; return d ? Math.trunc((Number(L)||0)/d) : 0; }
    case '^': return Math.pow(Number(L)||0, Number(R)||0);
    case 'MOD': { const d = Number(R)|0; return d ? (Number(L)|0)%d : 0; }
    case '&': return String(L??'') + String(R??'');
    case '=':  return (L===R || Number(L)===Number(R)) ? -1 : 0;
    case '<>': return (L!==R && Number(L)!==Number(R)) ? -1 : 0;
    case '<':  return Number(L) <  Number(R) ? -1 : 0;
    case '>':  return Number(L) >  Number(R) ? -1 : 0;
    case '<=': return Number(L) <= Number(R) ? -1 : 0;
    case '>=': return Number(L) >= Number(R) ? -1 : 0;
    case 'AND': return (isTruthy(L) && isTruthy(R)) ? -1 : 0;
    case 'OR':  return (isTruthy(L) || isTruthy(R)) ? -1 : 0;
    case '<<': return (Number(L)|0) << (Number(R)|0);
    case '>>': return (Number(L)|0) >> (Number(R)|0);
    default: return 0;
  }
}

async function evalUnary(node, env) {
  if (node.operator === '@') {
    // Address-of: @FN name → stable integer handle mapped to the function name.
    // @varName (non-function) → 0 (real memory layout unsupported).
    const expr = node.expression;
    const fnName = expr?.name;
    if (!fnName) return 0;
    for (const [h, n] of Object.entries(fnPtrTable)) { if (n === fnName) return Number(h); }
    const h = nextFnPtrHandle++;
    fnPtrTable[h] = fnName;
    return h;
  }
  const v = await evalExpr(node.expression, env);
  switch(node.operator) {
    case '-': return -(Number(v)||0);
    case '+': return Number(v)||0;
    case 'NOT': return isTruthy(v) ? 0 : -1;
    default: return Number(v)||0;
  }
}

function isTruthy(v) { return !!v && v !== 0; }
function compareOp(op, l, r) {
  switch(op) {
    case '=':  return l===r || Number(l)===Number(r);
    case '<>': return l!==r;
    case '<':  return Number(l) < Number(r);
    case '>':  return Number(l) > Number(r);
    case '<=': return Number(l) <= Number(r);
    case '>=': return Number(l) >= Number(r);
    default: return false;
  }
}

// ── Built-in functions ────────────────────────────────────────
async function evalCallable(node, env) {
  const name = (node.name ?? '').toLowerCase();
  const rawArgs = node.args || [];
  const A = async (i) => rawArgs[i] ? evalExpr(rawArgs[i], env) : null;
  const N = async (i) => Number(await A(i)) || 0;
  const S = async (i) => String(await A(i) ?? '');
  const all = () => Promise.all(rawArgs.map((x,i) => x ? evalExpr(x, env) : null));

  switch(name) {
    case 'abs':   { const v = await N(0); return Math.abs(v); }
    case 'int':   { return Math.floor(await N(0)); }
    case 'fix':   { return Math.trunc(await N(0)); }
    case 'cint':  { return Math.round(await N(0)); }
    case 'sgn':   { return Math.sign(await N(0)); }
    case 'sqr': case 'sqrt': { return Math.sqrt(Math.abs(await N(0))); }
    case 'log':   { const v = await N(0); return v > 0 ? Math.log(v) : 0; }
    case 'exp':   { return Math.exp(await N(0)); }
    case 'sin':   { return Math.sin(await N(0)); }
    case 'cos':   { return Math.cos(await N(0)); }
    case 'tan':   { return Math.tan(await N(0)); }
    case 'atn': case 'atan': { return Math.atan(await N(0)); }
    case 'atan2': { return Math.atan2(await N(0), await N(1)); }
    case 'rnd': {
      if (rawArgs.length > 0) {
        const n = Math.floor(await N(0));
        return n > 0 ? Math.floor(Math.random() * n) + 1 : Math.random();
      }
      return Math.random();
    }
    case 'max':   { const aa = await all(); return Math.max(...aa.map(Number)); }
    case 'min':   { const aa = await all(); return Math.min(...aa.map(Number)); }
    case 'pi':    return Math.PI;
    case 'clng': case 'csng': case 'cdbl': case 'cstr':
      return name === 'cstr' ? await S(0) : await N(0);

    case 'len':   { return String(await A(0) ?? '').length; }
    case 'left$': case 'left': { const [s,n] = await all(); return String(s??'').slice(0, Number(n)||0); }
    case 'right$': case 'right': { const [s,n] = await all(); const st=String(s??''); return st.slice(st.length-(Number(n)||0)); }
    case 'mid$': case 'mid': { const [s,p,n] = await all(); const st=String(s??''); const from=(Number(p)||1)-1; return n!=null?st.substr(from,Number(n)):st.slice(from); }
    case 'str$': case 'str': { return String(Number(await A(0))||0); }
    case 'val':   { return parseFloat(String(await A(0)??''))||0; }
    case 'asc':   { return (String(await A(0)??'')).charCodeAt(0)||0; }
    case 'chr$': case 'chr': { return String.fromCharCode(await N(0)); }
    // Mac type/ID conversion functions
    case 'cvi': { const s = await S(0); let v=0; for(let i=0;i<s.length&&i<2;i++) v=(v<<8)|s.charCodeAt(i); return v; }
    case 'cvl': { const s = await S(0); let v=0; for(let i=0;i<s.length&&i<4;i++) v=(v<<8)|s.charCodeAt(i); return v; }
    case 'cvs': { const s = await S(0); let v=0; for(let i=0;i<s.length&&i<4;i++) v=(v<<8)|s.charCodeAt(i); return v; }
    case 'mki': { const n_=await N(0); return String.fromCharCode((n_>>8)&0xFF, n_&0xFF); }
    case 'mkl': { const n_=await N(0)|0; return String.fromCharCode((n_>>24)&0xFF,(n_>>16)&0xFF,(n_>>8)&0xFF,n_&0xFF); }
    case 'hex$': case 'hex': { return (Number(await A(0))|0).toString(16).toUpperCase(); }
    case 'oct$': case 'oct': { return (Number(await A(0))|0).toString(8); }
    case 'instr': { const aa = await all(); return aa.length===2 ? String(aa[0]??'').indexOf(String(aa[1]??''))+1 : String(aa[1]??'').indexOf(String(aa[2]??''),(Number(aa[0])||1)-1)+1; }
    case 'space$': case 'space': case 'spc': { return ' '.repeat(Math.max(0,await N(0))); }
    case 'string$': case 'string': { const [n_,a_]=await all(); const c=typeof a_==='number'?String.fromCharCode(a_):String(a_??'')[0]||' '; return c.repeat(Math.max(0,Number(n_)||0)); }
    case 'tab':   { return ' '.repeat(Math.max(0,await N(0))); }
    case 'ucase$': case 'ucase': { return (await S(0)).toUpperCase(); }
    case 'lcase$': case 'lcase': { return (await S(0)).toLowerCase(); }
    case 'ltrim$': case 'ltrim': { return (await S(0)).trimStart(); }
    case 'rtrim$': case 'rtrim': { return (await S(0)).trimEnd(); }
    case 'trim$': case 'trim':   { return (await S(0)).trim(); }

    // DIALOG(n) — event dispatch
    case 'dialog': {
      const nn = rawArgs.length > 0 ? await N(0) : -1;
      if (nn === 0 || nn === -1) {
        // Inside a handler: return the event code that triggered this handler
        if (currentDialogEventCode !== null) return currentDialogEventCode;
        // Outside handler: block until next event
        const evt = await waitForEvent(0);
        if (evt.type === 'stop' && !onStopHandler) throw new Error('USER_STOP');
        if (evt.type === 'stop' && onStopHandler) { await callEventHandler(onStopHandler); return 0; }
        if (evt.type === 'menu') return 5;    // Mac event code for menu
        if (evt.type === 'mouse') return 1;
        if (evt.type === 'key') return 3;
        return 0;  // null event
      }
      if (nn > 0 && rawArgs.length >= 2) {
        const msg = await S(1);
        await alertUser('', msg);
        return 1;
      }
      // DIALOG(n) for n>0, single arg: return the reference associated with the current event
      // This is how ZBasic works: DIALOG(0) returns event type, DIALOG(eventType) returns the ref
      if (currentDialogEvent !== null) {
        const ev = currentDialogEvent;
        if (ev.winRef !== undefined) return ev.winRef;
        if (ev.ctrlRef !== undefined) return ev.ctrlRef;
        if (ev.ref !== undefined) return ev.ref;
      }
      return frontWindowId ?? outputWindowId ?? 1;
    }

    // MENU() — returns last menu selection
    case 'menu': {
      if (rawArgs.length === 0) return lastMenu;
      const n_ = await N(0);
      if (n_ === 0) return lastMenu;
      if (n_ === 1) return lastItem;
      return 0;
    }

    case 'mouse': {
      if (rawArgs.length === 0) return mouseDown ? 1 : 0;
      const n_ = await N(0);
      if (n_ === 0) {
        // Mac BASIC MOUSE(0) state machine:
        //   0  = not pressed
        //   1  = newly pressed (press edge)
        //  -1  = still held down (drag)
        //   2  = double-click (second press within ~400ms)
        if (!mouseDown) {
          await new Promise(r => setTimeout(r, 10));
          mousePrevDown = false;
          return 0;
        }
        // Mouse is down
        if (!mousePrevDown) {
          // Press edge detected — check if double-click
          const now = Date.now();
          const dt = now - mouseLastPressTime;
          mouseLastPressTime = now;
          mousePrevDown = true;
          return (dt < 400 && dt > 50) ? 2 : 1;
        }
        // Still held
        return -1;
      }
      if (n_ === 1) return mouseX;
      if (n_ === 2) return mouseY;
      return 0;
    }
    case 'mousex':   return mouseX;
    case 'mousey':   return mouseY;
    case 'mousebtn': return mouseDown ? 1 : 0;
    case 'button': {
      if (rawArgs.length === 0) return mouseDown ? 1 : 0;
      const bid = Math.floor(await N(0));
      return controlStore[bid]?.value ?? 0;
    }
    case 'button&': {
      const bid = Math.floor(await N(0));
      return controlStore[bid] ? bid : 0;
    }
    case 'edit$': {
      // EDIT$(fieldId) — read text of an edit field
      const fid = Math.floor(await N(0));
      const ctrl = controlStore[fid];
      return ctrl?.el?.value ?? ctrl?.value ?? '';
    }
    case 'event': return 0;
    case 'timer': case 'tick': return Date.now() / 17;
    case 'window': {
      const n_ = rawArgs.length > 0 ? await N(0) : 0;
      if (n_ === 0) return frontWindowId ?? outputWindowId ?? 1;  // frontmost window
      if (n_ === 1) return outputWindowId ?? frontWindowId ?? 1;  // output window
      // WINDOW(n) for n>=2: dimension queries on the front window
      const wdef = windowDefs[frontWindowId ?? outputWindowId ?? 1];
      const wc = wdef?.canvas;
      if (n_ === 2) return wdef ? wdef.logW : 512;    // window width
      if (n_ === 3) return wdef ? wdef.logH : 342;    // window height
      if (n_ === 10) return 0;   // local origin H offset
      if (n_ === 11) return 0;   // local origin V offset
      // Negative constants (injected as globalVars with _ prefix)
      if (n_ === -1) return frontWindowId ?? outputWindowId ?? 1;   // _activeWnd
      if (n_ === -2) return outputWindowId ?? frontWindowId ?? 1;   // _outputWnd
      if (n_ === -3) return outputWindowId ?? frontWindowId ?? 1;   // _outputWClass (window class)
      if (n_ === -4) return 0;   // _wndPointer — Mac WindowPtr (no-op)
      if (n_ === -5) return currentEditField ?? 0;   // _EFnum — current edit field
      if (n_ === -6) return currentEditField ?? 0;   // _lastEFnum
      if (n_ === -7) return 0;   // _selStart
      if (n_ === -8) return 0;   // _selEnd
      if (n_ === -9) return 0;   // _EFTextLen
      if (n_ < 0) return currentEditField ?? 0;
      return 0;
    }
    case 'varptr': return 0;  // memory address — stub 0 (used for Toolbox Pascal-string passing)
    case 'peek': case 'peek byte': { const a = Math.floor(await N(0)); return fakeReadU16(a) & 0xFF; }
    case 'peek word': { const a = Math.floor(await N(0)); return fakeReadU16(a); }
    case 'peek long': { const a = Math.floor(await N(0)); return fakeReadU32(a); }
    case 'usr': case 'usr_': return 0;
    case 'screenbits': return 8;
    case 'systemversion': return 0x0700;
    case 'noevent': return -1;
    case 'system': {
      const n_ = await N(0);
      // Mac System globals at well-known offsets
      if (n_ === 4)  return 0;      // refNum of system resource file
      if (n_ === 6)  return 512;    // screen width
      if (n_ === 7)  return 342;    // screen height
      if (n_ === 8)  return 0x0700; // system version (7.0)
      if (n_ === 11) return 8;      // screen depth (bits)
      return 0;
    }

    // Array / misc
    case 'ubound': { const [arr] = await all(); return Array.isArray(arr) ? arr.length-1 : 0; }
    case 'lbound': return 0;
    case 'vartype': return 0;

    case 'ptinrect': {
      // FN PTINRECT(pt, rect(i)) — always uses current mouseX/mouseY for the point
      const rectNode = rawArgs[1];
      let left = 0, top = 0, right = 512, bottom = 512;
      if (rectNode?.type === 'callable') {
        const arrName = rectNode.name;
        const ri0 = rectNode.args?.[0] ? Math.floor(Number(await evalExpr(rectNode.args[0], env))) : 0;
        const ri1 = rectNode.args?.[1] ? Math.floor(Number(await evalExpr(rectNode.args[1], env))) : null;
        const arr = env[arrName] ?? globalVars[arrName];
        if (Array.isArray(arr)) {
          let row = arr, base = ri0;
          if (ri1 !== null && Array.isArray(arr[ri0])) { row = arr[ri0]; base = ri1; }
          left = Number(row[base] ?? 0); top = Number(row[base+1] ?? 0);
          right = Number(row[base+2] ?? 0); bottom = Number(row[base+3] ?? 0);
        }
      }
      return (mouseX >= left && mouseX < right && mouseY >= top && mouseY < bottom) ? -1 : 0;
    }

    case 'ptinrgn': return 0;  // region hit-test stub

    case 'bittst': {
      // FN BITTST(ptr, bit) — test a bit in memory (stub: keyboard state, always false)
      return 0;
    }
    case 'stringwidth': {
      const str = String(await A(0) ?? '');
      if (!ctx) return str.length * Math.round(textSize * 0.6);
      ctx.save(); ctx.font = `${textSize}px Geneva, Helvetica, sans-serif`;
      const w = Math.round(ctx.measureText(str).width);
      ctx.restore(); return w;
    }
    case 'sizeresource': return 0;
    case 'finderinfo': return 0;   // FN FINDERINFO(...) — no document from Finder
    case 'gestalt': return 0;      // FN GESTALT(...) stub
    case 'countresources': case 'count1resources': return 0;
    case 'getindresource': case 'get1indresource': case 'getindtype': return 0;
    case 'curresfile': return 0;
    case 'countmitems': {
      const handle = Math.floor(Number(await N(0))) || 0;
      return menuDefs[handle] ? Object.keys(menuDefs[handle].items).length : 0;
    }
    case 'handtohand': return 0;
    case 'gethandlesize': return 0;
    case 'sectrect': return 0;
    case 'equalrect': return 0;
    case 'getcrefcon': return 0;
    case 'alert': case 'notealert': case 'caution': case 'stop':
      return 1;  // alert dialogs always return OK (1)

    default: {
      // User function?
      const fn = funcDefs[name];
      if (fn) return execUserFuncCall({type:'userFuncCall', name, args: rawArgs}, env);
      // Array access?
      const arr = env[name] ?? globalVars[name];
      if (Array.isArray(arr)) {
        const idxs = await all();
        let v = arr;
        for (const idx of idxs) { if (Array.isArray(v)) v = v[Number(idx)||0]; else break; }
        return (typeof v === 'number' || typeof v === 'string') ? v : 0;
      }
      return 0;
    }
  }
}

// ── Mac 16-colour palette ─────────────────────────────────────
function mac16(idx) {
  const p = ['#ffffff','#ffff00','#ff6600','#dd0000','#ff0099','#330099',
             '#0000cc','#0099ff','#00bb00','#006600','#663300','#996633',
             '#cccccc','#888888','#444444','#000000'];
  return p[((idx%16)+16)%16];
}

// ── Dialog helpers ────────────────────────────────────────────
function promptUser(title, msg) {
  const label = [title, msg].filter(Boolean).join('\n');
  return Promise.resolve(window.prompt(label) ?? null);
}
function alertUser(title, msg) {
  const label = [title, msg].filter(Boolean).join('\n');
  window.alert(label);
  return Promise.resolve(1);
}

// ── Init ──────────────────────────────────────────────────────
console.log('ZBasic emulator ready.');
</script>

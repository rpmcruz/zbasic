<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZBasic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Programs size their text boxes for the Mac's Geneva, which is much wider
   than Helvetica/Arial: with those, MacPThy's message boxes came out too
   narrow for the buttons placed in them. Verdana (Windows) and DejaVu Sans
   (Linux) have nearly Geneva's widths. Keep in step with MAC_FONTS. */
:root { --geneva: 'Geneva', 'Verdana', 'DejaVu Sans', sans-serif; }
body {
  background: #1a1a1a;
  font-family: system-ui, sans-serif;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  /* dvh tracks the visible area as a phone's URL bar retracts; vh is what it
     would be with the bar hidden, which cuts the bottom off the canvas. */
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  color: #ccc;
}

/* ── Toolbar ──────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  /* Wraps rather than overflowing: the page cannot scroll (body is
     overflow:hidden), so on a phone-width screen an unwrapped toolbar put the
     Run button outside the viewport with no way to reach it. */
  flex-wrap: wrap;
  gap: 8px;
  padding: 5px 10px;
  background: #222;
  border-bottom: 1px solid #383838;
  flex-shrink: 0;
}
.tb-btn {
  background: #2d2d2d;
  border: 1px solid #555;
  border-radius: 4px;
  color: #ddd;
  padding: 5px 14px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  white-space: nowrap;
  user-select: none;
}
.tb-btn:hover:not(:disabled) { background: #3a3a3a; border-color: #888; color: #fff; }
.tb-btn:disabled { opacity: 0.35; cursor: default; }
.tb-btn.running { color: #ff6060; border-color: #cc4444; background: #2d1a1a; }
#file-select {
  width: 200px;
  flex-shrink: 0;
  background: #2d2d2d;
  border: 1px solid #555;
  border-radius: 4px;
  color: #ddd;
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
}
#file-select:disabled { opacity: 0.5; }

/* ── Program view ─────────────────────────────────────────── */
#program-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#dynamic-menubar {
  background: white;
  border-bottom: 1px solid #000;
  height: 20px;
  display: none;
  align-items: stretch;
  flex-shrink: 0;
  user-select: none;
  font-family: 'Chicago', 'Geneva', system-ui, sans-serif;
  font-size: 12px;
}
#dynamic-menubar.active { display: flex; }

.dyn-menu {
  padding: 0 10px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  color: #000;
}
.dyn-menu:hover, .dyn-menu.open { background: #000; color: #fff; }
.dyn-menu.dis { pointer-events: none; color: #aaa; cursor: default; }
.dyn-menu.off, .dyn-menu.off:hover, .dyn-menu.off.open { color: #aaa; }
.dyn-menu-drop {
  display: none;
  position: absolute;
  top: 20px; left: 0;
  background: white;
  border: 1px solid #000;
  min-width: 140px;
  z-index: 200;
  box-shadow: 2px 2px 0 #000;
  color: #000;
}
.dyn-menu.open .dyn-menu-drop { display: block; }
.dyn-menu-item {
  padding: 3px 18px 3px 20px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
}
.dyn-menu-item:hover { background: #000; color: #fff; }
.dyn-menu-item.sep { border-top: 1px solid #aaa; padding: 0; margin: 2px 0; pointer-events: none; }
.dyn-menu-item.dis { color: #aaa; pointer-events: none; }
/* Hierarchical menus: Supermarket hangs "Search Strategy", "Shoppers Count",
   "Faster" and "Slower" off Options items as Mac submenus (cmd char 0x1B). */
.dyn-menu-item.has-sub { position: relative; padding-right: 26px; }
.dyn-menu-item.has-sub::after {
  content: '\25B6'; position: absolute; right: 6px; top: 3px; font-size: 9px;
}
.dyn-submenu-drop {
  display: none;
  position: absolute;
  top: -1px; left: 100%;
  background: white;
  border: 1px solid #000;
  min-width: 140px;
  z-index: 210;
  box-shadow: 2px 2px 0 #000;
  color: #000;
}
.dyn-menu-item.has-sub:hover > .dyn-submenu-drop { display: block; }
.dyn-menu-item.has-sub:hover { background: #000; color: #fff; }
.dyn-submenu-drop .dyn-menu-item { background: white; color: #000; }
.dyn-submenu-drop .dyn-menu-item:hover { background: #000; color: #fff; }

#tab-bar {
  display: none;
  background: #e0e0e0;
  border-bottom: 1px solid #888;
  flex-shrink: 0;
  overflow-x: auto;
  white-space: nowrap;
  font-family: 'Chicago', 'Geneva', system-ui, sans-serif;
  font-size: 11px;
}
.win-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  cursor: pointer;
  border-right: 1px solid #888;
  background: #ccc;
  color: #333;
}
.win-tab.active { background: #fff; font-weight: bold; color: #000; }
.win-tab-close {
  position: relative;
  flex: 0 0 auto;
  width: 11px; height: 11px;
  border: 1px solid #000;
  background: #fff;
  color: #000;
  cursor: pointer;
}
.win-tab-close::before { content: ''; position: absolute; inset: -6px; }   /* easier to hit */
.win-tab-close::after {   /* a cross, so the Mac's close box also reads as "close" today */
  content: ''; position: absolute; inset: 1px;
  background: linear-gradient(45deg, transparent 42%, currentColor 42% 58%, transparent 58%),
              linear-gradient(-45deg, transparent 42%, currentColor 42% 58%, transparent 58%);
}
.win-tab-close:hover { background: #000; color: #fff; }

/* ── Canvas wrapper — contains the scaled window ─────────── */
#canvas-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #555;
}
#no-windows { max-width: 28em; padding: 16px; color: #ddd; font-size: 14px; line-height: 1.5; text-align: center; }
.win-container {
  /* Width/height are set in px by layoutWindows(), which preserves the window's
     logical aspect ratio. Stretching to 100%/100% here would distort the canvas
     and desync it from the absolutely-positioned Mac controls. */
  display: none;
  background: white;
  position: relative;
}
.win-container.front { display: block; }
.win-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.win-textedit {
  position: absolute;
  overflow-y: auto;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
  background: white;
  color: black;
  box-sizing: border-box;
  padding: 2px 4px;
}
.mac-ctrl {
  position: absolute;
  box-sizing: border-box;
  font-family: var(--geneva);
  margin: 0;
  padding: 0;
}
.mac-btn {
  background: #e0e0e0;
  border: 1px solid #555;
  border-radius: 3px;
  padding: 0 4px;
  font-size: var(--ctrl-font, 12px);
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  width: 100%;
  height: 100%;
}
.mac-btn:disabled { color: #aaa; cursor: default; }
/* Modal alerts, built from the program's own ALRT/DITL resources. */
.mac-alert-back {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.25);
}
.mac-alert {
  background: #fff; color: #000;
  border: 2px solid #000; border-radius: 4px;
  box-shadow: 3px 3px 0 rgba(0,0,0,.5);
  padding: 14px 16px 12px;
  min-width: 260px; max-width: 420px;
  font-family: var(--geneva); font-size: 12px;
}
.mac-alert-body { display: flex; gap: 12px; align-items: flex-start; }
.mac-alert-icon { font-size: 28px; line-height: 1; }
.mac-alert-text { white-space: pre-wrap; flex: 1; }
.mac-alert-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.mac-alert-btn {
  font: inherit; padding: 2px 14px; min-width: 60px;
  background: #e0e0e0; border: 1px solid #555; border-radius: 3px; cursor: pointer;
}
.mac-alert-btn.default { border-width: 3px; border-radius: 8px; font-weight: bold; }
.mac-alert-btn:disabled { color: #aaa; cursor: default; }
/* The Standard File dialog that FILES$ puts up. */
.mac-alert.sf { width: 440px; max-width: calc(100vw - 32px); }
.sf-title { font-weight: bold; margin-bottom: 8px; white-space: pre-wrap; }
.sf-body { display: flex; gap: 12px; }
.sf-list {
  flex: 1; min-width: 0; height: 168px; overflow-y: auto;
  border: 1px solid #000; background: #fff; outline: none;
}
.sf-item { display: flex; justify-content: space-between; gap: 10px; padding: 2px 6px; cursor: default; }
.sf-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sf-item.sel { background: #000; color: #fff; }
.sf-type { color: #888; font-size: 10px; align-self: center; }
.sf-item.sel .sf-type { color: #ccc; }
.sf-empty { padding: 8px; color: #888; font-style: italic; }
.sf-side { display: flex; flex-direction: column; gap: 6px; }
.sf-side hr { border: none; border-top: 1px solid #aaa; margin: 4px 0; }
.sf-name { display: block; width: 100%; margin-top: 8px; font: inherit; padding: 2px 4px; border: 1px solid #000; }
.sf-note { margin-top: 8px; color: #666; font-size: 11px; }
.sf-note.warn { color: #b00; }
.mac-btn.selected { background: #000; color: #fff; }
/* BUTTON type 2 is a check box and type 3 a radio button, not a push button.
   Grglflx's setup dialog is built almost entirely from these, most of them
   with an empty title because it draws the caption alongside with TEXTBOX
   (see "Format Wnd"), so they have to render as a bare indicator. */
.mac-check, .mac-radio {
  background: transparent;
  border: none;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  /* The Mac draws a 12-pixel box and starts the title 4 pixels after it, so a
     control only 15 pixels wide — MacPThy's budget-line tool, titled "B" — shows
     the box alone. */
  gap: calc(4px * var(--ui-scale, 1));
  padding: 0;
}
.mac-check.selected, .mac-radio.selected { background: transparent; color: #000; }
.mac-check .ind, .mac-radio .ind {
  position: relative;
  flex: 0 0 auto;
  width: calc(12px * var(--ui-scale, 1)); height: calc(12px * var(--ui-scale, 1));
  border: 1px solid #000;
  background: #fff;
}
.mac-radio .ind { border-radius: 50%; }
.mac-radio.selected .ind::after {
  content: ''; position: absolute; inset: 2px;
  border-radius: 50%; background: #000;
}
.mac-check.selected .ind::after {
  content: '\2715'; position: absolute; inset: 0;
  font-size: calc(10px * var(--ui-scale, 1)); line-height: calc(12px * var(--ui-scale, 1)); text-align: center; color: #000;
}
.mac-check:disabled .ind, .mac-radio:disabled .ind { border-color: #aaa; }
.mac-check:disabled .ind::after, .mac-radio:disabled .ind::after { background: #aaa; color: #aaa; }
.mac-btn .lbl { overflow: hidden; white-space: nowrap; }
/* ── Narrow screens ───────────────────────────────────────── */
/* Vertical space is scarce on a phone and width is what limits the window
   scale, so give the chrome less of it and let the window sit at the top
   instead of floating in the middle of the leftover grey. */
@media (max-width: 700px) {
  #toolbar { gap: 5px; padding: 4px 6px; }
  .tb-btn { padding: 4px 10px; }
  #prog-select, #file-select { max-width: 40vw; }
  #canvas-wrapper { align-items: flex-start; }
}
.mac-editfield {
  /* --ef-size is the field's own point size (the TEXT size in force when it
     was built); --ui-scale is how many screen pixels one window pixel takes. */
  font-size: calc(var(--ef-size, 12) * var(--ui-scale, 1) * 1px);
  line-height: 1;
  background: transparent;
  border: none;
  padding: 0 1px;
  display: block;
  outline: none;
  color: #000;
}
.mac-editfield.framed { background: white; border: 1px solid #000; }
.mac-editfield:read-only { cursor: default; }
</style>
</head>
<body>

<div id="toolbar">
  <select id="prog-select" hidden onchange="loadProgram(this.value)">
    <option value="">— choose a program —</option>
  </select>
  <button class="tb-btn" id="btn-open" onclick="openFile()">Open Folder</button>
  <select id="file-select" disabled onchange="selectFile(this.value)">
    <option value="">— no file loaded —</option>
  </select>
  <button class="tb-btn" id="btn-run" onclick="toggleRun()" disabled>Run</button>
</div>

<div id="program-view">
  <div id="tab-bar"></div>
  <div id="dynamic-menubar"></div>
  <div id="canvas-wrapper"></div>
</div>


<input type="file" id="file-input" style="display:none" webkitdirectory multiple>

<script src="zbasic-compiled.js?v=7a6c364775"></script>
<script>
const parser = ZBasicParser;
// Device pixels per window pixel in every canvas. It follows the size the
// windows are actually shown at (times devicePixelRatio), so drawing is done at
// screen resolution rather than drawn small and stretched. Programs keep working
// in their own window coordinates through the context transform; the few places
// that touch pixels directly convert with dev(). See rescaleCanvases().
let CANVAS_SCALE = 2;
const dev = v => Math.round(v * CANVAS_SCALE);

// ── File storage ──────────────────────────────────────────────
const files = {};
let loadedFiles = [];
let loadedRsrc = [];    // names of the resource forks loaded with the program
let currentProgram = null;

// ── Window/Canvas management ──────────────────────────────────
// windowDefs[id] = { title, container, canvas, ctx, teRecords: {} }
const windowDefs = {};
// ── TextEdit handle store ─────────────────────────────────────
const teHandleMap = {};  // handle(fakeAddr) -> { div, text, lineHeight }

// ── Fake Mac memory (for PEEK/POKE and resource handles) ───────
const fakeMemBlocks = [];  // [{base, data: Uint8Array}]
let nextFakeAddr = 0x10000;

function fakeMalloc(size) {
  const base = nextFakeAddr;
  nextFakeAddr += size + 8;
  const data = new Uint8Array(size);
  fakeMemBlocks.push({base, data});
  return base;
}
function _fakeBlock(addr, size) {
  for (const b of fakeMemBlocks)
    if (addr >= b.base && addr + size <= b.base + b.data.length) return b;
  return null;
}
// Every access to emulated memory goes through these, so that the bytes of a
// variable (see "Variable memory" below) are always its current value.
function fakeRead(addr, len) {
  varsToMem(addr, len);
  const b = _fakeBlock(addr, len);
  return b ? b.data.subarray(addr - b.base, addr - b.base + len) : new Uint8Array(len);
}
function fakeWrite(addr, bytes) {
  const b = _fakeBlock(addr, bytes.length); if (!b) return;
  varsToMem(addr, bytes.length);   // a write to part of a variable keeps the rest of it
  b.data.set(bytes, addr - b.base);
  memToVars(addr, bytes.length);
}
function fakeReadU32(addr) { const d = fakeRead(addr, 4); return ((d[0]<<24)|(d[1]<<16)|(d[2]<<8)|d[3]) >>> 0; }
function fakeReadU16(addr) { const d = fakeRead(addr, 2); return (d[0]<<8)|d[1]; }
function fakeReadBytes(addr, len) { return fakeRead(addr, len).slice(); }
function fakeWriteU32(addr, v) { fakeWrite(addr, [(v>>>24)&0xFF, (v>>>16)&0xFF, (v>>>8)&0xFF, v&0xFF]); }
function fakeWriteU16(addr, v) { fakeWrite(addr, [(v>>8)&0xFF, v&0xFF]); }
function fakeWriteBytes(addr, bytes) { fakeWrite(addr, bytes); }

// The window manager's grafPort. Only its portRect (offset 8) is ever read —
// programs BLOCKMOVE it out to learn the screen bounds, then centre their
// windows in it and use it to reset the clip. 640x480 is a real Mac screen size
// and is at least as large as every window these programs open, so resetting
// the clip to it never crops anything.
const SCREEN_W = 640, SCREEN_H = 480;
let _wMgrPort = 0;
function wMgrPortPtr() {
  if (!_wMgrPort) {
    _wMgrPort = fakeMalloc(32);
    fakeWriteU16(_wMgrPort + 8,  0);          // top
    fakeWriteU16(_wMgrPort + 10, 0);          // left
    fakeWriteU16(_wMgrPort + 12, SCREEN_H);   // bottom
    fakeWriteU16(_wMgrPort + 14, SCREEN_W);   // right
  }
  return _wMgrPort;
}

// ── Variable memory ───────────────────────────────────────────
// ZBasic gives every variable a fixed place in memory when it compiles the
// program: simple variables in one block and arrays in another, each in the
// order the source first mentions them. Programs rely on it. CDraw and Grglflx
// save a document by writing out the bytes from VARPTR(FirstVar) to
// VARPTR(LastVar) — FirstVar is DIMmed first, "We must insure that these items
// are FIRST in the list", LastVar is only mentioned at the very end, and the
// save routine DIMs LastArray "so array is at end of list" — and read it back
// the same way. They also BLOCKMOVE a Rect into four DIMmed integers and
// characters into a string's bytes.
//
// The interpreter keeps the variables themselves in globalVars, so this lays
// the same blocks out in emulated memory and keeps the two in step: reading the
// bytes first stores the variables' current values in them (varsToMem), and
// writing them stores the new values back into the variables (memToVars). The
// order and the integer and string sizes are ZBasic's; reals take 8 bytes so
// that saving and loading a number gives back exactly the same number.
let varMem = null;   // {base, end, bytes, view, slots (by address), byName}
const VAR_SIZE = {int: 2, long: 4, real: 8};

function varKind(canon) {
  if (canon.endsWith('$')) return 'str';
  const t = varTypes[canon] ?? suffixType(canon);
  return t === 'long' ? 'long' : (t === 'real' || t === 'mixed') ? 'real' : 'int';
}

// Called once per run, after the equates are known (array bounds use them).
async function layoutVariables(program) {
  const scalars = [], arrays = [], seen = new Set();
  const scalar = (name, strLen) => {
    const canon = normVarName(name);
    // `_name` is a compile-time constant and ERROR a reserved word, not variables.
    if (!canon || seen.has(canon) || canon.startsWith('_') || canon === 'error' || recordOf[canon]) return;
    seen.add(canon);
    scalars.push({name: canon, kind: varKind(canon), strLen: strLen ?? 255});
  };
  const walk = node => {
    if (!node || typeof node !== 'object') return;
    if (Array.isArray(node)) { node.forEach(walk); return; }
    switch (node.type) {
      case 'localFunction': return;   // a LOCAL FN's variables are its own
      case 'dim':
        for (const a of node.args ?? []) {
          if (a.dotType || a.size != null) continue;   // records, DIM name;bytes
          const canon = normVarName(a.name);
          if (!a.dims?.length) scalar(a.name, a.prefix);
          else if (!seen.has(canon + '()')) {
            seen.add(canon + '()');
            arrays.push({name: canon, kind: varKind(canon), strLen: a.prefix ?? 255, dimExprs: a.dims});
          }
        }
        return;
      case 'variable': scalar(node.name); return;
      case 'assign': if (!node.idx && !node.fields?.length) scalar(node.name); break;
      case 'for': scalar(node.variable); break;
    }
    for (const k in node) walk(node[k]);
  };
  walk(program);

  let size = 0;
  const slots = [];
  const place = (s, elemSize, dims) => {
    s.elemSize = elemSize;
    s.dims = dims;
    s.count = dims ? dims.reduce((a, b) => a * b, 1) : 1;
    s.addr = size;
    size += (s.count * elemSize + 1) & ~1;   // word aligned, like the 68000 wants
    slots.push(s);
  };
  const elemSize = s => s.kind === 'str' ? s.strLen + 1 : VAR_SIZE[s.kind];
  for (const s of scalars) place(s, elemSize(s), null);
  for (const a of arrays) {
    const dims = [];
    for (const d of a.dimExprs) {
      let n = 0;
      try { n = subIdx(await evalExpr(d, globalVars)); } catch (e) { /* not a constant */ }
      dims.push(Math.max(0, n) + 1);
    }
    place(a, elemSize(a), dims);
  }
  const base = fakeMalloc(size);
  const bytes = _fakeBlock(base, size).data;
  for (const s of slots) s.addr += base;
  varMem = {base, end: base + size, bytes, view: new DataView(bytes.buffer, bytes.byteOffset, size), slots,
            byName: new Map(slots.map(s => [s.dims ? s.name + '()' : s.name, s]))};
}

// The address VARPTR gives a global variable or array element, or 0.
async function varAddress(node, env) {
  if (!varMem || !node?.name) return 0;
  const canon = normVarName(node.name);
  if (env !== globalVars && Object.prototype.hasOwnProperty.call(env, canon)) return 0;   // a LOCAL FN's own
  if (node.type === 'variable') return varMem.byName.get(canon)?.addr ?? 0;
  const s = varMem.byName.get(canon + '()');
  if (!s || !node.args?.length) return 0;
  let flat = 0;
  for (let k = 0; k < s.dims.length; k++)
    flat = flat * s.dims[k] + (node.args[k] ? subIdx(await evalExpr(node.args[k], env)) : 0);
  return s.addr + flat * s.elemSize;
}

// Calls fn(slot, first, last) for the elements of every variable that overlaps
// the bytes [addr, addr+len).
function varSlotsIn(addr, len, fn) {
  if (!varMem || addr >= varMem.end || addr + len <= varMem.base) return;
  const {slots} = varMem;
  let lo = 0, hi = slots.length;
  while (lo < hi) {
    const m = (lo + hi) >> 1;
    if (slots[m].addr + slots[m].count * slots[m].elemSize <= addr) lo = m + 1; else hi = m;
  }
  for (let i = lo; i < slots.length && slots[i].addr < addr + len; i++) {
    const s = slots[i];
    const first = Math.max(0, Math.floor((addr - s.addr) / s.elemSize));
    const last = Math.min(s.count - 1, Math.floor((addr + len - 1 - s.addr) / s.elemSize));
    if (first <= last) fn(s, first, last);
  }
}
// Element i of an array slot, as the path of subscripts into the nested arrays.
function slotPath(s, i) {
  const path = [];
  for (let k = s.dims.length - 1; k >= 0; k--) { path.unshift(i % s.dims[k]); i = Math.floor(i / s.dims[k]); }
  return path;
}
// An array is also kept under its plain name (see arrKey), where it is not the
// scalar of that name: CDraw has both ShowFlag() and, never assigned, ShowFlag.
const isArrayAlias = v => typeof v === 'object' && v !== null;
function slotGet(s, i) {
  if (!s.dims) return isArrayAlias(globalVars[s.name]) ? undefined : globalVars[s.name];
  let a = globalVars[arrKey(s.name)];
  if (pendingGets.size) settleGet(a);
  for (const k of slotPath(s, i)) a = Array.isArray(a) ? a[k] : undefined;
  return a;

// and release land on different elements is no click — so the close box, and
// every tab, ignored a real mouse.
let tabsSig = null;
// A Mac program keeps running when its last window is closed — Supermarket
// does — with only its menu bar left, which in a browser looks as if it had
// hung. Say so, and how to end it.
function showNoWindowsNote() {
  const wrap = document.getElementById('canvas-wrapper');
  let note = document.getElementById('no-windows');
  const show = running && !Object.keys(windowDefs).length;
  if (!show) { note?.remove(); return; }
  if (!note) {
    note = document.createElement('div');
    note.id = 'no-windows';
    note.textContent = 'The program has no windows open but is still running, as a Mac program would be. ' +
                       'Use its File › Quit, or the Stop button, to end it.';
    wrap.appendChild(note);
  }
}

function renderTabs() {
  showNoWindowsNote();
  const bar = document.getElementById('tab-bar');
  const ids = Object.keys(windowDefs).map(Number).sort((a, b) => a - b);
  const sig = ids.map(id => `${id}:${windowDefs[id].title}`).join('\n') + `\n${frontWindowId}`;
  if (sig === tabsSig) return;
  tabsSig = sig;
  // The page is titled after the front window. It used to keep the title of
  // the last window opened, such as MacPThy's long-closed "Instructions".
  document.title = windowDefs[frontWindowId]?.title || 'ZBasic';
  bar.innerHTML = '';
  for (const id of ids) {
    const t = document.createElement('div');
    t.className = 'win-tab' + (id === frontWindowId ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = windowDefs[id].title;
    // Clicking a window must report the Mac "window activated" event (DIALOG
    // code 3), not just raise it. MacPThy dismisses its Instructions window
    // with `IF D0=3 THEN WINDOW DN : IF DN=1 THEN Reading=0` — with no event
    // the tab looked dead and the program could never be advanced.
    t.onclick = () => {
      if (id === frontWindowId) return;
      bringToFront(id);
      if (running) pushEvent('dialog', {code: 3, winRef: id});
    };
    // The close box sits at the left, as in a Mac title bar — MacPThy's
    // instructions send the reader to "the little box at the top left-hand
    // corner of the window". DIALOG(D0) reports the window through `winRef`.
    // The main (lowest-numbered) window has none: closing it leaves a Mac
    // program running with no window at all (Supermarket), which here looks
    // broken; programs are ended with their own Quit, or Stop.
    if (id !== ids[0]) {
      const x = document.createElement('span');
      x.className = 'win-tab-close';
      x.title = 'Close window';
      x.onclick = (e) => { e.stopPropagation(); pushEvent('dialog', {code: 4, winRef: id}); };
      t.appendChild(x);
    }
    t.appendChild(label);
    bar.appendChild(t);
  }
  bar.style.display = ids.length > 0 ? 'flex' : 'none';
}

function showCanvas() {
  // Drawing goes to the OUTPUT window, which is not necessarily the active
  // one — WINDOW OUTPUT redirects drawing without activating anything. Raising
  // the output window here made WINDOW(0) report it as active, so Grglflx,
  // which formats its main window while the setup dialog is up and then does
  // `FN Push(WINDOW(0)) : FN Push(CloseEvent)`, closed its main window instead
  // of the dialog and the game never started.
  if (frontWindowId !== null && windowDefs[frontWindowId]) return;
  if (outputWindowId !== null) bringToFront(outputWindowId);
}


// ── Mouse ─────────────────────────────────────────────────────
// ZBasic has two mouse dialects, chosen by DEF MOUSE (Mac appendix: "DEF MOUSE
// [=] n — 0 = ZBasic mouse syntax, <> 0 = MSBASIC compatibility syntax").
//
//   ZBasic syntax   MOUSE(0) initialises the mouse, MOUSE(1)/(2) are the
//                   current position and MOUSE(3) is the button state.
//   MSBASIC syntax  MOUSE(0) *samples* the button and latches everything else:
//                     0 / ±1 / ±2 / ±3  nothing / single / double / triple
//                                       click, negative while still held down
//                     MOUSE(1),(2)      where the mouse is
//                     MOUSE(3),(4)      where the button was last pressed
//                     MOUSE(5),(6)      where it was last released
//
// MacPThy opens with `DEF MOUSE = 1` and every one of its drawing tools waits
// for a click and then reads the click point out of MOUSE(3)/MOUSE(4). Answering
// those with the ZBasic button state (and 0 for MOUSE(4)) put the start point at
// (0,0) or (-1,0), outside the drawing area, so the guard each tool wraps around
// it rejected the click: the marker, line, curve and axis tools all selected
// themselves and then did nothing at all.
let msMouseSyntax = false;   // set by DEF MOUSE <> 0
let mouseDown = false, mouseX = 0, mouseY = 0;
let mousePrevDown = false;  // reported as "down" by a previous MOUSE(0) poll
let mouseLastPressTime = 0; // timestamp of last press edge, for click-count detection
let mouseClickLatch = false; // a press seen since the last MOUSE(0) poll, so short clicks survive
let mouseClicks = 1;        // 1/2/3 — length of the current multi-click run
let mousePressX = 0, mousePressY = 0;     // MOUSE(3), MOUSE(4)
let mouseReleaseX = 0, mouseReleaseY = 0; // MOUSE(5), MOUSE(6)
const MOUSE_MULTI_MS = 400;               // Mac default double-click time

// Every press and release goes through these, so the synthetic click a control
// reports (see createButtonCtrl) latches the same state a canvas click does —
// which is what makes a tool button's own coordinates land in MOUSE(3)/(4) and
// be rejected by the drawing-area guard, exactly as on the Mac.
// `clicks` is the browser's own click counter (MouseEvent.detail), which already
// applies the platform's double-click interval; the timer below is the fallback
// for presses that arrive without one (touch, synthetic events).
function notePress(x, y, clicks) {
  mouseX = x; mouseY = y;
  mousePressX = x; mousePressY = y;
  const now = Date.now();
  mouseClicks = clicks >= 1 ? Math.min(clicks, 3)
              : (now - mouseLastPressTime < MOUSE_MULTI_MS) ? Math.min(mouseClicks + 1, 3) : 1;
  mouseLastPressTime = now;
  mouseDown = true; mouseClickLatch = true;
  if (running && onMouseHandler) pushEvent('mouse', {x, y});
}
function noteRelease() {
  mouseReleaseX = mouseX; mouseReleaseY = mouseY;
  mouseDown = false; mousePrevDown = false;
}

function canvasCoords(clientX, clientY) {
  const wdef = frontWindowId !== null ? windowDefs[frontWindowId] : null;
  const c = wdef?.canvas ?? canvas;
  if (!c) return [0, 0];
  const r = c.getBoundingClientRect();
  const logW = wdef?.logW ?? (c.width / CANVAS_SCALE);
  const logH = wdef?.logH ?? (c.height / CANVAS_SCALE);
  return [
    Math.round((clientX - r.left) * logW / r.width),
    Math.round((clientY - r.top)  * logH / r.height),
  ];
}

// The modifier keys, for GETKEYS: from every key and mouse event, so a Shift
// held down before the click still counts.
const modifiersDown = {shift: false, option: false, command: false, control: false, caps: false};
for (const type of ['keydown', 'keyup', 'mousedown', 'mousemove', 'mouseup']) {
  document.addEventListener(type, e => {
    Object.assign(modifiersDown, {shift: e.shiftKey, option: e.altKey, command: e.metaKey, control: e.ctrlKey,
                                  caps: !!e.getModifierState?.('CapsLock')});
  }, true);
}

const canvasWrapper = document.getElementById('canvas-wrapper');
canvasWrapper.addEventListener('mousedown', e => {
  const [x, y] = canvasCoords(e.clientX, e.clientY);
  notePress(x, y, e.detail);
});
canvasWrapper.addEventListener('mouseup',   () => noteRelease());
// The mouse is followed over the whole page, as the Mac knows where it is
// anywhere on the screen. Followed only over the windows' area, it kept its
// last place there while it went up to the menu bar, and MacPThy, which picks
// its cursor by where the mouse is, kept its drawing-tool cursor up there.
document.addEventListener('mousemove', e => { [mouseX, mouseY] = canvasCoords(e.clientX, e.clientY); });
canvasWrapper.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const [x, y] = canvasCoords(t.clientX, t.clientY);
  notePress(x, y);
}, {passive: false});
canvasWrapper.addEventListener('touchend',  e => { e.preventDefault(); noteRelease(); }, {passive: false});
canvasWrapper.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  [mouseX, mouseY] = canvasCoords(t.clientX, t.clientY);
}, {passive: false});

document.addEventListener('click', e => {
  if (!e.target.closest('.dyn-menu'))
    document.querySelectorAll('.dyn-menu.open').forEach(m => m.classList.remove('open'));
});

// ── File loading ──────────────────────────────────────────────
// Empty the file store so a newly chosen program starts from nothing.
function resetFileStore() {
  Object.keys(files).forEach(k => delete files[k]);
  Object.keys(rsrcTexts).forEach(k => delete rsrcTexts[k]);
  Object.keys(macResources).forEach(k => delete macResources[k]);
  loadedFiles.length = 0;
  loadedRsrc.length = 0;
}

// Add one file (an ArrayBuffer) to the store. A resource fork goes to the
// resource map; anything else is program text in Mac Roman, decoded here so
// that strings hold the characters the program means — MacPThy's title screen
// credits "ZBasic™", and ™ is byte 0xAA, which Latin-1 reads as "ª". Values
// cross back into bytes only where the Mac would see bytes: CHR$/ASC, and the
// emulated memory behind VARPTR and resources.
function addFile(name, data) {
  if (name.toLowerCase().endsWith('.rsrc')) { loadedRsrc.push(name); parseRsrcFile(data); return; }
  files[name] = macRomanToStr(new Uint8Array(data));
  if (!loadedFiles.includes(name)) loadedFiles.push(name);
}

// ── Program library ───────────────────────────────────────────
// Over HTTP there is no directory listing, so which programs exist and which
// files each one needs is written into progs/programs.json by zbasic-compile.js. Without
// that file (or when index.html is opened straight off the disk) the picker
// stays hidden and "Open Folder" is the only way in.
let programList = [];
async function loadProgramList() {
  try {
    const resp = await fetch('progs/programs.json');
    if (!resp.ok) return;
    programList = await resp.json();
  } catch (e) { return; }        // not published alongside the page
  if (!programList.length) return;
  const sel = document.getElementById('prog-select');
  programList.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = String(i); opt.textContent = p.name;
    sel.appendChild(opt);
  });
  sel.hidden = false;
  // index.html?prog=Supermarket opens that program and runs it, so the README
  // can link straight to each one.
  const want = new URLSearchParams(location.search).get('prog');
  const idx = want ? programList.findIndex(p => p.name.toLowerCase() === want.toLowerCase()) : -1;
  if (idx >= 0) { await loadProgram(idx); runProgram(); }
}

async function loadProgram(index) {
  const prog = programList[Number(index)];
  if (!prog) return;
  document.getElementById('prog-select').value = String(index);
  if (running) await stopProgram();
  clearDisplay();
  resetFileStore();
  // Fetched in parallel, but stored in the manifest's order so that a program
  // with several candidate files still auto-selects the same one every time.
  const loaded = await Promise.all(prog.files.map(async f => {
    const resp = await fetch(`${prog.dir}/${f.split('/').map(encodeURIComponent).join('/')}`);
    if (!resp.ok) { console.warn(`${prog.name}: cannot fetch ${f}`); return null; }
    return [f.split('/').pop(), await resp.arrayBuffer()];
  }));
  for (const entry of loaded) if (entry) addFile(entry[0], entry[1]);
  updateFileSelect();
  const sel = document.getElementById('file-select');
  if (loadedFiles.includes(prog.main)) { sel.value = prog.main; await selectFile(prog.main); }
  else autoSelectFile();
}
loadProgramList();

document.getElementById('file-input').addEventListener('change', function(e) {
  // When using webkitdirectory, file.name is just the filename (not the path).
  // We load every file from the chosen folder into the files{} store.
  const flist = Array.from(e.target.files);
  if (flist.length === 0) return;

  resetFileStore();

  let pending = flist.length;
  flist.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      addFile(file.name, ev.target.result);
      if (--pending === 0) { updateFileSelect(); autoSelectFile(); }
    };
    reader.readAsArrayBuffer(file);
  });
  document.getElementById('prog-select').value = '';
  this.value = '';
});

function parseRsrcFile(buffer) {
  const v = new DataView(buffer);
  // AppleDouble magic = 0x00051607
  if (v.getUint32(0) !== 0x00051607) return;
  const nEntries = v.getUint16(24);
  let rsrcOff = -1, rsrcLen = -1;
  for (let i = 0; i < nEntries; i++) {
    const id = v.getUint32(26 + i*12), off = v.getUint32(30 + i*12), len = v.getUint32(34 + i*12);
    if (id === 2) { rsrcOff = off; rsrcLen = len; break; }
  }
  if (rsrcOff < 0) return;
  const r = new DataView(buffer, rsrcOff, rsrcLen);
  const dataOff = r.getUint32(0), mapOff = r.getUint32(4);
  const typeListOffRel = r.getUint16(mapOff + 24);
  const nameListOffRel = r.getUint16(mapOff + 26);
  const typeListAbs = mapOff + typeListOffRel;
  const nameListAbs = mapOff + nameListOffRel;
  const numTypes = r.getUint16(typeListAbs) + 1;
  for (let i = 0; i < numTypes; i++) {
    const tOff = typeListAbs + 2 + i*8;
    const rtype = String.fromCharCode(r.getUint8(tOff),r.getUint8(tOff+1),r.getUint8(tOff+2),r.getUint8(tOff+3));
    const count = r.getUint16(tOff+4) + 1;
    const refListAbs = typeListAbs + r.getUint16(tOff+6);
    if (!macResources[rtype]) macResources[rtype] = [];
    for (let j = 0; j < count; j++) {
      const rr = refListAbs + j*12;
      const resId = r.getInt16(rr);
      const nameOffRel = r.getUint16(rr+2);
      const resDataOff = dataOff + (r.getUint32(rr+4) & 0x00FFFFFF);
      const resLen = r.getUint32(resDataOff);
      let name = '';
      if (nameOffRel !== 0xFFFF) {
        const nl = r.getUint8(nameListAbs + nameOffRel);
        for (let k = 0; k < nl; k++) name += String.fromCharCode(r.getUint8(nameListAbs + nameOffRel + 1 + k));
      }
      const data = new Uint8Array(buffer, rsrcOff + resDataOff + 4, resLen);
      macResources[rtype].push({type: rtype, id: resId, name, data});
      if (rtype === 'TEXT') {
        rsrcTexts[name.toLowerCase()] = macRomanToStr(data);
      }
    }
  }
  console.log(`Loaded rsrc: ${Object.keys(macResources).map(t => `${t}×${macResources[t].length}`).join(' ')}`);
  initMenuBarFromResources();
}

// ── PG:PRO resource decoding ──────────────────────────────────
//
// PG:PRO describes its own resource formats with ResEdit templates that ship
// in the application ("TMPL" named pG3c / pG3w), so the field layout is read
// from those rather than written out as byte offsets here. The semantic name
// of each field comes from PG PRO.GLBL's `DIM RECORD gObject` and the window
// field list, in the same order the template declares them — several names
// share one word there (the `;0` entries are zero-length overlays), which is
// why the template labels read "BRed/ID/Elem".
const TMPL_SIZES = {DWRD: 2, DLNG: 4, RECT: 8, OCNT: 2, LSTC: 0, LSTE: 0};

function parseTMPL(data) {
  const out = [];
  for (let p = 0; p + 5 <= data.length; ) {
    const n = data[p];
    if (p + 1 + n + 4 > data.length) break;
    const label = macRomanToStr(data.slice(p + 1, p + 1 + n));
    const type  = macRomanToStr(data.slice(p + 1 + n, p + 1 + n + 4));
    p += 1 + n + 4;
    out.push({label, type});
  }
  return out;
}

// Field names in template order. A record type either is a flat struct (pG3w)
// or a counted list of identical records (pG3c, whose fields sit between the
// template's LSTC and LSTE markers).
const PG_LAYOUTS = {
  pG3w: {fields: ['rect', 'kind', 'attrs', 'minX', 'minY', 'maxX', 'maxY',
                  'zoom', 'hPage', 'hMax', 'vPage', 'vMax', 'refCon'],
         types:  ['RECT', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD',
                  'RECT', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DLNG']},
  pG3c: {fields: ['group', 'kind', 'ref', 'selRect', 'rect', 'zType', 'zJust',
                  'ctrl', 'min', 'max', 'page', 'fBlue', 'resID', 'bGreen', 'bBlue'],
         types:  ['DWRD', 'DWRD', 'DWRD', 'RECT', 'RECT', 'DWRD', 'DWRD',
                  'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD', 'DWRD']},
};

const _pgLayoutCache = new Map();
// → {header, recSize, at: {fieldName: {off, type}}}
function pgLayout(typeName) {
  if (_pgLayoutCache.has(typeName)) return _pgLayoutCache.get(typeName);
  const spec = PG_LAYOUTS[typeName];
  if (!spec) return null;

  // Prefer the application's own template; fall back to the declared types.
  const tmpl = (macResources['TMPL'] ?? []).find(r => r.name === typeName);
  let types = spec.types, header = 0;
  if (tmpl) {
    const entries = parseTMPL(tmpl.data);
    const lstc = entries.findIndex(e => e.type === 'LSTC');
    const lste = entries.findIndex(e => e.type === 'LSTE');
    const body = lstc >= 0 ? entries.slice(lstc + 1, lste < 0 ? entries.length : lste) : entries;
    header = lstc >= 0
      ? entries.slice(0, lstc).reduce((n, e) => n + (TMPL_SIZES[e.type] ?? 0), 0)
      : 0;
    if (body.length === spec.fields.length) types = body.map(e => e.type);
    else console.warn(`TMPL ${typeName}: ${body.length} fields, expected ${spec.fields.length}`);
  } else if (typeName === 'pG3c') {
    header = 2;   // the object count word
  }

  const at = Object.create(null);
  let off = 0;
  spec.fields.forEach((name, i) => {
    const type = types[i];
    at[name] = {off, type};
    off += TMPL_SIZES[type] ?? 2;
  });
  const layout = {header, recSize: off, at};
  _pgLayoutCache.set(typeName, layout);
  return layout;
}

// Read one template-described record into {name: value}. RECT fields expand to
// {top,left,bottom,right}; everything else is a signed integer.
function pgReadRecord(layout, view, base) {
  const rec = Object.create(null);
  for (const [name, f] of Object.entries(layout.at)) {
    const o = base + f.off;
    if (f.type === 'RECT') {
      rec[name] = {top: view.getInt16(o), left: view.getInt16(o + 2),
                   bottom: view.getInt16(o + 4), right: view.getInt16(o + 6)};
    } else if (f.type === 'DLNG') {
      rec[name] = view.getInt32(o);
    } else {
      rec[name] = view.getInt16(o);
    }
  }
  return rec;
}

function findRes(type, id) {
  return (macResources[type] ?? []).find(r => r.id === id) ?? null;
}

// STR#(id, index) — a Mac string list: a count word followed by Pascal strings.
// PG:PRO titles its generated buttons and menu items out of these
// (`objText$ = STR#(_baseID, gObjElement)`), so without it every such title
// came out blank.
function strListItem(id, index) {
  const res = findRes('STR#', id);
  if (!res || res.data.length < 2 || index < 1) return '';
  const d = res.data;
  const count = new DataView(d.buffer, d.byteOffset, d.byteLength).getUint16(0);
  let p = 2;
  for (let i = 1; i <= count && p < d.length; i++) {
    const len = d[p];
    if (i === index) return macRomanToStr(d.slice(p + 1, p + 1 + len));
    p += 1 + len;
  }
  return '';
}

// ── Alerts ────────────────────────────────────────────────────
// CALL PARAMTEXT(a$,b$,c$,d$) stores four strings that the Dialog Manager
// substitutes for ^0…^3 in any static text it subsequently draws.
let paramText = ['', '', '', ''];
function substParamText(s) {
  return String(s).replace(/\^([0-3])/g, (_, d) => paramText[+d] ?? '');
}

// An item list: a count-1 word, then per item a 4-byte placeholder, an 8-byte
// display rect, a type byte and a Pascal string, padded to an even length.
// Bit 7 of the type marks the item disabled; the low bits are the kind
// (4 = button, 5 = check box, 6 = radio, 8 = static text, 16 = edit text).
function parseDITL(id) {
  const res = findRes('DITL', id);
  if (!res || res.data.length < 2) return [];
  const d = res.data;
  const v = new DataView(d.buffer, d.byteOffset, d.byteLength);
  const count = v.getInt16(0) + 1;
  const items = [];
  let p = 2;
  for (let i = 0; i < count && p + 14 <= d.length; i++) {
    const rect = {top: v.getInt16(p + 4), left: v.getInt16(p + 6),
                  bottom: v.getInt16(p + 8), right: v.getInt16(p + 10)};
    const type = d[p + 12], len = d[p + 13];
    const text = macRomanToStr(d.slice(p + 14, p + 14 + len));
    items.push({num: i + 1, kind: type & 0x7f, enabled: !(type & 0x80), rect, text});
    p += 14 + len + (len & 1);
  }
  return items;
}

// The Dialog Manager draws a different icon for each alert flavour.
const ALERT_ICONS = {alert: 'ℹ️', notealert: 'ℹ️', note: 'ℹ️',
                     cautionalert: '⚠️', caution: '⚠️',
                     stopalert: '🛑', stop: '🛑'};
// StopAlert/CautionAlert/NoteAlert/Alert put up a modal dialog built from an
// ALRT resource and do not return until the user dismisses it. Answering 1
// straight away instead is not a harmless simplification: MacPThy warns from
// inside its drawing loops ("you have used all 200 points on that line"), so a
// warning that dismissed itself re-fired on the very next iteration — over a
// thousand times a second, each one snapshotting and restoring the whole
// window, which locked the program up and never showed the message.
function showAlert(alrtId, icon) {
  const res = findRes('ALRT', alrtId);
  const itemsId = res && res.data.length >= 10
    ? new DataView(res.data.buffer, res.data.byteOffset, res.data.byteLength).getInt16(8)
    : alrtId;
  const items = parseDITL(itemsId);
  const buttons = items.filter(it => it.kind === 4);
  const texts   = items.filter(it => it.kind === 8 || it.kind === 16);
  // Alert text is laid out one item per line in the item list.
  const text = texts.map(t => substParamText(t.text)).join('\n') || substParamText(paramText[0]);
  // Item 1 is the default button: Return answers 1, Escape the cancel button.
  return messageBox(icon, text, (buttons.length ? buttons : [{num: 1, text: 'OK'}])
    .map(b => ({label: substParamText(b.text) || 'OK', value: b.num})), 1, buttons.length > 1 ? 2 : 1);
}

// A modal box with the alerts' look. fill(box, finish) builds its contents and
// may return a keydown handler; the promise resolves with whatever finish() is
// given. Stop dismisses it with `cancel`, or the program waiting on it could
// never be interrupted.
let alertResolve = null;
function openModal(fill, cancel) {
  const back = document.createElement('div');
  back.className = 'mac-alert-back';
  const box = document.createElement('div');
  box.className = 'mac-alert';
  back.appendChild(box);
  // Clicks in a modal must not reach the canvas underneath as a mouse-down.
  back.addEventListener('mousedown', e => e.stopPropagation(), true);
  return new Promise(resolve => {
    let done = false, onKey = null;
    const finish = v => {
      if (done) return;
      done = true;
      if (alertResolve === stop) alertResolve = null;
      if (onKey) document.removeEventListener('keydown', onKey, true);
      back.remove();
      resolve(v);
    };
    const stop = () => finish(cancel);
    alertResolve = stop;
    onKey = fill(box, finish) || null;
    if (onKey) document.addEventListener('keydown', onKey, true);
    document.body.appendChild(back);
  });
}

// An icon, a message and a row of buttons [{label, value}]; Return picks the
// button whose value is `def`, Escape answers `cancel`.
function messageBox(icon, text, buttons, def, cancel) {
  return openModal((box, finish) => {
    const row = document.createElement('div');
    row.className = 'mac-alert-body';
    const ic = document.createElement('div');
    ic.className = 'mac-alert-icon';
    ic.textContent = icon;
    const msg = document.createElement('div');
    msg.className = 'mac-alert-text';
    msg.textContent = text;
    row.append(ic, msg);
    const btnRow = document.createElement('div');
    btnRow.className = 'mac-alert-buttons';
    box.append(row, btnRow);
    for (const b of buttons) {
      const el = document.createElement('button');
      el.className = 'mac-alert-btn' + (b.value === def ? ' default' : '');
      el.textContent = b.label;
      el.onclick = () => finish(b.value);
      btnRow.appendChild(el);
      if (b.value === def) setTimeout(() => el.focus());
    }
    return e => {
      if (e.key !== 'Enter' && e.key !== 'Escape') return;
      e.preventDefault(); e.stopPropagation();
      finish(e.key === 'Enter' ? def : cancel);
    };
  }, cancel);
}

// A window's geometry lives in "pG3w" with the window number as its id; the
// title is the *resource name* (FN pGgetWnd$ reads it with GETRESINFO).
function pg3wInfo(id) {
  const res = findRes('pG3w', id);
  const layout = pgLayout('pG3w');
  if (!res || !layout || res.data.length < layout.header + layout.recSize) return null;
  const v = new DataView(res.data.buffer, res.data.byteOffset, res.data.byteLength);
  const rec = pgReadRecord(layout, v, layout.header);
  const w = rec.rect.right - rec.rect.left, h = rec.rect.bottom - rec.rect.top;
  if (w <= 0 || h <= 0) return null;
  return {...rec, w, h, title: res.name || String(id)};
}

// PG:PRO's styled-text resource: a 16-bit character count, that many MacRoman
// bytes, then a standard TextEdit style scrap (run count, then 20 bytes per
// run — startChar long, height, ascent, font, face, size, 6-byte colour).
function parsePG3T(data) {
  if (!data || data.length < 2) return null;
  const v = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const textLen = v.getInt16(0);
  if (textLen < 0 || 2 + textLen > data.length) return null;
  const text = macRomanToStr(data.slice(2, 2 + textLen));
  const runs = [];
  let p = 2 + textLen;
  if (p + 2 <= data.length) {
    const n = v.getInt16(p); p += 2;
    for (let i = 0; i < n && p + 20 <= data.length; i++, p += 20) {
      runs.push({start: v.getInt32(p), height: v.getInt16(p + 4), ascent: v.getInt16(p + 6),
                 font: v.getInt16(p + 8), face: v.getInt16(p + 10), size: v.getInt16(p + 12)});
    }
  }
  return {text, runs};
}

// The objects of window `wid` — a counted list in "pG3c" with that id.
function pg3cObjects(wid) {
  const res = findRes('pG3c', wid);
  const layout = pgLayout('pG3c');
  if (!res || !layout || res.data.length < layout.header) return [];
  const v = new DataView(res.data.buffer, res.data.byteOffset, res.data.byteLength);
  const count = v.getInt16(0);
  const objs = [];
  for (let i = 0; i < count; i++) {
    const base = layout.header + i * layout.recSize;
    if (base + layout.recSize > res.data.length) break;
    objs.push(pgReadRecord(layout, v, base));
  }
  return objs;
}

// gObjKind values. Only the styled-text kind appears in any program here, and
// PG:PRO's constant names (_styleObj, _pictObj, _buttonObj, _scrollObj,
// _listObj) live in its compiled framework rather than in any shipped source,
// so the rest of the enumeration cannot be read off anything available. Rather
// than invent numbers, an unrecognised kind is resolved from what the record
// itself points at — the same evidence FN pGdrawControls acts on.
const PG_KIND_ROLE = {4: 'style'};
// Whether a styled field can be typed in. PG:PRO's own test, from
// FN pGdrawControls: `LONG IF ((gObjZType-1) AND &X1100) = 0` — "not a static
// or gray field", i.e. bits 2 and 3 of zType-1 mark the read-only variants.
const pgFieldEditable = zType => (((zType - 1) & 0b1100) === 0);

// pGwAttrs bit 7: "splash" — draw immediately and dismiss on user input.
// (The remaining attribute bits select where the window is placed on screen;
// they have no effect here because windows are laid out in a row rather than
// positioned, so the program's own coordinates are only used for size.)
const PG_SPLASH_MASK = 128;

// Dismiss `wid` on the next click or keypress, and after `timeoutTicks` 60ths
// of a second if that is non-zero.
function armSplashWindow(wid, timeoutTicks) {
  const wdef = windowDefs[wid];
  if (!wdef) return;
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    wdef.container.removeEventListener('mousedown', finish);
    document.removeEventListener('keydown', finish);
    if (timer) clearTimeout(timer);
    closeWindow(wid);
  };
  const timer = timeoutTicks > 0 ? setTimeout(finish, timeoutTicks * 1000 / 60) : null;
  wdef.container.addEventListener('mousedown', finish);
  document.addEventListener('keydown', finish);
}

// PG:PRO's `_baseID` equate names the STR# resource its generated titles come
// from. Read it out of the program rather than assuming the framework default.
function pgBaseId() {
  const v = globalVars['_baseid'];
  return Number.isFinite(v) ? Math.floor(v) : 4000;
}

function pgObjRole(o) {
  const known = PG_KIND_ROLE[o.kind];
  if (known) return known;
  if (findRes('pG3t', o.resID)) return 'style';
  if (findRes('PICT', o.resID)) return 'pict';
  if (findRes('STR#', o.resID)) return 'list';
  if (o.max > o.min) return 'scroll';
  if (o.zType) return 'button';
  return null;
}

// Build the styled text of one pG3t resource into `div`, one span per style
// run: the About splash is a single field holding "Market Exit" at 24pt, "by"
// at 12pt and "Living Paper" at 24pt, so a single font would overflow the box.
function fillStyledText(div, parsed) {
  const runs = parsed.runs.length ? parsed.runs
                                  : [{start: 0, font: 3, size: 12, face: 0, height: 0}];
  for (let i = 0; i < runs.length; i++) {
    const r = runs[i];
    const from = Math.max(0, r.start | 0);
    const to = i + 1 < runs.length ? Math.max(from, runs[i + 1].start | 0) : parsed.text.length;
    const seg = parsed.text.slice(from, to);
    if (!seg) continue;
    const size = r.size > 0 ? r.size : 12;
    const line = r.height > 0 ? r.height : Math.round(size * 1.3);
    const span = document.createElement('span');
    span.textContent = seg.replace(/\r/g, '\n');
    span.dataset.baseSize = String(size);
    span.dataset.baseLine = String(line);
    Object.assign(span.style, {
      fontFamily: MAC_FONTS[r.font] ?? MAC_FONTS[3],
      fontSize:   `${size}px`,
      lineHeight: `${line}px`,
      fontWeight: (r.face & 1) ? 'bold' : 'normal',
      fontStyle:  (r.face & 2) ? 'italic' : 'normal',
      textDecoration: (r.face & 4) ? 'underline' : 'none',
    });
    div.appendChild(span);
  }
}

// Realise a window's PG:PRO object list, which is what FN pGdrawControls does:
// styled text and list fields become EDIT FIELDs, PICT fields are drawn, and
// buttons and scroll bars become controls. Without this the Help and About
// windows opened correctly sized but completely empty.
function buildPgObjects(wid) {
  const wdef = windowDefs[wid];
  if (!wdef) return;
  const objs = pg3cObjects(wid);
  if (!objs.length) return;
  for (const el of wdef.container.querySelectorAll('.pg-object')) el.remove();
  const cw = wdef.logW || 512, ch = wdef.logH || 342;

  const place = (el, r) => Object.assign(el.style, {
    left:   `${r.left / cw * 100}%`,
    top:    `${r.top / ch * 100}%`,
    width:  `${Math.max(0, r.right - r.left) / cw * 100}%`,
    height: `${Math.max(0, r.bottom - r.top) / ch * 100}%`,
  });
  // gObjZJust is PG:PRO's own justification code, passed straight to
  // EDIT FIELD. The four objects here pin it down: the About splash titles
  // ("Market Exit" / "by" / "Living Paper", 24pt) carry 2, the prose bodies
  // of Help and Notes carry 1.
  const align = j => j === 2 ? 'center' : j === 3 ? 'right' : 'left';

  for (const o of objs) {
    const r = o.rect;
    switch (pgObjRole(o)) {
      case 'style': {
        const res = findRes('pG3t', o.resID);
        const parsed = res && parsePG3T(res.data);
        if (!parsed) break;
        const div = document.createElement('div');
        div.className = 'win-textedit pg-object pg-static-text';
        fillStyledText(div, parsed);
        place(div, r);
        Object.assign(div.style, {textAlign: align(o.zJust), border: 'none'});
        // PG:PRO builds these with `EDIT FIELD -gObjRef, &resHndl&, …`, so they
        // are TextEdit fields, not captions: the text scrolls, and unless the
        // type says static you can type in it. Supermarket's "My Notes" window
        // is nothing but one of these — the notepad it offers is the field
        // itself, which is why it opens showing pG3t 4003's contents, the
        // "Field 8001" placeholder PG:PRO gives a field the author never filled
        // in. Rendered as a caption there was nothing to write on.
        div.style.overflowY = 'auto';
        if (pgFieldEditable(o.zType)) {
          div.contentEditable = 'true';
          div.spellcheck = false;
          div.style.outline = 'none';
        }
        wdef.container.appendChild(div);
        break;
      }
      case 'list': {
        // A scrolling list built from a STR# resource, one row per string.
        const res = findRes('STR#', o.resID);
        if (!res) break;
        const div = document.createElement('div');
        div.className = 'win-textedit pg-object pg-static-text';
        const span = document.createElement('span');
        span.dataset.baseSize = '12'; span.dataset.baseLine = '16';
        span.style.fontSize = '12px'; span.style.lineHeight = '16px';
        span.style.fontFamily = MAC_FONTS[3];
        const rows = [];
        for (let i = 1; ; i++) { const t = strListItem(o.resID, i); if (!t) break; rows.push(t); }
        span.textContent = rows.join('\n');
        div.appendChild(span);
        place(div, r);
        div.style.textAlign = align(o.zJust);
        wdef.container.appendChild(div);
        break;
      }
      case 'pict': {
        // PICTURE FIELD: draw the resource into the window's canvas.
        const res = findRes('PICT', o.resID);
        if (!res) break;
        const bitmap = decodePictBitmap(res.data);
        if (!bitmap) break;
        const prevOut = outputWindowId;
        setOutputWindow(wid);
        drawPictBitmap(bitmap, r.left, r.top);
        if (prevOut != null && windowDefs[prevOut]) setOutputWindow(prevOut);
        break;
      }
      case 'button': {
        // `objText$ = STR#(_baseID, gObjElement)` — the title is an element of
        // the application's own string list, sharing the resID word.
        createButtonCtrl(o.ref, {
          title: strListItem(pgBaseId(), o.resID),
          type: o.zType || 1, state: o.ctrl, wdef,
          rect: [r.left, r.top, r.right, r.bottom],
        });
        break;
      }
      case 'scroll': {
        // Registered the way the SCROLL BUTTON statement does, so BUTTON(ref)
        // reads back the value the program set.
        controlStore[ctrlKey(o.ref, wid)] = {
          el: null, type: o.zType === 2 ? 'hscroll' : 'vscroll',
          value: o.ctrl, min: o.min, max: o.max, pageSize: o.page,
        };
        break;
      }
      default:
    }
  }
  scalePgObjects(wid);
}

// The text is authored in window (logical) pixels, so it has to scale with the
// window the same way canvas text does.
function scalePgObjects(wid) {
  const wdef = windowDefs[wid];
  if (!wdef) return;
  const cw = wdef.logW || 512;
  const shown = parseFloat(wdef.container.style.width) || cw;
  const k = shown / cw;
  for (const span of wdef.container.querySelectorAll('.pg-static-text > span')) {
    const base = Number(span.dataset.baseSize) || 12;
    const line = Number(span.dataset.baseLine) || Math.round(base * 1.3);
    span.style.fontSize = `${(base * k).toFixed(2)}px`;
    span.style.lineHeight = `${(line * k).toFixed(2)}px`;
  }
}

function parseMENU(data) {
  const v = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const menuId = v.getInt16(0);
  const enableFlags = v.getUint32(10);
  const titleLen = data[14];
  const title = macRomanToStr(data.slice(15, 15 + titleLen));
  const items = [];
  let pos = 15 + titleLen;
  let itemNum = 1;
  while (pos < data.length) {
    const nameLen = data[pos++];
    if (nameLen === 0) break;
    const name = macRomanToStr(data.slice(pos, pos + nameLen));
    pos += nameLen;
    const icon = data[pos++];
    const cmd  = data[pos++];
    const mark = data[pos++];
    const style = data[pos++];
    const enabled = !!((enableFlags >> itemNum) & 1);
    items.push({name, cmd, icon, mark, style, enabled});
    itemNum++;
  }
  return {menuId, title, items};
}

// Install a hierarchical menu by id. It is flagged `hier` so the menu bar does
// not also show it as a top-level title; it is only reachable through its
// parent item. Menu/item numbers stay the resource's own, so MENU(0)/MENU(1)
// report exactly what the program expects.
function installSubmenu(subId, menus) {
  if (!subId || menuDefs[subId]) return;
  const res = (menus ?? macResources['MENU'] ?? []).find(m => m.id === subId);
  if (!res) return;
  const {title, items} = parseMENU(res.data);
  menuDefs[subId] = makeMenu(title, {hier: true});
  items.forEach((it, idx) => {
    menuDefs[subId].items[idx + 1] = {
      title: it.name, enabled: it.enabled, checked: it.cmd !== 0x1B && it.mark !== 0,
      cmd: it.cmd ? String.fromCharCode(it.cmd) : null,
      submenu: it.cmd === 0x1B ? it.mark : null
    };
    if (it.cmd === 0x1B) installSubmenu(it.mark, menus);
  });
}

function initMenuBarFromResources() {
  const mbars = macResources['MBAR'];
  if (!mbars || mbars.length === 0) return;
  const mbarData = mbars[0].data;
  const v = new DataView(mbarData.buffer, mbarData.byteOffset);
  const n = v.getUint16(0);
  const menuIds = [];
  for (let i = 0; i < n; i++) menuIds.push(v.getUint16(2 + i * 2));
  const menus = macResources['MENU'] ?? [];
  for (const rawId of menuIds) {
    const menuRes = menus.find(m => m.id === rawId);
    if (!menuRes) continue;
    const {menuId, title, items} = parseMENU(menuRes.data);
    const actualId = rawId === 127 ? 255 : rawId;  // Apple menu → 255
    const menuTitle = actualId === 255 ? '\u{1F34E}' : title;
    menuDefs[actualId] = makeMenu(menuTitle);
    items.forEach((it, idx) => {
      menuDefs[actualId].items[idx + 1] = {
        title: it.name,
        enabled: it.enabled,
        // The mark byte is a check mark, except on a hierarchical item (cmd
        // 0x1B), where it holds the submenu's id.
        checked: it.cmd !== 0x1B && it.mark !== 0,
        cmd: it.cmd ? String.fromCharCode(it.cmd) : null,
        // A command character of 0x1B marks a hierarchical item: the "mark"
        // byte holds the id of the submenu to show. The MBAR only lists the
        // top-level menus, so without following these the four submenus in
        // Supermarket's Options menu were never installed at all.
        submenu: it.cmd === 0x1B ? it.mark : null
      };
      if (it.cmd === 0x1B) installSubmenu(it.mark, menus);
    });
  }
  renderMenuBar();
}

function openFile() { document.getElementById('file-input').click(); }

function updateFileSelect() {
  const sel = document.getElementById('file-select');
  sel.innerHTML = '';
  if (loadedFiles.length === 0) {
    sel.disabled = true;
    sel.innerHTML = '<option value="">— no file loaded —</option>';
    return;
  }
  loadedFiles.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.disabled = false;
}

// Pick the file to start from — the same rule as pickMain() in
// zbasic-compile.js, which explains it: the .MAIN; otherwise the listing of the
// version the application (.rsrc) was built from, preferring the one recovered
// from the tokenized source.
function versionOf(name) {
  const m = name.replace(/\.(detok\.txt|txt|bas|exe|rsrc)$/gi, '').match(/(\d+(?:\.\d+)*)\D*$/);
  return m ? m[1] : null;
}
function autoSelectFile() {
  let name = loadedFiles.find(f => f.toUpperCase().endsWith('.MAIN'));
  if (!name) {
    const want = loadedRsrc.length ? versionOf(loadedRsrc[0]) : null;
    let txt = loadedFiles.filter(f => f.toLowerCase().endsWith('.txt'));
    if (want && txt.some(f => versionOf(f) === want)) txt = txt.filter(f => versionOf(f) === want);
    const detok = txt.filter(f => f.toLowerCase().endsWith('.detok.txt'));
    name = detok.length === 1 ? detok[0] : txt.length === 1 ? txt[0] : null;
  }
  if (name) { document.getElementById('file-select').value = name; selectFile(name); }
}

async function selectFile(name) {
  if (!name) return;
  if (running) await stopProgram();
  clearDisplay();
  parseAndLoad(name);
}

// Tear down everything the previous program put on screen. runProgram() does
// this as part of its full reset; selectFile() needs it too, or the old
// program's windows and menu bar sit there until the new one is run.
function clearDisplay() {
  destroyAllCtrls();
  Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
  menuSeq = 0;
  menuBarSig = null;
  renderMenuBar();
  Object.values(windowDefs).forEach(w => w.container.remove());
  Object.keys(windowDefs).forEach(k => delete windowDefs[k]);
  frontWindowId = null; outputWindowId = null; canvas = null; ctx = null;
  renderTabs();
}

function flattenIncludes(stmts) {
  // Recursively expand include statements so the whole program is a flat list.
  // This lets GOTO/GOSUB find labels across file boundaries.
  const result = [];
  for (const s of stmts) {
    if (!s) continue;
    if (s.type === 'include') { result.push(...flattenIncludes(s.body)); }
    else { result.push(s); }
  }
  return result;
}

// Parse `name` and, recursively, anything it INCLUDEs.
function parseSource(name, depth = 0) {
  const key = String(name).trim();
  if (!files[key]) { console.log(`${'  '.repeat(depth + 1)}[not found: ${name}]`); return []; }
  if (depth) console.log(`${'  '.repeat(depth)}↳ ${key}`);
  if (depth > 4) return [];   // guard against an include cycle
  return parseTolerant(files[key], key, inc => parseSource(inc, depth + 1));
}

// A text listing can be lossy. CDraw45.txt, a much later export, has four
// statements whose beginning was overwritten (`XXX.Enabled=False(MenuType),0)`);
// nothing can parse those lines. Blank such a line out, warn, and carry on:
// losing one statement costs less than refusing the whole file. (CDraw itself
// now runs from its tokenized source, which has no such damage — see
// zbasic-detokenize.js.) Line endings are bare CRs, which PEG.js does not count
// as line breaks, so the error offset is what locates the damage.
function parseTolerant(text, name, parseFile) {
  const skipped = [];
  for (;;) {
    try {
      const ast = parser.parse(text, {parseFile});
      if (skipped.length)
        console.warn(`${name}: skipped ${skipped.length} unparsable line(s) — ${skipped.join(' | ')}`);
      return ast;
    } catch (err) {
      const at = err.location?.start?.offset;
      if (at == null || skipped.length >= 10) throw err;
      let from = at, to = at;
      while (from > 0 && text[from - 1] !== '\r' && text[from - 1] !== '\n') from--;
      while (to < text.length && text[to] !== '\r' && text[to] !== '\n') to++;
      if (to <= from) throw err;
      skipped.push(text.slice(from, to).trim());
      text = text.slice(0, from) + ' '.repeat(to - from) + text.slice(to);
    }
  }
}

function parseAndLoad(name) {
  console.log(`parsing ${name}…`);
  try {
    const raw = parseSource(name);
    currentProgram = flattenIncludes(raw);
    console.log(`ok — ${currentProgram.length} statements (${raw.length} before flatten)`);
    document.getElementById('btn-run').disabled = false;
  } catch(err) {
    const loc = err.location;
    console.error(loc ? `✗ ${loc.start.line}:${loc.start.column} ${err.message}` : `✗ ${err.message}`);
    currentProgram = null;
    document.getElementById('btn-run').disabled = true;
  }
}

// ── Event system ──────────────────────────────────────────────
let eventQueue = [];
let eventWaiter = null;   // {accept(evt), resolve(evt)} while something blocks on the queue
// Events the program has not taken yet wait here, as in the Mac's own event
// queue. A program that never polls for some kind of event must not make the
// queue grow without bound, so the oldest are dropped past this length.
const EVENT_QUEUE_MAX = 200;
// DIALOG(n) only ever reports dialog-class events (buttons, edit fields,
// windows); menus, clicks and timers belong to their own traps.
const isDialogEvent = e => !['menu', 'mouse', 'timer', 'edit'].includes(e.type);

function pushEvent(type, data = {}) {
  const evt = {type, ...data};
  if (eventWaiter && eventWaiter.accept(evt)) { const w = eventWaiter; eventWaiter = null; w.resolve(evt); return; }
  eventQueue.push(evt);
  if (eventQueue.length > EVENT_QUEUE_MAX) eventQueue.shift();
}
// An update event for window `wid`, unless one is already waiting: the Mac
// keeps one update region per window, not a queue of them.
function queueUpdate(wid) {
  if (wid == null || eventQueue.some(e => e.type === 'dialog' && e.code === 5 && e.winRef === wid)) return;
  pushEvent('dialog', {code: 5, winRef: wid});
}
// Take the first queued event `accept` wants, waiting up to timeoutMs for one
// (0 = wait for ever). Resolves {type: 'null'} on timeout.
async function waitForEvent(timeoutMs, accept = () => true) {
  if (stopRequested) throw new Error('USER_STOP');
  const i = eventQueue.findIndex(accept);
  if (i >= 0) return eventQueue.splice(i, 1)[0];
  return new Promise(resolve => {
    const w = {accept, resolve};
    eventWaiter = w;
    if (timeoutMs > 0) setTimeout(() => {
      if (eventWaiter === w) { eventWaiter = null; resolve({type: 'null'}); }
    }, timeoutMs);
  });
}
function clearEvents() { eventQueue = []; eventWaiter = null; }

// ── Dynamic menu bar ──────────────────────────────────────────
const menuDefs = {};
// Menus sit in the bar in the order they were installed, not in id order:
// Supermarket's MBAR lists Options before Help even though Options is menu 7 and
// Help is menu 6, and the Mac's menu bar follows the MBAR (or the sequence of
// InsertMenu calls), never the numbering.
// A menu handle leads to a MenuInfo record (Inside Macintosh): the menu's id
// at offset 0, its enable flags at 10 (bit 0 the menu, bit n item n) and its
// title, a Pascal string, at 14 (_menuData). PG:PRO finds its menus by reading
// them — `PSTR$([mHndl&] + _menuData)`, `{[mHndl&]}` — and with the bare menu
// id standing in for the handle it read nothing, so Supermarket's whole File
// menu (Open, Close, Save, Quit) was ignored. The record is refreshed whenever
// a handle is handed out; menu calls take a handle or an id (menuIdOf).
const menuHandles = new Map();   // menu id → handle, for the current run
const menuIds = new Map();       // handle → menu id
const menuIdOf = h => menuIds.get(h) ?? h;
function menuHandle(id) {
  let h = menuHandles.get(id);
  if (!h) {
    h = fakeMalloc(4);
    fakeWriteU32(h, fakeMalloc(14 + 256));
    menuHandles.set(id, h);
    menuIds.set(h, id);
  }
  const m = menuDefs[id], rec = fakeReadU32(h);
  let flags = m?.enabled === false ? 0 : 1;

    '_prewndzoomin': 5, '_prewndzoomout': 6, '_wnddocwillmove': 7,
    // MultiFinder event sub-codes
    '_mfresume': 1, '_mfsuspend': 2, '_mfclipboard': 4, '_mfmouse': 8,
    // WINDOW() selectors whose real values live in PG:PRO's compiled runtime.
    // They have to sit below -64, because ZBasic reserves WINDOW(-1)…WINDOW(-64)
    // for "is window n open?" — PG:PRO's own pGcloseWindow opens with
    //   LONG IF WINDOW(-wndRefNum) = 0 OR wndRefNum<1 OR wndRefNum>64
    // and with these constants sitting on -1…-9 that test answered for the wrong
    // thing and every close box reported "window does not exist" instead.
    '_activewnd': -101, '_outputwnd': -102, '_outputwclass': -103,
    // The same for SYSTEM(): every resource file here has reference 0 (see
    // CURRESFILE, HOMERESFILE), and no program was opened with documents.
    '_aplres': -201, '_aplflag': -202,
    // AppParmHandle, the low-memory global listing the documents an application
    // was opened with (Inside Macintosh: $AEC). It reads 0: none.
    '_appparmhandle': 0xAEC,
    // pG3w window attributes "centre on screen" and "reopen where it was
    // closed", also from PG:PRO's runtime. pGbuild is ours (see
    // execUserFuncCall), so only pGcloseWindow tests them, to write a closed
    // window's position back into its resource — which cannot be kept here.
    '_opencntrmask': 0, '_openprevmask': 0,
    '_wndpointer': -104, '_efnum': -105, '_lastefnum': -106,
    '_selstart': -107, '_selend': -108, '_eftextlen': -109,
    // EDIT FIELD types. PG:PRO's own test for an editable field is
    // `((type-1) AND &X1100) = 0` ("not a static or gray field"), so 1-4 are
    // the editable kinds and 5 upwards the static ones; odd types are framed.
    '_framed': 1, '_noframed': 2, '_framednocr': 3, '_noframednocr': 4,
    '_statframed': 5, '_statnoframed': 6,
    // EDIT FIELD justification (low two bits of the last argument). PG:PRO's
    // Style menu sets it with `EDIT FIELD …,,,,gWhichItem - _justifyItem + 1`
    // and Supermarket's items 12/13/14 are Left/Center/Right, so these are
    // 1/2/3. (TEXTBOX takes TextEdit's own 0/1/-1 coding instead.)
    '_leftjust': 1, '_centerjust': 2, '_rightjust': 3,
    // Resource handle flags
    '_resource%': 0x20, '_respurgeable%': 0x40,
    // Misc Mac
    '_graphicobj': 0,
    // ZBasic _aplIncl framework constants (not present in any source file — compiled binary)
    '_updatevt': 1,   // SCROLL BUTTON direction: 1=vertical
    '_efclass': 0,    // edit-field window class (used in PG PRO object system)
    '_width': 2, '_height': 3,   // WINDOW(n) selectors, matching the WINDOW() cases below
    '_menuid': 0, '_itemid': 1,  // MENU(n) selectors: MENU(0) = menu, MENU(1) = item
    // MenuInfo record field offsets (Inside Macintosh)
    '_menuwidth': 2, '_menuheight': 4, '_menuproc': 6, '_enableflags': 10, '_menudata': 14,
    '_appleresmenu': 255,        // the Apple menu, which we render as menu ID 255
  });

  const equates = [];
  collectTypes(currentProgram);
  collectPass(currentProgram, funcDefs, dataStore, equates);
  // Resolve compile-time constants in source order before anything runs.
  for (const eq of equates) {
    try { globalVars[normVarName(eq.name)] = await evalExpr(eq.value, globalVars); }
    catch(e) { console.warn(`equate ${eq.name}: ${e.message ?? e}`); }
  }
  markTrapRegions(currentProgram);
  await layoutVariables(currentProgram);
  CANVAS_SCALE = targetCanvasScale();   // no windows yet: pick it before the first
  getOrCreateWindow(1, null, 512, 342);
  setOutputWindow(1);

  try {
    await execBlock(currentProgram, globalVars);
    console.log('ended.');
  } catch(e) {
    if (e.message === 'END' || e.message === 'STOP') console.log('stopped.');
    else if (e.message === 'USER_STOP') console.log('interrupted.');
    else if (e instanceof GotoSignal) console.error(`GOTO label not found: "${e.label}"`);
    else if (e instanceof GosubSignal) console.error(`GOSUB label not found: "${e.label}"`);
    else console.error(e);
  }

  // ON STOP names the program's clean-up routine; run it once on the way out.
  // A second press of Stop still interrupts it.
  if (onStopHandler) {
    const lbl = onStopHandler;
    onStopHandler = null;
    stopRequested = false;
    try { await callEventHandler(lbl, globalVars, true); } catch (e) { /* ending anyway */ }
  }
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  await closeAllFiles();   // a file the program left open still gets written

  running = false; stopRequested = false;
  setMacCursor('default');   // a watch left up would claim the stopped program is busy
  btnRun.textContent = 'Run'; btnRun.classList.remove('running');
  // The menus belong to the run: left up, they could still be clicked and
  // did nothing. The windows stay, showing how the program left them.
  Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
  renderMenuBar();
  showNoWindowsNote();
  finishRun();
}

// Ask the running program to stop; the promise resolves once it has.
function stopProgram() {
  if (!running) return Promise.resolve();
  stopRequested = true;
  if (eventWaiter) { const w = eventWaiter; eventWaiter = null; w.resolve({type: 'stop'}); }
  // A modal alert or file dialog is the one place the interpreter parks without
  // an event waiter, so Stop has to dismiss it or the run can never be interrupted.
  if (alertResolve) alertResolve(1);
  for (const wake of [...pendingSleeps]) wake();
  return runFinished;
}

// `DEF FN pGautoMenu(menuID,itemID) USING GLBLautoMenu&` declares a function
// called through a pointer, so code can call it before its LOCAL FN is
// compiled; the pointer is then set to that same function (`GLBLautoMenu& =
// @FN pGautoMenu`). PG:PRO declares all 43 of its runtime functions this way.
// Letting the declaration replace the real function made every one of them
// return nothing — FN pGinitRuntime, which sets the pointers, included — so
// a declaration never displaces a function with a body of the same name.
const isPrototypeOf = (stmt, defs) => !!(stmt.using && defs[stmt.name]?.body);

// ── Collect pass (DATA + fn defs) ─────────────────────────────
function collectPass(stmts, fns, data, equates) {
  if (!stmts) return;
  for (const s of stmts) {
    if (!s) continue;
    // Names beginning with "_" are compile-time constants in ZBasic. Their
    // defining assignment can sit anywhere in the file — including between
    // function definitions, where normal control flow never reaches it — so
    // collect them up front instead of relying on execution order.
    if (equates && s.type === 'assign' && !s.idx && !(s.fields?.length)
        && typeof s.name === 'string' && s.name.startsWith('_'))
      equates.push(s);
    if (s.type === 'data') { for (const it of s.items) data.push(evalConstant(it)); }
    else if (s.type === 'function' || s.type === 'localFunction') { fns[s.name] = s; collectPass(s.body, fns, data, equates); }
    else if (s.type === 'defFn') { if (!isPrototypeOf(s, fns)) fns[s.name] = s; }
    else if (s.type === 'if') { collectPass(s.body, fns, data, equates); if (s.else) collectPass(s.else, fns, data, equates); }
    else if (s.type === 'for' || s.type === 'while' || s.type === 'do_while') collectPass(s.body, fns, data, equates);
    else if (s.type === 'select') { for (const c of s.cases) collectPass(c.body, fns, data, equates); }
    else if (s.type === 'include') collectPass(s.body, fns, data, equates);
  }
}

function evalConstant(n) {
  if (!n) return null;
  if (n.type === 'constant') return n.value;
  if (n.type === 'literal') return n.value;
  return String(n.value ?? '');
}

// ── Block executor ────────────────────────────────────────────
// A block is a statement list: the program, a function body, a loop or IF body.
// A GOTO or a non-top-level GOSUB whose label is not in this block propagates
// out to the enclosing one.
async function execBlock(stmts, env) {
  if (!stmts) return;
  for (let i = 0; i < stmts.length; i++) {
    await maybeYield();
    const stmt = stmts[i];
    if (!stmt) continue;
    try {
      const r = await execStmt(stmt, env);
      if (r instanceof ReturnSignal) return r;
      if (stmt.eol) await lineEnd(stmt.__trapsEnd);
    } catch (e) {
      if (!(e instanceof GotoSignal || e instanceof GosubSignal)) throw e;
      const li = findLabel(stmts, e.label, i + 1);
      if (li < 0) throw e;
      if (e instanceof GotoSignal) i = li;
      else { await runFrom(stmts, li + 1, env); if (stmt.eol) await lineEnd(stmt.__trapsEnd); }
    }
  }
}

// ── Statement dispatcher ──────────────────────────────────────
async function execStmt(stmt, env) {
  if (!stmt) return;
  switch (stmt.type) {
    case 'assign':        return execAssign(stmt, env);
    case 'print':         return execPrint(stmt, env);
    case 'sysFuncCall':   return execSysCall(stmt, env);
    case 'if':            return execIf(stmt, env);
    case 'for':           return execFor(stmt, env);
    case 'while':         return execWhile(stmt, env);
    case 'do_while':      return execDoWhile(stmt, env);
    case 'select':        return execSelect(stmt, env);
    case 'on':            return execOn(stmt, env);
    case 'onEvent': {
      const lbl = labelOf(stmt.handler);
      if (stmt.event === 'MENU') onMenuHandler = lbl;
      else if (stmt.event === 'DIALOG') onDialogHandler = lbl;
      else if (stmt.event === 'MOUSE') onMouseHandler = lbl;
      else if (stmt.event === 'TIMER') {
        onTimerHandler = lbl;
        if (stmt.interval !== undefined) {
          const ms = Math.round(Math.abs(Number(await evalExpr(stmt.interval, env))) * 1000 / 60);
          timerInterval = ms > 0 ? ms : 1000;
        }
        // Start the timer interval now; events are gated by timerOn flag
        if (timerHandle) clearInterval(timerHandle);
        const ms = timerInterval > 0 ? timerInterval : 1000;
        timerHandle = setInterval(() => {
          if (running && onTimerHandler && !eventQueue.some(e => e.type === 'timer')) pushEvent('timer');
        }, ms);
      }
      else if (stmt.event === 'EDIT') onEditHandler = lbl;
      else if (stmt.event === 'BREAK') { /* command-period trap — no keyboard equivalent here */ }
      else if (stmt.event === 'EVENT') onEventHandler = lbl;
      else if (stmt.event === 'STOP') onStopHandler = lbl;
      // ON ERROR GOSUB 65535: the program checks ERROR itself; ON ERROR RETURN
      // hands disk errors back to ZBasic (see diskError).
      else if (stmt.event === 'ERROR') errorTrap = stmt.cmd === 'RETURN' ? null : lbl === '65535' ? '' : lbl;
      return;
    }
    case 'procedureCall': return execProcCall(stmt, env);
    case 'userFuncCall':  return execUserFuncCall(stmt, env);

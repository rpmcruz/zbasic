<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZBasic</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a1a;
  font-family: system-ui, sans-serif;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  color: #ccc;
}

/* ── Toolbar ──────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  background: #222;
  border-bottom: 1px solid #383838;
  flex-shrink: 0;
}
.tb-btn {
  background: #2d2d2d;
  border: 1px solid #555;
  border-radius: 4px;
  color: #ddd;
  padding: 5px 14px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  white-space: nowrap;
  user-select: none;
}
.tb-btn:hover:not(:disabled) { background: #3a3a3a; border-color: #888; color: #fff; }
.tb-btn:disabled { opacity: 0.35; cursor: default; }
.tb-btn.running { color: #ff6060; border-color: #cc4444; background: #2d1a1a; }
#file-select {
  width: 200px;
  flex-shrink: 0;
  background: #2d2d2d;
  border: 1px solid #555;
  border-radius: 4px;
  color: #ddd;
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
}
#file-select:disabled { opacity: 0.5; }

/* ── Program view ─────────────────────────────────────────── */
#program-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#dynamic-menubar {
  background: white;
  border-bottom: 1px solid #000;
  height: 20px;
  display: none;
  align-items: stretch;
  flex-shrink: 0;
  user-select: none;
  font-family: 'Chicago', 'Geneva', system-ui, sans-serif;
  font-size: 12px;
}
#dynamic-menubar.active { display: flex; }

.dyn-menu {
  padding: 0 10px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  color: #000;
}
.dyn-menu:hover, .dyn-menu.open { background: #000; color: #fff; }
.dyn-menu.dis { pointer-events: none; color: #aaa; cursor: default; }
.dyn-menu-drop {
  display: none;
  position: absolute;
  top: 20px; left: 0;
  background: white;
  border: 1px solid #000;
  min-width: 140px;
  z-index: 200;
  box-shadow: 2px 2px 0 #000;
  color: #000;
}
.dyn-menu.open .dyn-menu-drop { display: block; }
.dyn-menu-item {
  padding: 3px 18px 3px 20px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
}
.dyn-menu-item:hover { background: #000; color: #fff; }
.dyn-menu-item.sep { border-top: 1px solid #aaa; padding: 0; margin: 2px 0; pointer-events: none; }
.dyn-menu-item.dis { color: #aaa; pointer-events: none; }

#tab-bar {
  display: none;
  background: #e0e0e0;
  border-bottom: 1px solid #888;
  flex-shrink: 0;
  overflow-x: auto;
  white-space: nowrap;
  font-family: 'Chicago', 'Geneva', system-ui, sans-serif;
  font-size: 11px;
}
.win-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  cursor: pointer;
  border-right: 1px solid #888;
  background: #ccc;
  color: #333;
}
.win-tab.active { background: #fff; font-weight: bold; color: #000; }
.win-tab-close {
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.5;
  padding: 1px 2px;
}
.win-tab-close:hover { opacity: 1; }

/* ── Canvas wrapper — contains the scaled window ─────────── */
#canvas-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #555;
}
.win-container {
  display: none;
  width: 100%;
  height: 100%;
  background: white;
  position: relative;
}
.win-container.front { display: block; }
.win-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.win-textedit {
  position: absolute;
  overflow-y: auto;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-word;
  background: white;
  color: black;
  box-sizing: border-box;
  padding: 2px 4px;
}
.mac-ctrl {
  position: absolute;
  box-sizing: border-box;
  font-family: 'Geneva', 'Helvetica', sans-serif;
  margin: 0;
  padding: 0;
}
.mac-btn {
  background: #e0e0e0;
  border: 1px solid #555;
  border-radius: 3px;
  padding: 0 4px;
  font-size: 75%;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  width: 100%;
  height: 100%;
}
.mac-btn:disabled { color: #aaa; cursor: default; }
.mac-btn.selected { background: #000; color: #fff; }
.mac-editfield {
  background: white;
  border: 1px solid #888;
  padding: 1px 2px;
  font-size: 75%;
  width: 100%;
  height: 100%;
  display: block;
  outline: none;
}
</style>
</head>
<body>

<div id="toolbar">
  <button class="tb-btn" id="btn-open" onclick="openFile()">Open</button>
  <select id="file-select" disabled onchange="selectFile(this.value)">
    <option value="">— no file loaded —</option>
  </select>
  <button class="tb-btn" id="btn-run" onclick="toggleRun()" disabled>Run</button>
</div>

<div id="program-view">
  <div id="tab-bar"></div>
  <div id="dynamic-menubar"></div>
  <div id="canvas-wrapper"></div>
</div>


<input type="file" id="file-input" style="display:none" multiple accept=".txt,.bas,.incl,.fltr,.main,.rsrc">

<script src="zbasic-parser.js"></script>
<script>
const parser = ZBasicParser;
const CANVAS_SCALE = 2;  // render at 2× logical resolution for crisp text

// ── File storage ──────────────────────────────────────────────
const files = {};
let loadedFiles = [];
let currentProgram = null;

// ── Window/Canvas management ──────────────────────────────────
// windowDefs[id] = { title, container, canvas, ctx, teRecords: {} }
const windowDefs = {};
// ── TextEdit handle store ─────────────────────────────────────
const teHandleMap = {};  // handle(fakeAddr) -> { div, text, lineHeight }

// ── Fake Mac memory (for PEEK/POKE and resource handles) ───────
const fakeMemBlocks = [];  // [{base, data: Uint8Array}]
let nextFakeAddr = 0x10000;

function fakeMalloc(size) {
  const base = nextFakeAddr;
  nextFakeAddr += size + 8;
  const data = new Uint8Array(size);
  fakeMemBlocks.push({base, data});
  return base;
}
function _fakeBlock(addr, size) {
  for (const b of fakeMemBlocks)
    if (addr >= b.base && addr + size <= b.base + b.data.length) return b;
  return null;
}
function fakeReadU32(addr) {
  const b = _fakeBlock(addr, 4); if (!b) return 0;
  const o = addr - b.base, d = b.data;
  return ((d[o]<<24)|(d[o+1]<<16)|(d[o+2]<<8)|d[o+3]) >>> 0;
}
function fakeReadU16(addr) {
  const b = _fakeBlock(addr, 2); if (!b) return 0;
  const o = addr - b.base, d = b.data;
  return (d[o]<<8)|d[o+1];
}
function fakeWriteU32(addr, v) {
  const b = _fakeBlock(addr, 4); if (!b) return;
  const o = addr - b.base, d = b.data;
  d[o]=(v>>>24)&0xFF; d[o+1]=(v>>>16)&0xFF; d[o+2]=(v>>>8)&0xFF; d[o+3]=v&0xFF;
}
function fakeWriteU16(addr, v) {
  const b = _fakeBlock(addr, 2); if (!b) return;
  const o = addr - b.base, d = b.data;
  d[o]=(v>>8)&0xFF; d[o+1]=v&0xFF;
}
function fakeWriteBytes(addr, bytes) {
  const b = _fakeBlock(addr, bytes.length); if (!b) return;
  b.data.set(bytes, addr - b.base);
}
function fakeReadBytes(addr, len) {
  const b = _fakeBlock(addr, len); if (!b) return new Uint8Array(len);
  return b.data.slice(addr - b.base, addr - b.base + len);
}

// Mac Roman → JS string
const MAC_ROMAN_EXTRA = '\xC4\xC5\xC7\xC9\xD1\xD6\xDC\xE1\xE0\xE2\xE4\xE5\xE7\xE9\xE8\xEA\xEB\xED\xEC\xEE\xEF\xF1\xF3\xF2\xF4\xF6\xFA\xF9\xFB\xFC†\xB0\xA2\xA3\xA7•\xB6\xDF\xAE\xA9™\xB4\xA8≠\xC6\xD8∞\xB1≤≥\xA5\xB5∂∑∏π∫\xAA\xBAΩ\xE6\xF8\xBF\xA1\xAC√ƒ≈∆\xAB\xBB…\xA0\xC0\xC3\xD5Œœ–—“”‘’\xF7◊\xFFŸ⁄€‹›ﬁﬂ‡\xB7‚„‰\xC2\xCA\xC1\xCB\xC8\xCD\xCE\xCF\xCC\xD3\xD4\xD2\xDA\xDB\xD9ıˆ˜\xAF˘˙˚\xB8˝˛ˇ';
function macRomanToStr(bytes) {
  let s = '';
  for (const b of bytes) s += b < 128 ? String.fromCharCode(b) : (MAC_ROMAN_EXTRA[b-128] ?? '?');
  return s;
}

// ── Mac resource store (loaded from .rsrc AppleDouble files) ───
const rsrcTexts = {};  // lowercase name -> string
const pictHandleMap = {};  // handle → {id, w, h, color}
let frontWindowId = null;
let outputWindowId = null;
let canvas = null;   // canvas of the output window
let ctx = null;      // ctx of the output window

async function makeTeHandle(rectArg, env) {
  let left = 0, top = 0, right = 300, bottom = 200;
  if (rectArg?.from) {
    const re = async x => Number(await evalExpr(x, env)) || 0;
    left = await re(rectArg.from[0]); top = await re(rectArg.from[1]);
    right = await re(rectArg.to[0]); bottom = await re(rectArg.to[1]);
  }
  const lineHeight = (textSize <= 9 ? 11 : 16);
  // Allocate fake TERec struct (128 bytes): lineHeight @ 24, nLines @ 94
  const teRecAddr = fakeMalloc(128);
  fakeWriteU16(teRecAddr + 24, lineHeight);
  fakeWriteU16(teRecAddr + 94, 1);
  // Allocate master pointer handle (4 bytes) -> teRecAddr
  const handle = fakeMalloc(4);
  fakeWriteU32(handle, teRecAddr);

  const div = document.createElement('div');
  div.className = 'win-textedit';
  const win = windowDefs[outputWindowId];
  const cw = win?.logW || 512, ch = win?.logH || 342;
  Object.assign(div.style, {
    left: `${left/cw*100}%`, top: `${top/ch*100}%`,
    width: `${(right-left)/cw*100}%`, height: `${(bottom-top)/ch*100}%`,
    overflow: 'auto', userSelect: 'none' });
  if (win) win.container.appendChild(div);

  const rec = { div, text: '', lineHeight, viewH: bottom - top };
  teHandleMap[handle] = rec;
  if (win) win.teRecords[handle] = rec;
  return handle;
}

function renderTeDiv(rec) {
  // Render Mac \r-delimited text into the div
  rec.div.textContent = rec.text.replace(/\r/g, '\n');
}

function getOrCreateWindow(id, title, w, h) {
  if (!windowDefs[id]) {
    const W = w || 512, H = h || 342;
    const container = document.createElement('div');
    container.className = 'win-container';
    container.style.aspectRatio = `${W} / ${H}`;
    const c = document.createElement('canvas');
    c.className = 'win-canvas';
    c.width = W * CANVAS_SCALE; c.height = H * CANVAS_SCALE;
    container.appendChild(c);
    document.getElementById('canvas-wrapper').appendChild(container);
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.scale(CANVAS_SCALE, CANVAS_SCALE);
    cx.fillStyle = '#ffffff';
    cx.fillRect(0, 0, W, H);
    windowDefs[id] = { title: title || String(id), container, canvas: c, ctx: cx, logW: W, logH: H, teRecords: {} };
  } else {
    if (title) windowDefs[id].title = title;
    if (w && h) {
      const win = windowDefs[id];
      win.logW = w; win.logH = h;
      win.container.style.aspectRatio = `${w} / ${h}`;
      win.canvas.width = w * CANVAS_SCALE; win.canvas.height = h * CANVAS_SCALE;
      win.ctx.scale(CANVAS_SCALE, CANVAS_SCALE);
      win.ctx.fillStyle = '#ffffff';
      win.ctx.fillRect(0, 0, w, h);
    }
  }
  renderTabs();
  return windowDefs[id];
}

function bringToFront(id) {
  if (!windowDefs[id]) return;
  Object.values(windowDefs).forEach(w => w.container.classList.remove('front'));
  windowDefs[id].container.classList.add('front');
  frontWindowId = id;
  renderTabs();
}

function setOutputWindow(id) {
  if (!windowDefs[id]) getOrCreateWindow(id, String(id), 512, 342);
  outputWindowId = id;
  canvas = windowDefs[id].canvas;
  ctx    = windowDefs[id].ctx;
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  const ids = Object.keys(windowDefs).map(Number).sort((a, b) => a - b);
  bar.innerHTML = '';
  for (const id of ids) {
    const t = document.createElement('div');
    t.className = 'win-tab' + (id === frontWindowId ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = windowDefs[id].title;
    label.onclick = () => bringToFront(id);
    const x = document.createElement('span');
    x.className = 'win-tab-close';
    x.textContent = '✕';
    x.title = 'Close window';
    x.onclick = (e) => { e.stopPropagation(); pushEvent('dialog', {code: 4, windowId: id}); };
    t.appendChild(label);
    t.appendChild(x);
    bar.appendChild(t);
  }
  bar.style.display = ids.length > 0 ? 'flex' : 'none';
}

function showCanvas() {
  if (outputWindowId !== null) bringToFront(outputWindowId);
}
function hideCanvas() {}


let mouseDown = false, mouseX = 0, mouseY = 0;
let mousePrevDown = false;  // state on previous MOUSE(0) poll
let mouseLastPressTime = 0; // timestamp of last press edge, for double-click detection

function canvasCoords(clientX, clientY) {
  const wdef = frontWindowId !== null ? windowDefs[frontWindowId] : null;
  const c = wdef?.canvas ?? canvas;
  if (!c) return [0, 0];
  const r = c.getBoundingClientRect();
  const logW = wdef?.logW ?? (c.width / CANVAS_SCALE);
  const logH = wdef?.logH ?? (c.height / CANVAS_SCALE);
  return [
    Math.round((clientX - r.left) * logW / r.width),
    Math.round((clientY - r.top)  * logH / r.height),
  ];
}

const canvasWrapper = document.getElementById('canvas-wrapper');
canvasWrapper.addEventListener('mousedown', e => {
  [mouseX, mouseY] = canvasCoords(e.clientX, e.clientY);
  mouseDown = true;
  if (mouseOn) pushEvent('mouse', {x: mouseX, y: mouseY});
});
canvasWrapper.addEventListener('mouseup',   () => { mouseDown = false; mousePrevDown = false; });
canvasWrapper.addEventListener('mousemove', e => { [mouseX, mouseY] = canvasCoords(e.clientX, e.clientY); });
canvasWrapper.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  [mouseX, mouseY] = canvasCoords(t.clientX, t.clientY);
  mouseDown = true;
  if (mouseOn) pushEvent('mouse', {x: mouseX, y: mouseY});
}, {passive: false});
canvasWrapper.addEventListener('touchend',  e => { e.preventDefault(); mouseDown = false; mousePrevDown = false; }, {passive: false});
canvasWrapper.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  [mouseX, mouseY] = canvasCoords(t.clientX, t.clientY);
}, {passive: false});

document.addEventListener('keydown', e => {
});
document.addEventListener('click', e => {
  if (!e.target.closest('.dyn-menu'))
    document.querySelectorAll('.dyn-menu.open').forEach(m => m.classList.remove('open'));
});

function resizeCanvas(w, h) {
  if (!canvas) return;
  canvas.width = w * CANVAS_SCALE; canvas.height = h * CANVAS_SCALE;
  ctx.scale(CANVAS_SCALE, CANVAS_SCALE);
  ctx.fillStyle = currentBg;
  ctx.fillRect(0, 0, w, h);
  if (windowDefs[outputWindowId]) { windowDefs[outputWindowId].logW = w; windowDefs[outputWindowId].logH = h; }
}

// ── File loading ──────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', function(e) {
  const flist = Array.from(e.target.files);
  let pending = flist.length;
  flist.forEach(file => {
    const reader = new FileReader();
    if (file.name.toLowerCase().endsWith('.rsrc')) {
      reader.onload = ev => {
        parseRsrcFile(ev.target.result);
        if (--pending === 0) { updateFileSelect(); autoSelectFile(); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = ev => {
        files[file.name] = ev.target.result;
        if (!loadedFiles.includes(file.name)) loadedFiles.push(file.name);
        if (--pending === 0) { updateFileSelect(); autoSelectFile(); }
      };
      reader.readAsText(file, 'latin1');
    }
  });
  this.value = '';
});

function parseRsrcFile(buffer) {
  const v = new DataView(buffer);
  // AppleDouble magic = 0x00051607
  if (v.getUint32(0) !== 0x00051607) return;
  const nEntries = v.getUint16(24);
  let rsrcOff = -1, rsrcLen = -1;
  for (let i = 0; i < nEntries; i++) {
    const id = v.getUint32(26 + i*12), off = v.getUint32(30 + i*12), len = v.getUint32(34 + i*12);
    if (id === 2) { rsrcOff = off; rsrcLen = len; break; }
  }
  if (rsrcOff < 0) return;
  const r = new DataView(buffer, rsrcOff, rsrcLen);
  const dataOff = r.getUint32(0), mapOff = r.getUint32(4);
  const typeListOffRel = r.getUint16(mapOff + 24);
  const nameListOffRel = r.getUint16(mapOff + 26);
  const typeListAbs = mapOff + typeListOffRel;
  const nameListAbs = mapOff + nameListOffRel;
  const numTypes = r.getUint16(typeListAbs) + 1;
  for (let i = 0; i < numTypes; i++) {
    const tOff = typeListAbs + 2 + i*8;
    const rtype = String.fromCharCode(r.getUint8(tOff),r.getUint8(tOff+1),r.getUint8(tOff+2),r.getUint8(tOff+3));
    if (rtype !== 'TEXT') continue;
    const count = r.getUint16(tOff+4) + 1;
    const refListAbs = typeListAbs + r.getUint16(tOff+6);
    for (let j = 0; j < count; j++) {
      const rr = refListAbs + j*12;
      const nameOffRel = r.getUint16(rr+2);
      const resDataOff = dataOff + (r.getUint32(rr+4) & 0x00FFFFFF);
      const resLen = r.getUint32(resDataOff);
      let name = '';
      if (nameOffRel !== 0xFFFF) {
        const nl = r.getUint8(nameListAbs + nameOffRel);
        for (let k = 0; k < nl; k++) name += String.fromCharCode(r.getUint8(nameListAbs + nameOffRel + 1 + k));
      }
      const bytes = new Uint8Array(buffer, rsrcOff + resDataOff + 4, resLen);
      rsrcTexts[name.toLowerCase()] = macRomanToStr(bytes);
      console.log(`  rsrc TEXT: "${name}" (${resLen} bytes)`);
    }
  }
  console.log(`Loaded ${Object.keys(rsrcTexts).length} TEXT resources from .rsrc`);
}

function openFile() { document.getElementById('file-input').click(); }

function updateFileSelect() {
  const sel = document.getElementById('file-select');
  sel.innerHTML = '';
  if (loadedFiles.length === 0) {
    sel.disabled = true;
    sel.innerHTML = '<option value="">— no file loaded —</option>';
    return;
  }
  loadedFiles.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.disabled = false;
}

function autoSelectFile() {
  if (loadedFiles.length === 0) return;
  const main = loadedFiles.find(n => n.toUpperCase().endsWith('.MAIN'));
  const name = main ?? (loadedFiles.length === 1 ? loadedFiles[0] : null);
  if (name) { document.getElementById('file-select').value = name; selectFile(name); }
}

function selectFile(name) {
  if (!name) return;
  parseAndLoad(name);
}

function flattenIncludes(stmts) {
  // Recursively expand include statements so the whole program is a flat list.
  // This lets GOTO/GOSUB find labels across file boundaries.
  const result = [];
  for (const s of stmts) {
    if (!s) continue;
    if (s.type === 'include') { result.push(...flattenIncludes(s.body)); }
    else { result.push(s); }
  }
  return result;
}

function parseAndLoad(name) {
  console.log(`parsing ${name}…`);
  try {
    const raw = parser.parse(files[name], {
      parseFile: inc => {
        const key = inc.trim();
        if (files[key]) { console.log(`  ↳ ${key}`); return parser.parse(files[key], {parseFile: inner => {
          const k2 = inner.trim();
          if (files[k2]) { console.log(`    ↳ ${k2}`); return parser.parse(files[k2], {parseFile: () => []}); }
          console.log(`    [not found: ${inner}]`); return [];
        }}); }
        console.log(`  [not found: ${inc}]`); return [];
      }
    });
    currentProgram = flattenIncludes(raw);
    console.log(`ok — ${currentProgram.length} statements (${raw.length} before flatten)`);
    document.getElementById('btn-run').disabled = false;
  } catch(err) {
    const loc = err.location;
    console.error(loc ? `✗ ${loc.start.line}:${loc.start.column} ${err.message}` : `✗ ${err.message}`);
    currentProgram = null;
    document.getElementById('btn-run').disabled = true;
  }
}

// ── Event system ──────────────────────────────────────────────
let eventQueue = [];
let eventWaiter = null;

function pushEvent(type, data = {}) {
  const evt = {type, ...data};
  if (eventWaiter) { eventWaiter(evt); eventWaiter = null; }
  else eventQueue.push(evt);
}
async function waitForEvent(timeoutMs) {
  if (stopRequested && !onStopHandler) throw new Error('USER_STOP');
  if (stopRequested && onStopHandler) { stopRequested = false; return {type: 'stop'}; }
  if (eventQueue.length > 0) return eventQueue.shift();
  return new Promise((resolve, reject) => {
    eventWaiter = resolve;
    if (timeoutMs > 0) setTimeout(() => {
      if (eventWaiter === resolve) { eventWaiter = null; resolve({type: 'null'}); }
    }, timeoutMs);
  });
}
function clearEvents() { eventQueue = []; eventWaiter = null; }

// ── Dynamic menu bar ──────────────────────────────────────────
const menuDefs = {};
let lastMenu = 0, lastItem = 0;

function setMenu(menuId, itemId, state, title) {
  if (!menuDefs[menuId]) menuDefs[menuId] = {title: '', enabled: true, checked: false, items: {}};
  if (itemId === 0) {
    menuDefs[menuId].title   = String(title ?? '');
    menuDefs[menuId].enabled = state !== 0;
    menuDefs[menuId].checked = state === 2;
  } else {
    menuDefs[menuId].items[itemId] = {
      title:   String(title ?? ''),

}

function renderMenuBar() {
  const bar = document.getElementById('dynamic-menubar');
  bar.innerHTML = '';
  const ids = Object.keys(menuDefs).map(Number).sort((a,b) => (a===255?-1:b===255?1:a-b));
  const hasAny = ids.some(id => menuDefs[id].title);
  bar.classList.toggle('active', hasAny);
  for (const mid of ids) {
    const m = menuDefs[mid];
    if (!m.title) continue;
    const isBlankTitle = !m.title.trim();
    const wrap = document.createElement('div');
    wrap.className = 'dyn-menu' + (isBlankTitle ? ' dis' : '');
    wrap.dataset.menuId = mid;
    const titleSpan = document.createElement('span');
    titleSpan.textContent = m.title;
    if (mid === 255) titleSpan.style.filter = 'grayscale(1)';
    wrap.appendChild(titleSpan);
    const drop = document.createElement('div');
    drop.className = 'dyn-menu-drop';
    const iids = Object.keys(m.items).map(Number).sort((a,b) => a - b);
    for (const iid of iids) {
      const it = m.items[iid];
      const el = document.createElement('div');
      const isSep = it.title === '-' || it.title === '(-' || it.title.startsWith('---');
      if (isSep) { el.className = 'dyn-menu-item sep'; }
      else {
        el.className = 'dyn-menu-item' + (it.enabled && it.title.trim() ? '' : ' dis');
        el.textContent = (it.checked ? '✓ ' : '    ') + it.title;
        const _mid = mid, _iid = iid;
        el.addEventListener('click', e => {
          e.stopPropagation();
          lastMenu = _mid; lastItem = _iid;
          document.querySelectorAll('.dyn-menu.open').forEach(x => x.classList.remove('open'));
          pushEvent('menu', {menu: _mid, item: _iid});
        });
      }
      drop.appendChild(el);
    }
    wrap.appendChild(drop);
    if (!isBlankTitle) {
      wrap.addEventListener('click', e => {
        e.stopPropagation();
        const wasOpen = wrap.classList.contains('open');
        document.querySelectorAll('.dyn-menu.open').forEach(x => x.classList.remove('open'));
        if (!wasOpen) wrap.classList.add('open');
      });
      wrap.addEventListener('mouseover', () => {
        if (bar.querySelector('.dyn-menu.open') && !wrap.classList.contains('open')) {
          document.querySelectorAll('.dyn-menu.open').forEach(x => x.classList.remove('open'));
          wrap.classList.add('open');
        }
      });
    }
    bar.appendChild(wrap);
  }
}

async function resolveCtrlRect(arg, env) {
  if (!arg) return null;
  if (arg.from) {
    return [
      Math.floor(Number(await evalExpr(arg.from[0], env))),
      Math.floor(Number(await evalExpr(arg.from[1], env))),
      Math.floor(Number(await evalExpr(arg.to[0], env))),
      Math.floor(Number(await evalExpr(arg.to[1], env))),
    ];
  }
  // @varName — address-of a rect variable
  if (arg.type === 'unary' && arg.operator === '@' && arg.expression?.type === 'variable') {
    const obj = readVar(env, arg.expression.name);
    if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
      return [Number(obj.left)||0, Number(obj.top)||0, Number(obj.right)||0, Number(obj.bottom)||0];
    }
    if (Array.isArray(obj)) return [Number(obj[0])||0, Number(obj[1])||0, Number(obj[2])||0, Number(obj[3])||0];
    return null;
  }
  const v = Math.floor(Number(await evalExpr(arg, env)));
  const varName = fnPtrTable[v];
  if (!varName) return null;
  const arr = readVar(env, varName);
  if (!Array.isArray(arr)) return null;
  return [Number(arr[0])||0, Number(arr[1])||0, Number(arr[2])||0, Number(arr[3])||0];
}

function stmtSummary(stmt) {

const regionStore = {};   // handle -> { left, top, right, bottom } | null

function newRegion() {

}
function applyClip(h) {
  if (!ctx) return;
  // restore any previous clip first
  while (clipStack.length) { ctx.restore(); clipStack.pop(); }
  const r = regionStore[h];
  if (r) {
    ctx.save();
    clipStack.push(1);
    ctx.beginPath();
    ctx.rect(r.left, r.top, r.right - r.left, r.bottom - r.top);
    ctx.clip();
  }
}
function resetClip() {
  if (!ctx) return;
  while (clipStack.length) { ctx.restore(); clipStack.pop(); }
}

async function maybeYield() {
  if (stopRequested) {
    if (onStopHandler && handlerDepth === 0) {
      stopRequested = false;
      handlerDepth++;
      try { await callEventHandler(onStopHandler); }
      finally { handlerDepth--; }
    } else {
      throw new Error('USER_STOP');
    }
  }
  if (++yieldCounter % 500 === 0) {
    await new Promise(r => setTimeout(r, 0));
    await fireEventHandlers();
  }
}

async function fireEventHandlers() {
  while (eventQueue.length > 0) {
    const evt = eventQueue[0];
    let lbl = null, evtCode = 0;
    if (evt.type === 'menu' && onMenuHandler) {
      eventQueue.shift();
      lastMenu = evt.menu; lastItem = evt.item;
      lbl = onMenuHandler;
      evtCode = 5; // Mac menuEvt code
    } else if (evt.type === 'mouse' && onMouseHandler) {
      eventQueue.shift();
      lbl = onMouseHandler;
      evtCode = 1; // Mac mouseDown code
    } else if (evt.type === 'timer' && onTimerHandler) {
      eventQueue.shift();
      lbl = onTimerHandler;
    } else if ((evt.type === 'button' || evt.type === 'editfield') && onDialogHandler) {
      eventQueue.shift();
      evtCode = evt.code ?? (evt.type === 'button' ? 1 : 2);
      lastDialogId = evt.id ?? lastDialogId;
      evt.ref = lastDialogId;
      lbl = onDialogHandler;
    } else if (onDialogHandler) {
      eventQueue.shift();
      evtCode = evt.code ?? 0;
      lbl = onDialogHandler;
    } else {
      break;
    }
    handlerDepth++;
    const prevCode = currentDialogEventCode;
    const prevEvt = currentDialogEvent;
    currentDialogEventCode = evtCode;
    currentDialogEvent = evt;
    try { await callEventHandler(lbl); }
    finally { handlerDepth--; currentDialogEventCode = prevCode; currentDialogEvent = prevEvt; }
  }
}

async function callEventHandler(lbl) {
  const stmts = currentProgram;
  const idx = stmts.findIndex(s => s && s.type === 'label' && s.label.toLowerCase() === lbl);
  if (idx < 0) { if (debugMode) console.log(`▶ GOSUB [${lbl}] — label not found`); return; }
  if (debugMode) console.log(`▶ GOSUB → [${lbl}:]`);
  let i = idx + 1;
  while (i < stmts.length) {
    if (stopRequested) throw new Error('USER_STOP');
    const s = stmts[i];
    if (!s) { i++; continue; }
    try {
      const r = await execStmt(s, globalVars);
      if (r instanceof ReturnSignal) return;
    } catch(e) {
      if (e instanceof ReturnSignal) return;
      if (e instanceof GotoSignal) {
        const li = stmts.findIndex(x => x && x.type === 'label' && x.label.toLowerCase() === e.label);
        if (li >= 0) { i = li + 1; continue; }
        throw e;
      }
      if (e instanceof GosubSignal) {
        await callEventHandler(e.label);
        i++; continue;
      }
      throw e;
    }
    i++;
  }
}

class GotoSignal  { constructor(l) { this.label = l; } }

// ── Collect pass (DATA + fn defs) ─────────────────────────────
function collectPass(stmts, fns, data) {
  if (!stmts) return;
  for (const s of stmts) {
    if (!s) continue;
    if (s.type === 'data') { for (const it of s.items) data.push(evalConstant(it)); }
    else if (s.type === 'function' || s.type === 'localFunction') { fns[s.name] = s; collectPass(s.body, fns, data); }
    else if (s.type === 'defFn') { fns[s.name] = s; }
    else if (s.type === 'if') { collectPass(s.body, fns, data); if (s.else) collectPass(s.else, fns, data); }
    else if (s.type === 'for' || s.type === 'while' || s.type === 'do_while') collectPass(s.body, fns, data);
    else if (s.type === 'select') { for (const c of s.cases) collectPass(c.body, fns, data); }
    else if (s.type === 'include') collectPass(s.body, fns, data);
  }
}

function evalConstant(n) {
  if (!n) return null;
  if (n.type === 'constant') return n.value;
  if (n.type === 'literal') return n.value;
  return String(n.value ?? '');
}

// ── Block executor ────────────────────────────────────────────
async function execBlock(stmts, env) {
  if (!stmts) return;
  let i = 0;
  while (i < stmts.length) {
    await maybeYield();
    const stmt = stmts[i];
    if (!stmt) { i++; continue; }
    try {
      const r = await execStmt(stmt, env);
      if (r instanceof ReturnSignal) return r;
    } catch(e) {
      if (e instanceof GotoSignal) {
        const idx = stmts.findIndex(s => s && s.type === 'label' && s.label.toLowerCase() === e.label);
        if (idx >= 0) { if (debugMode) console.log(`▶ GOTO [${e.label}:]`); i = idx + 1; continue; }
        throw e;
      }
      if (e instanceof GosubSignal) {
        const idx = stmts.findIndex(s => s && s.type === 'label' && s.label.toLowerCase() === e.label);
        if (idx >= 0) {
          if (debugMode) console.log(`▶ GOSUB → [${e.label}:]`);
          let j = idx + 1;
          gosub_inner: while (j < stmts.length) {
            await maybeYield();
            const s2 = stmts[j];
            if (!s2) { j++; continue; }
            try {
              const r2 = await execStmt(s2, env);
              if (r2 instanceof ReturnSignal) break;
            } catch(e2) {
              if (e2 instanceof ReturnSignal) break;
              if (e2 instanceof GotoSignal) {
                const li = stmts.findIndex(s => s && s.type === 'label' && s.label.toLowerCase() === e2.label);
                if (li >= 0) { if (debugMode) console.log(`▶ GOTO [${e2.label}:]`); j = li + 1; continue gosub_inner; }
                throw e2;
              }
              if (e2 instanceof GosubSignal) {
                const ni = currentProgram.findIndex(s => s && s.type === 'label' && s.label.toLowerCase() === e2.label);
                if (ni >= 0) { await callEventHandler(e2.label); j++; continue gosub_inner; }
                throw e2;
              }
              throw e2;
            }
            j++;
          }
          i++; continue;
        }
        throw e;
      }
      throw e;
    }
    i++;
  }
}

// ── Statement dispatcher ──────────────────────────────────────
async function execStmt(stmt, env) {
  if (!stmt) return;
  if (debugMode) { const s = stmtSummary(stmt); if (s) console.log(`▶ ${s}`); }
  switch (stmt.type) {
    case 'assign':        return execAssign(stmt, env);
    case 'print':         return execPrint(stmt, env);
    case 'sysFuncCall':   return execSysCall(stmt, env);
    case 'if':            return execIf(stmt, env);
    case 'for':           return execFor(stmt, env);
    case 'while':         return execWhile(stmt, env);
    case 'do_while':      return execDoWhile(stmt, env);
    case 'select':        return execSelect(stmt, env);
    case 'on':            return execOn(stmt, env);
    case 'onEvent': {
      const lbl = labelOf(stmt.handler);
      if (stmt.event === 'MENU') onMenuHandler = lbl;
      else if (stmt.event === 'DIALOG') onDialogHandler = lbl;
      else if (stmt.event === 'MOUSE') onMouseHandler = lbl;
      else if (stmt.event === 'TIMER') {
        onTimerHandler = lbl;
        if (stmt.interval !== undefined) {
          const ms = Math.round(Math.abs(Number(await evalExpr(stmt.interval, env))) * 1000 / 60);
          timerInterval = ms > 0 ? ms : 1000;
        }
        // Start the timer interval now; events are gated by timerOn flag
        if (timerHandle) clearInterval(timerHandle);
        const ms = timerInterval > 0 ? timerInterval : 1000;
        timerHandle = setInterval(() => { if (running && timerOn) pushEvent('timer'); }, ms);
      }
      else if (stmt.event === 'EVENT') onEventHandler = lbl;
      else if (stmt.event === 'STOP') onStopHandler = lbl;
      return;
    }
    case 'procedureCall': return execProcCall(stmt, env);
    case 'userFuncCall':  return execUserFuncCall(stmt, env);
    case 'exprStmt':      await evalExpr(stmt.expr, env); return;
    case 'include':       return execBlock(stmt.body, env);
    case 'end':           throw new Error('END');
    case 'function': case 'localFunction': funcDefs[stmt.name] = stmt; return;
    case 'defFn': funcDefs[stmt.name] = stmt; return;
    case 'dim': return execDim(stmt, env);
    case 'def': case 'defCmd': return;  // compiler directives — ignored at runtime
    case 'label': case 'data': case 'comment': case 'remark': return;  // not executable
    case 'endGlobals': case 'includeFile': return;  // PG:PRO framework directives — no-op
    default: console.log(`unsupported stmt: ${stmt.type}`); return;
  }
}

// ── assign ────────────────────────────────────────────────────
// ZBasic type suffixes %&!# are just type hints — strip them for storage lookup.
// ($ stays because string variables are distinct from numeric variables.)
function normVarName(name) {
  return (name && /[%&!#]$/.test(name)) ? name.slice(0, -1) : name;
}

function readVar(env, name) {
  const n = normVarName(name);
  if (n in env) return env[n];
  if (n in globalVars) return globalVars[n];
  if (name in env) return env[name];
  if (name in globalVars) return globalVars[name];
  return undefined;
}

function writeVar(env, name, val) {
  // In ZBasic, variables are global unless they're function parameters (own properties of local env).
  // If the name is an own property of env (i.e., a parameter or locally declared var), write there.
  // Otherwise write to globalVars so user functions can modify shared state.
  const n = normVarName(name);
  if (env === globalVars || Object.prototype.hasOwnProperty.call(env, n) || Object.prototype.hasOwnProperty.call(env, name)) {
    env[n] = val;
  } else {
    globalVars[n] = val;
  }
}

async function execAssign(stmt, env) {
  const val = await evalExpr(stmt.value, env);
  const name = stmt.name;
  if (stmt.fields && stmt.fields.length > 0 && stmt.idx) {
    // Struct array: gShopper.SLoc.v%(0) = x → flat array 'gshopper.sloc.v%'[0] = x
    const flatName = (name + '.' + stmt.fields.join('.')).toLowerCase();
    const idxs = await Promise.all(stmt.idx.map(x => evalExpr(x, env)));
    const idx = idxs[0] ?? 0;
    let arr = env[flatName] ?? globalVars[flatName];
    if (!Array.isArray(arr)) { arr = []; globalVars[flatName] = arr; }
    arr[idx] = val;
    return;
  }
  if (stmt.idx) {
    const arr = readVar(env, name);
    const idxs = await Promise.all(stmt.idx.map(x => evalExpr(x, env)));
    if (Array.isArray(arr)) {
      let a = arr;
      for (let d = 0; d < idxs.length - 1; d++) a = a[idxs[d]] || (a[idxs[d]] = []);
      a[idxs[idxs.length - 1]] = val;
    }
    return;
  }
  if (stmt.fields && stmt.fields.length > 0) {
    const target = readVar(env, name) ?? {};
    writeVar(env, name, target);
    let obj = target;
    for (let i = 0; i < stmt.fields.length - 1; i++) obj = obj[stmt.fields[i]] || (obj[stmt.fields[i]] = {});
    obj[stmt.fields[stmt.fields.length - 1]] = val;
    return;
  }
  writeVar(env, name, val);
}

// ── dim ───────────────────────────────────────────────────────
async function execDim(stmt, env) {
  for (const a of stmt.args) {
    const name = a.name;
    if (a.dims && a.dims.length > 0) {
      const sizes = await Promise.all(a.dims.map(d => evalExpr(d, env)));
      writeVar(env, name, makeArray(sizes));
    } else {
      // Only initialize if not already set (DIM without size is just a declaration)
      if (!(name in globalVars) && !Object.prototype.hasOwnProperty.call(env, name))
        writeVar(env, name, null);
    }
  }
}
function makeArray(sizes) {
  const sz = (sizes[0] || 0) + 1;
  if (sizes.length === 1) return new Array(sz).fill(0);
  return Array.from({length: sz}, () => makeArray(sizes.slice(1)));
}

// ── print ─────────────────────────────────────────────────────
async function execPrint(stmt, env) {
  let parts = [];
  for (const item of stmt.items) {
    if (item === null) { parts.push(''); continue; }
    parts.push(item.type === 'using' ? String(await evalExpr(item.expr, env)) : String(await evalExpr(item, env)));
  }
  const text = parts.join('');
  const mode = stmt.mode;

  if (mode.type === '#') { console.log(text); return; }
  if (mode.type === '%') {
    gfxText(text, await evalExpr(mode.coord.x, env), await evalExpr(mode.coord.y, env)); return;
  }
  if (mode.type === '@') {
    const col = await evalExpr(mode.coord.x, env);
    const row = await evalExpr(mode.coord.y, env);
    gfxText(text, col * Math.round(textSize * 0.6), row * (textSize + 4)); return;
  }
  // plain PRINT — send to console
  console.log(text);
}

function gfxText(txt, x, y) {
  ctx.fillStyle = currentFg;
  ctx.font = `${textSize}px monospace`;
  ctx.fillText(txt, x, y);
  gfxPenX = x + ctx.measureText(txt).width;
  gfxPenY = y;
}

// ── sys calls ─────────────────────────────────────────────────
async function execSysCall(stmt, env) {
  const cmd = stmt.cmd;
  const args = stmt.args || [];

  async function a(i)  { if (i >= args.length || !args[i]) return null; return evalExpr(args[i], env); }
  async function n(i)  { return Number(await a(i)) || 0; }
  async function s(i)  { return String(await a(i) ?? ''); }
  async function allN() { return Promise.all(args.map((x,i) => x ? n(i) : null)); }

  switch(cmd) {
    // ── graphics ────────────────────────────────────────────
    case 'CLS': case 'HOME': {
      if (!ctx) { getOrCreateWindow(1, null, 512, 342); setOutputWindow(1); }
      showCanvas();
      ctx.fillStyle = currentBg; ctx.fillRect(0, 0, canvas.width, canvas.height);
      textX = 1; textY = textSize; return;
    }

    case 'COLOR': {
      const nums = await allN();
      const valid = nums.filter(x => x !== null);
      if (valid.length === 1) currentFg = mac16(valid[0]);
      else if (valid.length === 2) { currentFg = mac16(valid[0]); currentBg = mac16(valid[1]); }
      else if (valid.length >= 3) currentFg = `rgb(${valid[0]},${valid[1]},${valid[2]})`;
      return;
    }

    case 'PEN': {
      const v = await n(0);
      if (v !== 0) { penWidth = v; penHeight = v; }
      if (args.length >= 2) { const h = await n(1); if (h !== 0) penHeight = h; }
      if (args.length >= 4) {
        const mode = Math.round(await n(3));
        if (mode === 10 && gfxPenMode !== 10) {
          // Entering XOR mode: take clean-canvas snapshot
          gfxPenMode = 10;
          if (!xorSnapshot) xorSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        } else if (mode !== 10 && gfxPenMode === 10) {
          // Leaving XOR mode: restore snapshot (erase rubber-band line)
          gfxPenMode = mode;
          if (xorSnapshot) { ctx.putImageData(xorSnapshot, 0, 0); xorSnapshot = null; }
        } else {
          gfxPenMode = mode;
        }
      }
      if (args.length >= 5 && args[4] !== null) {
        // Mac pen patterns: 0=default(black), 1=ltGray, 2=gray, 3=dkGray, 4=black, 5=lightGray
        const pat = Math.round(await n(4));
        const grayMap = {0:'#000000', 1:'#bbbbbb', 2:'#888888', 3:'#555555', 4:'#000000', 5:'#999999'};
        currentFg = grayMap[pat] ?? '#000000';
      }
      if (ctx) ctx.lineWidth = penWidth;
      return;
    }

    case 'PLOT': {
      showCanvas();
      const pt = args[0];
      if (pt && pt.x !== undefined) { penX = await evalExpr(pt.x, env); penY = await evalExpr(pt.y, env); }
      else { penX = await n(0); penY = await n(1); }
      ctx.fillStyle = currentFg;
      ctx.fillRect(penX, penY, penWidth, penHeight);
      return;
    }

    case 'LINE': {
      showCanvas();
      ctx.strokeStyle = currentFg; ctx.lineWidth = penWidth; ctx.beginPath();
      for (const arg of args) {
        if (!arg) continue;
        if (arg.type === 'lineRel') {
          const tx = await evalExpr(arg.to.x, env), ty = await evalExpr(arg.to.y, env);
          ctx.moveTo(penX, penY); penX += tx; penY += ty; ctx.lineTo(penX, penY);
        } else if (arg.x !== undefined) {
          const tx = await evalExpr(arg.x, env), ty = await evalExpr(arg.y, env);
          ctx.moveTo(penX, penY); penX = tx; penY = ty; ctx.lineTo(penX, penY);
        } else if (arg.from) {
          const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
          ctx.moveTo(await ev(arg.from[0]), await ev(arg.from[1]));
          ctx.lineTo(await ev(arg.to[0]), await ev(arg.to[1]));
        } else if (arg.type === 'polyline') {
          for (let pi = 0; pi < arg.points.length; pi++) {
            const px = await evalExpr(arg.points[pi][0], env), py = await evalExpr(arg.points[pi][1], env);
            if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
        }
      }
      ctx.stroke(); return;
    }

    case 'BOX': {
      showCanvas();
      let x1, y1, x2, y2;
      const a0 = args[0];
      if (a0 && a0.from) {
        const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
        x1 = await ev(a0.from[0]); y1 = await ev(a0.from[1]);
        x2 = await ev(a0.to[0]);   y2 = await ev(a0.to[1]);
      } else { [x1,y1,x2,y2] = await Promise.all([n(0),n(1),n(2),n(3)]); }
      ctx.lineWidth = penWidth;
      if (stmt.keyword === 'FILL') { ctx.fillStyle = currentFg; ctx.fillRect(x1,y1,x2-x1,y2-y1); }
      else { ctx.strokeStyle = currentFg; ctx.strokeRect(x1,y1,x2-x1,y2-y1); }
      return;
    }

    case 'CIRCLE': {
      showCanvas();
      const a0 = args[0];
      let cx, cy, r;
      if (a0 && a0.x !== undefined) {
        cx = await evalExpr(a0.x, env); cy = await evalExpr(a0.y, env); r = await n(1);
      } else { cx = await n(0); cy = await n(1); r = await n(2); }
      ctx.lineWidth = penWidth; ctx.beginPath();
      ctx.arc(cx, cy, Math.abs(r), 0, Math.PI * 2);
      if (stmt.keyword === 'FILL') { ctx.fillStyle = currentFg; ctx.fill(); }
      else { ctx.strokeStyle = currentFg; ctx.stroke(); }
      return;
    }

    case 'TEXT': {
      showCanvas();
      const a0 = args[0];
      if (a0 && a0.x !== undefined) {
        // TEXT (x,y), string — draw text at pixel coordinates
        gfxText(await s(1), await evalExpr(a0.x, env), await evalExpr(a0.y, env));
      } else {
        // TEXT font, size [, style [, mode]] — set font attributes
        if (args[1]) textSize = Math.max(1, await n(1));
      }
      return;
    }

    case 'SCROLL': {
      if (stmt.keyword === 'BUTTON') {
        // SCROLL BUTTON id, value, min, max, pageSize [, refCon [, type 1=vert 2=horiz]]
        const id = Math.floor(await n(0));
        const value = Math.floor(await n(1));
        const min = Math.floor(await n(2));
        const max = Math.floor(await n(3));
        const pageSize = args[4] ? Math.floor(await n(4)) : 10;
        const scrollType = args[6] ? Math.floor(await n(6)) : 1;
        if (controlStore[id]) Object.assign(controlStore[id], {value, min, max, pageSize});
        else controlStore[id] = {el: null, type: scrollType === 2 ? 'hscroll' : 'vscroll', value, min, max, pageSize};
        return;
      }
      if (!ctx) return;
      const dh = await n(0), dv = await n(1);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      ctx.clearRect(0, 0, canvas.width / CANVAS_SCALE, canvas.height / CANVAS_SCALE);
      ctx.putImageData(img, dh * CANVAS_SCALE, dv * CANVAS_SCALE);
      return;
    }

    case 'GET': {
      // GET (x1,y1)-(x2,y2), ArrayName(index) — capture screen region to sprite buffer
      if (!ctx) return;
      const a0 = args[0], a1 = args[1];
      if (!a0 || !a1) return;
      const ev = x => (x && typeof x === 'object') ? evalExpr(x, env) : Promise.resolve(Number(x));
      const x1 = Math.floor(Number(await ev(a0.from?.[0]))), y1 = Math.floor(Number(await ev(a0.from?.[1])));
      const x2 = Math.floor(Number(await ev(a0.to?.[0]))),  y2 = Math.floor(Number(await ev(a0.to?.[1])));
      const sx = Math.min(x1, x2), sy = Math.min(y1, y2);
      const w = Math.abs(x2 - x1) + 1, h = Math.abs(y2 - y1) + 1;
      if (a1.type === 'callable' || a1.type === 'variable') {
        const idx = a1.args?.[0] ? Math.floor(Number(await evalExpr(a1.args[0], env))) : 0;
        spriteBuffer[`${a1.name}_${idx}`] = ctx.getImageData(sx * CANVAS_SCALE, sy * CANVAS_SCALE, w * CANVAS_SCALE, h * CANVAS_SCALE);
      }
      return;
    }

    case 'PUT': {
      // PUT (x,y), ArrayName(index) [,mode]  — draw sprite from buffer at position
      // PUT (x1,y1)-(x2,y2), ArrayName(index) [,mode]  — draw into rect
      if (!ctx) return;
      const a0 = args[0], a1 = args[1];
      if (!a0 || !a1) return;
      let dx, dy;
      if (a0.x !== undefined) {
        dx = Math.floor(Number(await evalExpr(a0.x, env)));
        dy = Math.floor(Number(await evalExpr(a0.y, env)));
      } else if (a0.from) {
        dx = Math.floor(Number(await evalExpr(a0.from[0], env)));
        dy = Math.floor(Number(await evalExpr(a0.from[1], env)));
      } else return;
      const isXor = stmt.trailer?.some(t => t.keyword === 'XOR');
      if (a1.type === 'callable' || a1.type === 'variable') {
        const idx = a1.args?.[0] ? Math.floor(Number(await evalExpr(a1.args[0], env))) : 0;
        const imgData = spriteBuffer[`${a1.name}_${idx}`];
        if (imgData) {
          if (isXor) {
            // XOR blend: read canvas pixels and XOR with sprite pixels
            const sdx = dx * CANVAS_SCALE, sdy = dy * CANVAS_SCALE;
            const w = imgData.width, h = imgData.height;
            const bg = ctx.getImageData(sdx, sdy, w, h);
            const sp = imgData.data, bg_ = bg.data;
            for (let i = 0; i < sp.length; i += 4) {
              bg_[i]   ^= sp[i];
              bg_[i+1] ^= sp[i+1];
              bg_[i+2] ^= sp[i+2];
              bg_[i+3] = 255;
            }
            ctx.putImageData(bg, sdx, sdy);
          } else {
            ctx.putImageData(imgData, dx * CANVAS_SCALE, dy * CANVAS_SCALE);
          }
        }
      }
      return;
    }

    case 'LOCAL': {
      // LOCAL var1, var2, ... — shadow parent-scope variables in this env
      for (const arg of args) {
        if (!arg) continue;
        const name = arg.name;
        if (name && !Object.prototype.hasOwnProperty.call(env, name))
          env[name] = name.endsWith('$') ? '' : 0;

      return;
    }
    case 'CLEAR LOCAL': {

      for (const key of Object.keys(env)) {

    case 'WINDOW': {

      if (stmt.keyword === 'CLOSE') {
        let wid;
        if (args[0]?.type === 'channel') {
          wid = Math.floor(Number(await evalExpr(args[0].n, env)));
        } else {
          wid = args[0] ? Math.floor(Number(await evalExpr(args[0], env))) : outputWindowId;
        }
        if (windowDefs[wid]) {
          windowDefs[wid].container.remove();
          delete windowDefs[wid];
          renderTabs();
          if (outputWindowId === wid) { outputWindowId = null; canvas = null; ctx = null; }
          if (frontWindowId === wid) frontWindowId = null;
        }
        return;
      }
      if (stmt.keyword === 'OUTPUT') {
        const wid = args[0] ? Math.floor(Number(await evalExpr(args[0], env))) : 1;
        setOutputWindow(wid);
        return;
      }
      const a0 = args[0];
      if (stmt.chan) {
        // WINDOW #N [, title [, (x1,y1)-(x2,y2) [, type]]]
        const wid = Math.floor(Number(await evalExpr(stmt.chan, env)));
        if (!a0) {
          // WINDOW #N — bring existing window to front
          if (windowDefs[wid]) { bringToFront(wid); }
          setOutputWindow(wid);
        } else {
          const title = a0 ? String(await evalExpr(a0, env)) : null;
          let w = 512, h = 342;
          if (args[1] && args[1].from) {
            const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
            const x1 = await ev(args[1].from[0]), y1 = await ev(args[1].from[1]);
            const x2 = await ev(args[1].to[0]),   y2 = await ev(args[1].to[1]);
            w = x2 - x1; h = y2 - y1;
          }
          getOrCreateWindow(wid, title, w, h);
          setOutputWindow(wid);
          if (title) document.title = title;
        }
      } else if (a0 && a0.from) {
        // WINDOW (x1,y1)-(x2,y2)
        const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
        const x1 = await ev(a0.from[0]), y1 = await ev(a0.from[1]);
        const x2 = await ev(a0.to[0]),   y2 = await ev(a0.to[1]);
        getOrCreateWindow(outputWindowId || 1, null, x2 - x1, y2 - y1);
        setOutputWindow(outputWindowId || 1);
      } else if (a0 && !a0.from) {
        // WINDOW id [, title [, (x1,y1)-(x2,y2) [, type]]]
        const wid = Math.floor(Number(await evalExpr(a0, env))) || 1;
        if (args.length === 1 && windowDefs[wid]) {
          // WINDOW ref — just bring existing window to front
          bringToFront(wid); setOutputWindow(wid);
        } else {
          const title = args[1] ? String(await evalExpr(args[1], env)) : null;
          let w = 512, h = 342;
          if (args[2] && args[2].from) {
            const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
            const x1 = await ev(args[2].from[0]), y1 = await ev(args[2].from[1]);
            const x2 = await ev(args[2].to[0]),   y2 = await ev(args[2].to[1]);
            w = x2 - x1; h = y2 - y1;
          }
          getOrCreateWindow(wid, title, w, h);
          setOutputWindow(wid);
          if (title) document.title = title;
        }
      }
      showCanvas(); return;
    }

    // ── control ──────────────────────────────────────────────
    case 'GOTO':  throw new GotoSignal(labelOf(args[0]));
    case 'GOSUB': throw new GosubSignal(labelOf(args[0]));
    case 'RETURN': throw new ReturnSignal();
    case 'STOP':   throw new Error('STOP');

    // ── data ─────────────────────────────────────────────────
    case 'READ': {
      for (const arg of args) {
        if (!arg) continue;
        const val = dataStore[dataPtr++] ?? null;
        if (arg.type === 'variable') {
          writeVar(env, arg.name, val);
        } else if ((arg.type === 'callable' || arg.type === 'subscript') && arg.name) {
          // Array subscript: READ C$(M,C)
          const arr = env[arg.name] ?? globalVars[arg.name];
          if (Array.isArray(arr) && arg.args?.length > 0) {
            const idxs = await Promise.all(arg.args.map(x => x ? evalExpr(x, env) : 0));

    case 'APPLE': {

      const title = await s(0);

      const idx = Math.max(0, ...Object.keys(menuDefs[255].items).map(Number)) + 1;

    case 'DIALOG': {
      if (stmt.keyword === 'ON') {

        globalVars['d0'] = 0;
        dialogOn = true;
        // Yield to browser and dispatch any pending events, like EVENT ON
        await new Promise(r => setTimeout(r, 0));
        await fireEventHandlers();
        return;
      }
      if (stmt.keyword === 'OFF') { dialogOn = false; return; }
      const nn = await n(0);
      if (nn === 0) {
        const evt = await waitForEvent(0);
        if (debugMode) console.log(`▶ DIALOG 0 got event: ${evt?.type ?? 'null'}`);
        if (evt && evt.type === 'menu' && onMenuHandler) {

        } else if (evt && evt.type === 'mouse' && onMouseHandler) {

        } else if (evt && evt.type === 'timer' && onTimerHandler) {

        } else if (evt && evt.type === 'stop' && onStopHandler) {
          await callEventHandler(onStopHandler);
        } else if (evt && evt.type !== 'stop' && onDialogHandler) {
          await callEventHandler(onDialogHandler);
        }
      } else if (args.length >= 2) {
        const msg = await s(1);
        await alertUser('', msg);
      }

    }

    case 'INPUT': {

      let varIdx = args.length - 1;
      if (args.length >= 2 && args[0] && args[0].type === 'literal') {

      }

      const target = args[varIdx];

      return;

    case 'DELAY': { const ms = await n(0); await new Promise(r => setTimeout(r, ms * 16)); return; }

    case 'SWAP': {

      if (!a0) return;

        const flatName = (a0.name + '.' + a0.fields.join('.')).toLowerCase();
        const idx = Math.floor(Number(await evalExpr(a0.args?.[0], env) ?? 0));

      return;
    }

    case 'BREAK':

      return;

    case 'MOUSE':
      if (stmt.keyword === 'ON')  { mouseOn = true;  return; }
      if (stmt.keyword === 'OFF') { mouseOn = false; return; }
      console.log(`unsupported: MOUSE ${stmt.keyword ?? ''}`); return;

    case 'TIMER': {
      if (stmt.keyword === 'ON') {
        timerOn = true;
        return;
      }
      if (stmt.keyword === 'OFF') {
        timerOn = false;
        return;
      }

      timerInterval = Math.round((await n(0)) * 1000 / 60);
      return;
    }

    case 'EVENT':
      // EVENT ON/OFF — global event enable. EVENT ON yields to the browser and
      // dispatches any pending events to their registered handlers.
      if (stmt.keyword === 'ON') {

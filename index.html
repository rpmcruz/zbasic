    case 'onEvent': {
      const lbl = labelOf(stmt.handler);
      if (stmt.event === 'MENU') onMenuHandler = lbl;
      else if (stmt.event === 'DIALOG') onDialogHandler = lbl;
      else if (stmt.event === 'MOUSE') onMouseHandler = lbl;
      else if (stmt.event === 'TIMER') {
        onTimerHandler = lbl;
        if (stmt.interval !== undefined) {
          const ms = Math.round(Math.abs(Number(await evalExpr(stmt.interval, env))) * 1000 / 60);
          timerInterval = ms > 0 ? ms : 1000;
        }
        // Start the timer interval now; events are gated by timerOn flag
        if (timerHandle) clearInterval(timerHandle);
        const ms = timerInterval > 0 ? timerInterval : 1000;
        timerHandle = setInterval(() => { if (running && timerOn) pushEvent('timer'); }, ms);
      }
      else if (stmt.event === 'EDIT') onEditHandler = lbl;
      else if (stmt.event === 'BREAK') { /* command-period trap — no keyboard equivalent here */ }
      else if (stmt.event === 'EVENT') onEventHandler = lbl;
      else if (stmt.event === 'STOP') onStopHandler = lbl;
      return;
    }
    case 'procedureCall': return execProcCall(stmt, env);
    case 'userFuncCall':  return execUserFuncCall(stmt, env);
    case 'exprStmt':      await evalExpr(stmt.expr, env); return;
    case 'include':       return execBlock(stmt.body, env);
    case 'end':           throw new Error('END');
    case 'function': case 'localFunction': funcDefs[stmt.name] = stmt; return;
    case 'defFn': funcDefs[stmt.name] = stmt; return;
    case 'dim': return execDim(stmt, env);
    case 'def':
      // DEF name = expr is a compile-time equate, except for DEF MOUSE, which
      // picks the mouse dialect MOUSE() answers in (see msMouseSyntax).
      if (String(stmt.name).toUpperCase() === 'MOUSE')
        msMouseSyntax = Number(await evalExpr(stmt.value, env)) !== 0;
      return;
    case 'defCmd': {
      // Most DEF <keyword> forms are compiler directives with no runtime effect;
      // DEF TAB changes the column width used by "," in PRINT.
      const dk = String(stmt.keyword).toLowerCase();
      // `DEF MOUSE = 1` (spaces around "=") parses as a `def` equate and is
      // handled there; `DEF MOUSE=-1` reaches us instead, because `definition`
      // demands whitespace around the "=" and this rule does not.
      if (dk === 'mouse' && stmt.arg)
        msMouseSyntax = Number(await evalExpr(stmt.arg, env)) !== 0;
      if (dk === 'tab' && stmt.arg)
        printTab = Math.max(1, Math.floor(Number(await evalExpr(stmt.arg, env))) || 16);
      // DEF SHADOWBOX(rect) comes from the ZMover library rather than ZBasic
      // proper (Grglflx's source even notes it needs that library installed).
      // It frames the rect and drops a shadow down and to the right; it is what
      // draws Grglflx's two plot areas, so without it the game board is blank.
      if (dk === 'shadowbox' && ctx) {
        const r = await resolveRect((stmt.args && stmt.args[0]) || stmt.arg, env);
        if (r && r.right > r.left && r.bottom > r.top) {
          const w = r.right - r.left, h = r.bottom - r.top, sh = 2;
          // The frame sits just *outside* the rect, leaving the whole rect as
          // usable content. Drawing it on the boundary instead let Grglflx's
          // own `BOX FILL Xmin,Ytop TO X,Ybottom-2` erase (which starts exactly
          // at the rect's top-left) eat the part of the border it had swept
          // past, leaving a stray stub of the top edge out to the right.
          ctx.fillStyle = currentFg;
          ctx.fillRect(r.left - 1, r.top - 1, w + 2, 1);    // top edge
          ctx.fillRect(r.left - 1, r.bottom, w + 2, 1);     // bottom edge
          ctx.fillRect(r.left - 1, r.top - 1, 1, h + 2);    // left edge
          ctx.fillRect(r.right, r.top - 1, 1, h + 2);       // right edge
          ctx.fillRect(r.left + 1, r.bottom + 1, w + 2, sh);   // shadow underneath
          ctx.fillRect(r.right + 1, r.top + 1, sh, h + 2);     // shadow at the right
        }
      }
      return;
    }
    case 'label': case 'data': case 'comment': case 'remark': return;  // not executable
    case 'endGlobals': case 'includeFile': return;  // PG:PRO framework directives — no-op
    case 'dimRecord': case 'dimEndRecord': return;  // RECORD type declarations — no-op at runtime
    default: console.log(`unsupported stmt: ${stmt.type}`); return;
  }
}

// ── assign ────────────────────────────────────────────────────
// ZBasic type suffixes %&!# are just type hints — strip them for storage lookup.
// ($ stays because string variables are distinct from numeric variables.)
// Marks a scope created for a LOCAL FN, whose undeclared variables stay local.
const LOCAL_SCOPE = Symbol('localScope');

function makeLocalScope(fn, env) {
  // LOCAL FN gets a fresh scope chained to the globals; LONG FN shares the
  // caller's, since its variables are global in ZBasic.
  const isLocal = fn.type === 'localFunction';
  const scope = Object.create(isLocal ? globalVars : env);
  if (isLocal) scope[LOCAL_SCOPE] = true;
  return scope;
}

function normVarName(name) {
  const s = (name && /[%&!#]$/.test(name)) ? name.slice(0, -1) : name;
  return s ? s.toLowerCase() : s;
}

// ── numeric types ─────────────────────────────────────────────
// A ZBasic variable's type comes from its name suffix: % = integer (16 bit),
// & = long integer (32 bit), ! / # = single/double precision, $ = string.
// Manual, "Numeric Conversions": assigning a real to an integer variable
// truncates the fractional part, and out-of-range results wrap silently.
// normVarName() drops the suffix so that `gShopper.STargetLine%` and the
// bare `gShopper.STargetLine` the source actually writes are one variable —
// so the type has to be remembered here instead.
const varTypes   = Object.create(null);   // canonical name → 'int' | 'long' | 'real'
const recordDefs = Object.create(null);   // record name → dim-arg list

function suffixType(name) {
  if (!name) return null;
  const c = name[name.length - 1];
  return c === '%' ? 'int' : c === '&' ? 'long' : (c === '!' || c === '#') ? 'real' : null;
}

// First suffix seen wins, except that a later real/int disagreement (two truly
// distinct ZBasic variables that normVarName has merged) disables coercion.
function noteType(canon, t) {
  if (!t || !canon) return;
  const prev = varTypes[canon];
  if (prev === undefined) varTypes[canon] = t;
  else if (prev !== t && prev !== 'mixed') varTypes[canon] = 'mixed';
}

function coerceVar(canon, val) {
  const t = varTypes[canon];
  if (t !== 'int' && t !== 'long') return val;
  if (typeof val !== 'number') return val;
  if (!Number.isFinite(val)) return 0;
  const n = Math.trunc(val);
  return t === 'int' ? (n << 16 >> 16) : (n | 0);
}

// Subscripts are integer expressions; a fractional index selects element INT(i).
const subIdx = v => { const n = Math.trunc(Number(v)); return Number.isFinite(n) ? n : 0; };

// Record instances are stored as one flat array per leaf field
// ('gshopper.sloc.h'), so a whole-record read has to gather those back up and a
// whole-record write has to scatter them out again. ZBasic assigns records as
// units — `gShopper(a) = gShopper(b)` copies every field — and Supermarket's
// shell sort swaps shoppers that way.
const recordOf = Object.create(null);   // canonical instance name → record name

function recordLeafPaths(recName, prefix = '', out = []) {
  for (const f of recordDefs[recName] ?? []) {
    const fn = normVarName(f.name);
    if (f.dotType === 'pt') out.push(prefix + fn + '.v', prefix + fn + '.h');
    else if (f.dotType && recordDefs[f.dotType]) recordLeafPaths(f.dotType, prefix + fn + '.', out);
    else out.push(prefix + fn);
  }
  return out;
}

// Gather instance[idx] (or the whole scalar instance when idx is null) into the
// nested plain object that chainAccess already knows how to read fields out of.
function readRecord(base, idx) {
  const rec = recordOf[base];
  if (!rec) return null;
  const val = {};
  for (const p of recordLeafPaths(rec)) {
    const cell = globalVars[`${base}.${p}`];
    const v = idx === null ? (cell ?? 0) : (Array.isArray(cell) ? (cell[idx] ?? 0) : 0);
    const parts = p.split('.');
    let o = val;
    for (let i = 0; i < parts.length - 1; i++) o = (o[parts[i]] ??= {});
    o[parts[parts.length - 1]] = v;
  }
  return val;
}

function writeRecord(base, idx, val) {
  const leaves = {};
  (function walk(o, pre) {
    for (const k in o) {
      const v = o[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, pre + k + '.');
      else leaves[pre + k] = v;
    }
  })(val && typeof val === 'object' ? val : {}, '');
  for (const p in leaves) {
    const key = `${base}.${p}`;
    if (idx === null) { globalVars[key] = coerceVar(key, leaves[p]); continue; }
    let arr = globalVars[key];
    if (!Array.isArray(arr)) { arr = []; globalVars[key] = arr; }
    arr[idx] = coerceVar(key, leaves[p]);
  }
}

// Register the fields a record instance contributes. `DIM SLoc.pt` is a Point,
// which is two integers named .v and .h.
function noteRecordFields(base, recName) {
  const fields = recordDefs[recName];
  if (!fields) return;
  for (const f of fields) {
    const fname = normVarName(f.name);
    if (f.dotType === 'pt') {
      noteType(`${base}.${fname}.v`, 'int');
      noteType(`${base}.${fname}.h`, 'int');
    } else if (f.dotType && recordDefs[f.dotType]) {
      noteRecordFields(`${base}.${fname}`, f.dotType);
    } else {
      noteType(`${base}.${fname}`, suffixType(f.name));
    }
  }
}

// One walk over the whole flattened program, before anything executes, so that
// a variable's type is known even at its very first assignment.
function collectTypes(stmts, state = {record: null}) {
  const noteNode = n => {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { for (const c of n) noteNode(c); return; }
    if (typeof n.name === 'string') {
      const fields = Array.isArray(n.fields) ? n.fields : [];
      const last = fields.length ? fields[fields.length - 1] : n.name;
      const canon = [n.name, ...fields].map(normVarName).join('.');
      noteType(canon, suffixType(last));
    }
    for (const k in n) if (k !== 'name' && k !== 'fields') noteNode(n[k]);
  };

  for (const s of stmts) {
    if (!s) continue;
    switch (s.type) {
      case 'dimRecord':    state.record = s.name; recordDefs[s.name] = []; continue;
      case 'dimEndRecord': state.record = null; continue;
      case 'dim':
        for (const a of s.args ?? []) {
          if (state.record) { recordDefs[state.record].push(a); continue; }
          if (a.dotType === 'pt') {
            noteType(normVarName(a.name) + '.v', 'int');
            noteType(normVarName(a.name) + '.h', 'int');
          } else if (a.dotType && recordDefs[a.dotType]) {
            recordOf[normVarName(a.name)] = a.dotType;
            noteRecordFields(normVarName(a.name), a.dotType);
          } else {
            noteType(normVarName(a.name), suffixType(a.name));
          }
        }
        continue;
      case 'function': case 'localFunction': collectTypes(s.body ?? [], state); break;
      case 'if':     collectTypes(s.body ?? [], state); if (s.else) collectTypes(s.else, state); break;
      case 'for': case 'while': case 'do_while': case 'include':
        collectTypes(s.body ?? [], state); break;
      case 'select': for (const c of s.cases ?? []) collectTypes(c.body ?? [], state); break;
    }
    noteNode(s);
  }
}

// In BASIC the array `Curve()` and the scalar `Curve` are different variables,
// and CDraw uses both: it fills Curve(I,X) with plotted points and then runs
// `FOR Curve = 1 TO 3` to label the palette. Sharing one slot let the loop
// destroy the curve, so nothing was ever drawn. Arrays therefore also live
// under a reserved "name()" key that a scalar write cannot reach; they are
// still stored under the plain name too, so code paths that look there
// directly keep working.
const arrKey = n => n + '()';

function readArray(env, name) {
  const k = arrKey(normVarName(name));
  const a = env[k] ?? globalVars[k];
  if (Array.isArray(a)) return a;
  const v = readVar(env, name);
  return Array.isArray(v) ? v : undefined;
}

function defineArray(env, name, arr) {
  writeVar(env, name, arr);
  const k = arrKey(normVarName(name));
  if (env !== globalVars && Object.prototype.hasOwnProperty.call(env, normVarName(name))) env[k] = arr;
  else globalVars[k] = arr;
}

function readVar(env, name) {
  const n = normVarName(name);
  if (n in env) return env[n];
  if (n in globalVars) return globalVars[n];
  if (name in env) return env[name];
  if (name in globalVars) return globalVars[name];
  return undefined;
}

function writeVar(env, name, val0) {
  const n = normVarName(name);
  const val = coerceVar(n, val0);
  if (env === globalVars) { env[n] = val; return; }
  // A parameter or an explicitly LOCAL-ised name is already an own property.
  if (Object.prototype.hasOwnProperty.call(env, n) || Object.prototype.hasOwnProperty.call(env, name)) {
    env[n] = val; return;
  }
  // Inside a LOCAL FN, a name that is not a declared global is a new *local*
  // variable. Globals are the ones DIMmed/equated in the project's .GLBL files,
  // which run before any LOCAL FN does, so "already in globalVars" is the test.
  // Without this, two functions that both use a scratch "y" would clobber each
  // other — which is exactly what mislaid Supermarket's wells off-screen.
  if (env[LOCAL_SCOPE] && !(n in globalVars)) { env[n] = val; return; }
  globalVars[n] = val;
}

async function execAssign(stmt, env) {
  const name = stmt.name;
  // A real-typed target puts an "!"/"#" into the level, so the right-hand side
  // is evaluated as floating point. Grglflx's
  //   A0! = (SQR(6.283))/NormalNbr
  // has its scientific function inside redundant parentheses, so nothing at the
  // top level marks it real; without the target's own suffix counting, the
  // divide truncated to 0, Normal() came out all zeros and every plotted series
  // was a dead flat line.
  const val = await evalExpr(stmt.value, env, /[!#]$/.test(name || '') ? true : undefined);

  // EDIT$(n) = text$ writes an edit field's contents.
  if (normVarName(name) === 'edit$' && stmt.idx?.length) {
    const fid = subIdx(await evalExpr(stmt.idx[0], env));
    const ctrl = getCtrl(fid);
    if (ctrl) { ctrl.value = String(val ?? ''); if (ctrl.el) ctrl.el.value = ctrl.value; }
    return;
  }

  // TEKEY$ = k$ rewrites the keystroke that is about to be typed.
  if (normVarName(name) === 'tekey$' && !stmt.idx && !(stmt.fields?.length)) {
    teKey = String(val ?? '');
    return;
  }

  // MID$(target$, start [, count]) = source$ — overlay part of a string in place.
  if (name === 'mid$' && stmt.idx && stmt.idx.length >= 2) {
    const target = stmt.idx[0];
    if (target?.type === 'variable') {
      const cur  = String(readVar(env, target.name) ?? '');
      const from = Math.max(1, Math.floor(Number(await evalExpr(stmt.idx[1], env)) || 1)) - 1;
      const want = stmt.idx[2] != null
        ? Math.floor(Number(await evalExpr(stmt.idx[2], env)) || 0)
        : String(val).length;
      const ins  = String(val).slice(0, Math.min(want, cur.length - from));
      writeVar(env, target.name, cur.slice(0, from) + ins + cur.slice(from + ins.length));
    }
    return;
  }
  if (stmt.fields && stmt.fields.length > 0 && stmt.idx) {
    // Struct array: gShopper.SLoc.v%(0) = x → flat array 'gshopper.sloc.v'[0] = x
    const flatName = (normVarName(name) + '.' + stmt.fields.map(normVarName).join('.')).toLowerCase();
    const idxs = (await Promise.all(stmt.idx.map(x => evalExpr(x, env)))).map(subIdx);
    const idx = idxs[0] ?? 0;
    let arr = env[flatName] ?? globalVars[flatName];
    if (!Array.isArray(arr)) { arr = []; globalVars[flatName] = arr; }
    arr[idx] = coerceVar(flatName, val);
    return;
  }
  if (stmt.idx) {
    // gShopper(i) = <record> — scatter the whole record across its field arrays.
    if (recordOf[normVarName(name)]) {
      writeRecord(normVarName(name), subIdx(await evalExpr(stmt.idx[0], env)), val);
      return;
    }
    let arr = readArray(env, name);
    const idxs = (await Promise.all(stmt.idx.map(x => evalExpr(x, env)))).map(subIdx);
    if (!Array.isArray(arr)) {
      // An array used without DIM is implicitly dimensioned to 10 per dimension.
      arr = makeArray(new Array(idxs.length).fill(10));
      defineArray(env, name, arr);
    }
    let a = arr;
    for (let d = 0; d < idxs.length - 1; d++) a = a[idxs[d]] || (a[idxs[d]] = []);
    a[idxs[idxs.length - 1]] = coerceVar(normVarName(name), val);
    return;
  }
  if (stmt.fields && stmt.fields.length > 0) {
    const flatName = [name, ...stmt.fields].map(normVarName).join('.');
    // A field of a record-typed scalar lives flat, next to its siblings.
    if (recordOf[normVarName(name)]) { globalVars[flatName] = coerceVar(flatName, val); return; }
    const target = readVar(env, name) ?? {};
    writeVar(env, name, target);
    let obj = target;
    for (let i = 0; i < stmt.fields.length - 1; i++) obj = obj[stmt.fields[i]] || (obj[stmt.fields[i]] = {});
    obj[stmt.fields[stmt.fields.length - 1]] = coerceVar(flatName, val);
    return;
  }
  // gGhostShopper = <record> — a record-typed scalar.
  if (recordOf[normVarName(name)]) { writeRecord(normVarName(name), null, val); return; }
  writeVar(env, name, val);
}

// ── dim ───────────────────────────────────────────────────────
async function execDim(stmt, env) {
  // `DIM T,L,B,R` puts four scalars next to each other; programs then pass the
  // first as a Rect. Remember the grouping so resolveRect() can find the rest.
  const scalars = stmt.args.filter(a => !(a.dims && a.dims.length));
  if (scalars.length >= 4) dimGroups[normVarName(scalars[0].name)] = scalars.map(a => normVarName(a.name));
  for (const a of stmt.args) {
    const name = a.name;
    if (a.dims && a.dims.length > 0) {
      const sizes = await Promise.all(a.dims.map(d => evalExpr(d, env)));
      defineArray(env, name, makeArray(sizes));
    } else {
      // DIM without a size is just a declaration — give it the type's zero value
      // (not null, which would print as "null") and leave existing values alone.
      if (readVar(env, name) === undefined)
        writeVar(env, name, name.endsWith('$') ? '' : 0);
    }
  }
}
function makeArray(sizes) {
  const sz = (sizes[0] || 0) + 1;
  if (sizes.length === 1) return new Array(sz).fill(0);
  return Array.from({length: sz}, () => makeArray(sizes.slice(1)));
}

// ── print ─────────────────────────────────────────────────────
// PRINT USING formatstring; numeric expression
// Supported format symbols (Standard Reference): # digit placeholder, . decimal
// point, , thousands separator, $ leading dollar sign, + always-signed,
// - sign only when negative. Digits to the right of the last # are rounded.
function formatUsing(fmt, value) {
  const f = String(fmt ?? '');
  const m = f.match(/[#,]*\.?#*/g)?.filter(s => s.length)?.[0];
  if (!m) return String(value);
  const num = Number(value) || 0;
  const dot = m.indexOf('.');
  const decimals = dot < 0 ? 0 : m.length - dot - 1;
  const intPlaces = (dot < 0 ? m : m.slice(0, dot)).replace(/[^#]/g, '').length;
  const grouped = m.slice(0, dot < 0 ? m.length : dot).includes(',');

  let body = Math.abs(num).toFixed(decimals);
  if (grouped) {
    const [ip, fp] = body.split('.');
    body = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (fp ? '.' + fp : '');
  }
  // Right-align the integer part in the width the format asked for.
  const ipLen = body.split('.')[0].replace(/,/g, '').length;
  if (ipLen < intPlaces) body = ' '.repeat(intPlaces - ipLen) + body;

  const wantsDollar = f.includes('$');
  const plusSign = f.includes('+');
  let sign = num < 0 ? '-' : (plusSign ? '+' : '');
  return (wantsDollar ? '$' : '') + sign + body;
}

// Character cell metrics used by PRINT / PRINT@ / HTAB / VTAB.
function charW() { return Math.max(1, Math.round(textSize * 0.6)); }
function lineH() { return textSize + 4; }

// PRINTing a number reserves its first character for the sign, exactly as STR$
// does — a space when it is positive or zero. Supermarket's own source calls it
// "that @%#$ leading blank" where it strips it back off. It matters visually:
// PRINT %(cart+5, …) relies on that blank to push the digits off the shopper
// and into the cart.
function printVal(v) {
  return typeof v === 'number' ? (v < 0 ? String(v) : ' ' + String(v)) : String(v ?? '');
}

// The print position and the QuickDraw pen are the same thing (see CALL MOVETO),
// so everything that prints leaves the pen where it finished.
async function execPrint(stmt, env) {
  try { return await execPrintInner(stmt, env); }
  finally { penX = textX; penY = textY; }
}
async function execPrintInner(stmt, env) {
  let parts = [];
  const seps = stmt.seps || [];
  for (let i = 0; i < stmt.items.length; i++) {
    const item = stmt.items[i];
    if (i > 0 && seps[i - 1] === ',') {
      // A comma advances to the next tab stop (DEF TAB, default 16 columns).
      const col = parts.join('').length;
      parts.push(' '.repeat(printTab - (col % printTab)));
    }
    if (item === null) { parts.push(''); continue; }
    if (item.type === 'using') {
      const fmt = await evalExpr(item.format, env);
      parts.push(formatUsing(fmt, await evalExpr(item.expr, env)));
    } else {
      parts.push(printVal(await evalExpr(item, env)));
    }
  }
  const text = parts.join('');
  const mode = stmt.mode;

  if (mode.type === '#') { console.log(text); return; }
  if (mode.type === '%') {
    // PRINT %(x,y) — pixel coordinates; leaves the text cursor after the string.
    const x = Number(await evalExpr(mode.coord.x, env)) || 0;
    const y = Number(await evalExpr(mode.coord.y, env)) || 0;
    gfxText(text, x, y);
    textX = gfxPenX; textY = y;
    if (!stmt.trailing) { textX = 0; textY += lineH(); }
    return;
  }
  if (mode.type === '@') {
    // PRINT @(col,row) — character coordinates.
    const col = Number(await evalExpr(mode.coord.x, env)) || 0;
    const row = Number(await evalExpr(mode.coord.y, env)) || 0;
    gfxText(text, col * charW(), row * lineH());
    textX = gfxPenX; textY = row * lineH();
    if (!stmt.trailing) { textX = 0; textY += lineH(); }
    return;
  }

  // Plain PRINT — draw into the output window at the text cursor, honouring
  // WIDTH (auto CR/LF) and a trailing ";"/"," (which suppresses the newline).
  let rest = text;
  do {
    let chunk = rest;
    if (printWidth > 0) {
      const room = Math.max(1, printWidth - Math.floor(textX / charW()));
      chunk = rest.slice(0, room);
      rest = rest.slice(chunk.length);
    } else {
      rest = '';
    }
    gfxText(chunk, textX, textY);
    textX = gfxPenX;
    if (rest.length) { textX = 0; textY += lineH(); }
  } while (rest.length);

  if (!stmt.trailing) { textX = 0; textY += lineH(); }
  scrollTextIfNeeded();
  console.log(text);
}

// Scroll the output window up a line when the text cursor runs off the bottom.
function scrollTextIfNeeded() {
  const wdef = windowDefs[outputWindowId ?? frontWindowId];
  if (!wdef || !ctx) return;
  const h = wdef.logH ?? 342;
  if (textY <= h) return;
  const dy = lineH();
  const img = ctx.getImageData(0, dy * CANVAS_SCALE, wdef.canvas.width, wdef.canvas.height);
  ctx.fillStyle = currentBg;
  ctx.fillRect(0, 0, wdef.logW ?? 512, h);
  ctx.putImageData(img, 0, 0);
  textY -= dy;
}

// Map a Mac font number (from TEXT font,size,…) to a CSS family. Drawing and
// FN STRINGWIDTH must agree, or text the program centres itself lands wrong.
const MAC_FONTS = {0: "'Chicago', 'Geneva', sans-serif", 2: "'New York', Georgia, serif",
                   3: "'Geneva', 'Helvetica', sans-serif", 4: "'Monaco', 'Courier New', monospace",
                   20: "'Times New Roman', Times, serif", 21: "'Helvetica', Arial, sans-serif",
                   22: "'Courier New', monospace"};
function textFontCss() {
  return `${textSize}px ${MAC_FONTS[textFont] ?? MAC_FONTS[3]}`;
}

// srcXor text, the way QuickDraw does it on a 1-bit screen: the glyph's ink is
// XORed into the destination, so printing the same string at the same spot a
// second time erases it and leaves whatever was underneath intact. Programs
// animate by re-printing the old value and then printing the new one —
// Supermarket's carts do exactly that — so this has to cancel *exactly*.
// Anti-aliased fillText never would, hence the round-trip through a 1-bit mask.
let xorTextCanvas = null;
function gfxTextXor(txt, x, y, tw) {
  const S = CANVAS_SCALE;
  const pad = 2;
  const sx = Math.floor((x - pad) * S), sy = Math.floor((y - textSize - pad) * S);
  const w  = Math.ceil((tw + pad * 2) * S), h = Math.ceil((textSize + pad * 3) * S);
  const cw = canvas.width, ch = canvas.height;
  if (w <= 0 || h <= 0 || sx >= cw || sy >= ch || sx + w <= 0 || sy + h <= 0) return;
  // Clip to the canvas — getImageData outside it comes back transparent black,
  // which would read as ink and paint a block.
  const cx0 = Math.max(0, sx), cy0 = Math.max(0, sy);
  const cx1 = Math.min(cw, sx + w), cy1 = Math.min(ch, sy + h);
  const cwid = cx1 - cx0, chei = cy1 - cy0;
  if (cwid <= 0 || chei <= 0) return;

  if (!xorTextCanvas) xorTextCanvas = document.createElement('canvas');
  const oc = xorTextCanvas;
  if (oc.width < cwid || oc.height < chei) { oc.width = Math.max(oc.width, cwid); oc.height = Math.max(oc.height, chei); }
  const octx = oc.getContext('2d', {willReadFrequently: true});
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.fillStyle = '#fff';
  octx.fillRect(0, 0, cwid, chei);
  octx.fillStyle = '#000';
  octx.font = `${textSize * S}px ${MAC_FONTS[textFont] ?? MAC_FONTS[3]}`;
  octx.fillText(txt, x * S - cx0, y * S - cy0);

  const src = octx.getImageData(0, 0, cwid, chei).data;
  const dst = ctx.getImageData(cx0, cy0, cwid, chei);
  const d = dst.data;
  const isInk = (a, i) => (a[i] + a[i+1] + a[i+2]) < 384;
  for (let i = 0; i < d.length; i += 4) {
    // Only the glyph's own ink is inverted. Rewriting the whole padded
    // rectangle instead flattened everything inside it to pure black or white,
    // and since the box is a good deal taller than a 9-point digit it overlaps
    // the neighbouring one: Supermarket redraws every cart's item count on
    // every tick, so once carts bunched up at a checkout each redraw chewed a
    // little more out of its neighbours and the numbers turned to mush.
    if (!isInk(src, i)) continue;
    const v = isInk(d, i) ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  ctx.putImageData(dst, cx0, cy0);
}

function gfxText(txt, x, y) {
  if (!ctx) return;
  ctx.font = textFontCss();
  const tw = ctx.measureText(txt).width;
  if (textTransferMode === 2) {
    gfxTextXor(txt, x, y, tw);
  } else {
    ctx.fillStyle = currentFg;
    ctx.fillText(txt, x, y);
  }
  gfxPenX = x + tw;
  gfxPenY = y;
}

// ── sys calls ─────────────────────────────────────────────────
async function execSysCall(stmt, env) {
  const cmd = stmt.cmd;
  let args = stmt.args || [];

  // `WINDOW #3, …` and `BUTTON #14, …` name the window/control by number.
  // The grammar only folds "#n" into stmt.chan when it is written tight against
  // the command word; with a space it lands in args[0] as a channel node
  // instead, which then evaluated to NaN and fell back to window 1. MacPThy
  // builds its whole help window that way, so it was being drawn over window 1
  // and the update event that `D0=DIALOG(0)` waits for never arrived — the
  // Instructions window came up blank and the program stopped dead.
  // (EDIT FIELD reads the channel node out of args[0] itself, so it is left alone.)
  if (!stmt.chan && args[0] && args[0].type === 'channel' &&
      (cmd === 'WINDOW' || cmd === 'BUTTON' || cmd === 'SCROLL')) {
    stmt = Object.assign({}, stmt, {chan: args[0].n});
    args = args.slice(1);
  }

  async function a(i)  { if (i >= args.length || !args[i]) return null; return evalExpr(args[i], env); }
  async function n(i)  { return Number(await a(i)) || 0; }
  async function s(i)  { return String(await a(i) ?? ''); }
  async function allN() { return Promise.all(args.map((x,i) => x ? n(i) : null)); }

  switch(cmd) {
    // ── graphics ────────────────────────────────────────────
    case 'CLS': case 'HOME': {
      if (!ctx) { getOrCreateWindow(1, null, 512, 342); setOutputWindow(1); }
      showCanvas();
      const wdef = windowDefs[outputWindowId ?? frontWindowId ?? 1];
      ctx.fillStyle = currentBg; ctx.fillRect(0, 0, wdef?.logW ?? 512, wdef?.logH ?? 342);
      textX = 0; textY = textSize; return;
    }

    case 'COLOR': {
      const nums = await allN();
      const valid = nums.filter(x => x !== null);
      if (valid.length === 1) currentFg = mac16(valid[0]);
      else if (valid.length === 2) { currentFg = mac16(valid[0]); currentBg = mac16(valid[1]); }
      else if (valid.length >= 3) currentFg = `rgb(${valid[0]},${valid[1]},${valid[2]})`;
      return;
    }

    case 'PEN': {
      const v = await n(0);
      if (v !== 0) { penWidth = v; penHeight = v; }
      if (args.length >= 2) { const h = await n(1); if (h !== 0) penHeight = h; }
      // PEN sets the pen, and a transfer mode it does not name goes back to
      // patCopy rather than staying as whatever was left over. CDraw depends on
      // this: `Draw_Type` clears the palette strip with `PEN ,,,11 : BOX FILL`
      // and then draws the palette and all three curves after a plain
      // `PEN ,,,,0` — which the author plainly means as "normal black pen", and
      // which is the only reading under which that code can draw anything. The
      // size and pattern do stay put; only the mode is re-defaulted, because
      // programs that want a wide pen set it once and then adjust the mode
      // alone (Grglflx's `PEN 3,3,1,8,0` … `PEN ,,,12` … `PEN ,,,8`).
      gfxPenMode = (args.length >= 4 && args[3] !== null) ? Math.round(await n(3)) : 8;
      if (args.length >= 5 && args[4] !== null) {
        // Mac pen patterns: 0=default(black), 1=ltGray, 2=gray, 3=dkGray, 4=black, 5=lightGray
        const pat = Math.round(await n(4));
        const grayMap = {0:'#000000', 1:'#bbbbbb', 2:'#888888', 3:'#555555', 4:'#000000', 5:'#999999'};
        currentFg = grayMap[pat] ?? '#000000';
      }
      if (ctx) ctx.lineWidth = penWidth;
      return;
    }

    // PLOT x,y            — plot a single point
    // PLOT x1,y1 TO x2,y2 [TO x3,y3 …] — draw a connected polyline
    case 'PLOT': {
      showCanvas();
      const pt = args[0];
      // A leading TO — "PLOT TO x,y" — continues from wherever the pen is,
      // which is the whole point of the rubber-band idiom MacPThy draws with:
      //   PLOT X,Y                        anchor the pen
      //   PLOT TO X,Y TO Xnew,Ynew        erase back to the anchor, redraw
      // Dropping the implied first leg left the erase half of every pass
      // undrawn, so dragging a line, curve or budget line smeared a fan of
      // stale segments across the graph. It also cost the panel's budget-line
      // icon its bottom stroke, drawn by a bare `PLOT TO BBX+31,BBY+13`.
      const startAtPen = stmt.keyword === 'TO';
      const pts = startAtPen ? [[penX, penY]] : [];
      if (pt && pt.type === 'polyline') {
        for (const [ex, ey] of pt.points)
          pts.push([Number(await evalExpr(ex, env)) || 0, Number(await evalExpr(ey, env)) || 0]);
      } else if (startAtPen) {
        if (pt && pt.x !== undefined) pts.push([Number(await evalExpr(pt.x, env)) || 0, Number(await evalExpr(pt.y, env)) || 0]);
        else pts.push([await n(0), await n(1)]);
      }
      if (pts.length > 1) {
        penX = pts[pts.length - 1][0]; penY = pts[pts.length - 1][1];
        ctx.lineWidth = penWidth;
        // One step per leg: QuickDraw draws a "TO … TO …" chain as successive
        // LineTo calls, which matters under an XOR pen (see paintXor).
        const legs = [];
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          legs.push(c => { c.lineWidth = penWidth; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke(); });
        }
        paintShape(pointBounds(pts), legs);
        return;
      }
      // A single point: move the pen there and mark it.
      if (pt && pt.x !== undefined) { penX = await evalExpr(pt.x, env); penY = await evalExpr(pt.y, env); }
      else if (!startAtPen) { penX = await n(0); penY = await n(1); }
      paintShape({x: penX, y: penY, w: penWidth, h: penHeight},
                 c => c.fillRect(penX, penY, penWidth, penHeight));
      return;
    }

    case 'LINE': {
      showCanvas();
      // Collect the path first: the pen mode decides whether it is drawn
      // straight onto the canvas or XORed through an offscreen mask, and the
      // latter needs the bounding box up front.
      const ops = [];
      const move = (x, y) => ops.push(['m', x, y]);
      const line = (x, y) => ops.push(['l', x, y]);
      for (const arg of args) {
        if (!arg) continue;
        if (arg.type === 'lineRel') {
          // LINE -(x,y): continue from the last graphic point to the ABSOLUTE
          // point (x,y) — same convention as "PLOT TO x,y" / "BOX TO x,y".
          const tx = Number(await evalExpr(arg.to.x, env)) || 0;
          const ty = Number(await evalExpr(arg.to.y, env)) || 0;
          move(penX, penY); penX = tx; penY = ty; line(penX, penY);
        } else if (arg.x !== undefined) {
          const tx = await evalExpr(arg.x, env), ty = await evalExpr(arg.y, env);
          move(penX, penY); penX = tx; penY = ty; line(penX, penY);
        } else if (arg.type === 'polyline') {
          // Must be tested before `arg.from`, which a polyline node also has.
          for (let pi = 0; pi < arg.points.length; pi++) {
            const px = Number(await evalExpr(arg.points[pi][0], env)) || 0;
            const py = Number(await evalExpr(arg.points[pi][1], env)) || 0;
            (pi === 0 ? move : line)(px, py);
            penX = px; penY = py;
          }
        } else if (arg.from) {
          const ev = async x => Number(typeof x === 'object' ? await evalExpr(x, env) : x) || 0;
          move(await ev(arg.from[0]), await ev(arg.from[1]));
          penX = await ev(arg.to[0]); penY = await ev(arg.to[1]);
          line(penX, penY);
        }
      }
      ctx.lineWidth = penWidth;
      // One step per leg, as in PLOT — each is a separate QuickDraw LineTo.
      const legs = [];
      for (let i = 1; i < ops.length; i++) {
        if (ops[i][0] !== 'l') continue;
        const [, ax, ay] = ops[i - 1], [, bx, by] = ops[i];
        legs.push(c => { c.lineWidth = penWidth; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke(); });
      }
      paintShape(pointBounds(ops.map(o => [o[1], o[2]])), legs);
      return;
    }

    case 'BOX': {
      showCanvas();
      let x1, y1, x2, y2;
      const a0 = args[0];
      if (a0 && a0.from) {
        const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
        x1 = await ev(a0.from[0]); y1 = await ev(a0.from[1]);
        x2 = await ev(a0.to[0]);   y2 = await ev(a0.to[1]);
      } else { [x1,y1,x2,y2] = await Promise.all([n(0),n(1),n(2),n(3)]); }
      ctx.lineWidth = penWidth;
      paintShape(pointBounds([[x1, y1], [x2, y2]]), c => {
        c.lineWidth = penWidth;
        if (stmt.keyword === 'FILL') c.fillRect(x1, y1, x2 - x1, y2 - y1);
        else c.strokeRect(x1, y1, x2 - x1, y2 - y1);
      });
      return;
    }

    // CIRCLE [FILL] h, v, radius
    // CIRCLE h, v, radius TO   startBrad, numBrads  → filled pie segment
    // CIRCLE h, v, radius PLOT startBrad, numBrads  → arc of the circumference
    // 256 brads = 360°, brad 0 is at 3 o'clock, counter-clockwise.
    case 'CIRCLE': {
      showCanvas();
      const a0 = args[0];
      let cx, cy, r;
      if (a0 && a0.x !== undefined) {
        cx = await evalExpr(a0.x, env); cy = await evalExpr(a0.y, env); r = await n(1);
      } else { cx = await n(0); cy = await n(1); r = await n(2); }

      // "CIRCLE h,v,r TO b0,bn" is swallowed by the generic "x,y TO x,y" point
      // list, arriving as [h, polyline([v,r],[b0,bn])]; the PLOT form arrives as
      // a trailer instead. Normalise both.
      let seg = stmt.trailer?.find(t => t.keyword === 'TO' || t.keyword === 'PLOT');
      const poly = args.find(a => a && a.type === 'polyline');
      if (!seg && poly && poly.points.length >= 2) {
        cx = Number(await evalExpr(args[0], env)) || 0;
        cy = Number(await evalExpr(poly.points[0][0], env)) || 0;
        r  = Number(await evalExpr(poly.points[0][1], env)) || 0;
        seg = {keyword: 'TO', args: [poly.points[1][0], poly.points[1][1]]};
      }

      ctx.lineWidth = penWidth;
      const rad = Math.abs(r);
      const bounds = pointBounds([[cx - rad, cy - rad], [cx + rad, cy + rad]]);
      if (seg) {
        const bradsToRad = b => -(Number(b) || 0) * 2 * Math.PI / 256;  // negative: canvas y grows down
        const start = bradsToRad(await evalExpr(seg.args?.[0], env));
        const span  = bradsToRad(await evalExpr(seg.args?.[1], env));
        paintShape(bounds, c => {
          c.lineWidth = penWidth; c.beginPath();
          if (seg.keyword === 'TO') c.moveTo(cx, cy);
          c.arc(cx, cy, rad, start, start + span, true);
          if (seg.keyword === 'TO') { c.closePath(); c.fill(); } else c.stroke();
        });
        return;
      }
      paintShape(bounds, c => {
        c.lineWidth = penWidth; c.beginPath();
        c.arc(cx, cy, rad, 0, Math.PI * 2);
        if (stmt.keyword === 'FILL') c.fill(); else c.stroke();
      });
      return;
    }

    case 'TEXT': {
      showCanvas();
      const a0 = args[0];
      if (a0 && a0.x !== undefined) {
        // TEXT (x,y), string — draw text at pixel coordinates
        gfxText(await s(1), await evalExpr(a0.x, env), await evalExpr(a0.y, env));
      } else {
        // TEXT font, size [, style [, mode]] — set font attributes
        if (args[0]) textFont = Math.floor(await n(0));
        if (args[1]) textSize = Math.max(1, await n(1));
        if (args[3]) textTransferMode = Math.floor(await n(3));
      }
      return;
    }

    case 'SCROLL': {
      if (stmt.keyword === 'BUTTON') {
        // SCROLL BUTTON id, value, min, max, pageSize [, refCon [, type 1=vert 2=horiz]]
        if (stmt.chan) args = [null, ...args];   // SCROLL BUTTON #13,… — keep offsets
        const id = stmt.chan ? Math.floor(Number(await evalExpr(stmt.chan, env)))
                             : Math.floor(await n(0));
        const value = Math.floor(await n(1));
        const min = Math.floor(await n(2));
        const max = Math.floor(await n(3));
        const pageSize = args[4] ? Math.floor(await n(4)) : 10;
        const scrollType = args[6] ? Math.floor(await n(6)) : 1;
        const sk = ctrlKey(id);
        if (controlStore[sk]) Object.assign(controlStore[sk], {value, min, max, pageSize});
        else controlStore[sk] = {el: null, type: scrollType === 2 ? 'hscroll' : 'vscroll', value, min, max, pageSize};
        return;
      }
      if (!ctx) return;
      const dh = await n(0), dv = await n(1);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      ctx.clearRect(0, 0, canvas.width / CANVAS_SCALE, canvas.height / CANVAS_SCALE);
      ctx.putImageData(img, dh * CANVAS_SCALE, dv * CANVAS_SCALE);
      return;
    }

    case 'GET': {
      // GET (x1,y1)-(x2,y2), ArrayName(index) — capture screen region to sprite buffer
      if (!ctx) return;
      const a0 = args[0], a1 = args[1];
      if (!a0 || !a1) return;
      const ev = x => (x && typeof x === 'object') ? evalExpr(x, env) : Promise.resolve(Number(x));
      const x1 = Math.floor(Number(await ev(a0.from?.[0]))), y1 = Math.floor(Number(await ev(a0.from?.[1])));
      const x2 = Math.floor(Number(await ev(a0.to?.[0]))),  y2 = Math.floor(Number(await ev(a0.to?.[1])));
      const sx = Math.min(x1, x2), sy = Math.min(y1, y2);
      const w = Math.abs(x2 - x1) + 1, h = Math.abs(y2 - y1) + 1;
      if (a1.type === 'callable' || a1.type === 'variable') {
        const idx = a1.args?.[0] ? Math.floor(Number(await evalExpr(a1.args[0], env))) : 0;
        spriteBuffer[`${a1.name}_${idx}`] = ctx.getImageData(sx * CANVAS_SCALE, sy * CANVAS_SCALE, w * CANVAS_SCALE, h * CANVAS_SCALE);
      }
      return;
    }

    case 'PUT': {
      // PUT (x,y), ArrayName(index) [,mode]  — draw sprite from buffer at position
      // PUT (x1,y1)-(x2,y2), ArrayName(index) [,mode]  — draw into rect
      if (!ctx) return;
      const a0 = args[0], a1 = args[1];
      if (!a0 || !a1) return;
      let dx, dy;
      if (a0.x !== undefined) {
        dx = Math.floor(Number(await evalExpr(a0.x, env)));
        dy = Math.floor(Number(await evalExpr(a0.y, env)));
      } else if (a0.from) {
        dx = Math.floor(Number(await evalExpr(a0.from[0], env)));
        dy = Math.floor(Number(await evalExpr(a0.from[1], env)));
      } else return;
      // PUT (x,y), arr(i) [, mode] — XOR is the documented default mode.
      // The mode word lands in `trailer` (it is picked up as a sysKeyword) or,
      // for OR/AND/PSET/PRESET, may arrive as a trailing named argument.
      const modeWord = stmt.trailer?.map(t => t.keyword).find(Boolean)
        ?? (args[2]?.type === 'variable' ? args[2].name.toUpperCase() : null);
      const isXor = modeWord === null || modeWord === 'XOR';
      if (a1.type === 'callable' || a1.type === 'variable') {
        const idx = a1.args?.[0] ? Math.floor(Number(await evalExpr(a1.args[0], env))) : 0;
        const imgData = spriteBuffer[`${a1.name}_${idx}`];
        if (imgData) {
          if (isXor) {
            // 1-bit XOR, as on the Mac: ink XOR ink = no ink, so PUTting a
            // sprite over itself erases it. Doing this on raw RGBA would be
            // backwards (white 255 ^ 255 = 0 = black), so compare ink instead.
            const sdx = dx * CANVAS_SCALE, sdy = dy * CANVAS_SCALE;
            const w = imgData.width, h = imgData.height;
            const bg = ctx.getImageData(sdx, sdy, w, h);
            const sp = imgData.data, bg_ = bg.data;
            const isInk = (a, i) => (a[i] + a[i+1] + a[i+2]) < 384;
            for (let i = 0; i < sp.length; i += 4) {
              const v = (isInk(sp, i) !== isInk(bg_, i)) ? 0 : 255;
              bg_[i] = bg_[i+1] = bg_[i+2] = v;
              bg_[i+3] = 255;
            }
            ctx.putImageData(bg, sdx, sdy);
          } else {
            ctx.putImageData(imgData, dx * CANVAS_SCALE, dy * CANVAS_SCALE);
          }
        }
      }
      return;
    }

    case 'LOCAL': {
      // LOCAL var1, var2, ... — shadow parent-scope variables in this env
      for (const arg of args) {
        if (!arg) continue;
        const name = arg.name;
        if (name && !Object.prototype.hasOwnProperty.call(env, name))
          env[name] = name.endsWith('$') ? '' : 0;
      }
      return;
    }
    case 'CLEAR LOCAL': {
      // CLEAR LOCAL — reset local variables to default in this env
      for (const key of Object.keys(env)) {
        env[key] = String(key).endsWith('$') ? '' : 0;
      }
      return;
    }
    case 'CLEAR': return;  // CLEAR — no-op in browser context

    case 'WINDOW': {
      if (stmt.keyword === 'OFF' || stmt.keyword === 'ON') { return; }  // show/hide windowing system
      if (stmt.keyword === 'CLOSE') {
        let wid;
        if (stmt.chan) {
          wid = Math.floor(Number(await evalExpr(stmt.chan, env)));
        } else if (args[0]?.type === 'channel') {
          wid = Math.floor(Number(await evalExpr(args[0].n, env)));
        } else {
          wid = args[0] ? Math.floor(Number(await evalExpr(args[0], env))) : outputWindowId;
        }
        closeWindow(wid);
        return;
      }
      if (stmt.keyword === 'OUTPUT') {
        const wid = args[0] ? Math.floor(Number(await evalExpr(args[0], env))) : 1;
        setOutputWindow(wid);
        return;
      }
      const a0 = args[0];
      if (stmt.chan) {
        // WINDOW #N [, title [, (x1,y1)-(x2,y2) [, type]]]
        const wid = Math.floor(Number(await evalExpr(stmt.chan, env)));
        if (!a0) {
          // WINDOW #N — select an existing window (see the note on WINDOW ref).
          if (windowDefs[wid]) bringToFront(wid); else setOutputWindow(wid);
        } else {
          const title = a0 ? String(await evalExpr(a0, env)) : null;
          let w = 512, h = 342;
          if (args[1] && args[1].from) {
            const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
            const x1 = await ev(args[1].from[0]), y1 = await ev(args[1].from[1]);
            const x2 = await ev(args[1].to[0]),   y2 = await ev(args[1].to[1]);
            w = x2 - x1; h = y2 - y1;
          }
          getOrCreateWindow(wid, title, w, h);
          setOutputWindow(wid);
          if (title) document.title = title;
        }
      } else if (a0 && a0.from) {
        // WINDOW (x1,y1)-(x2,y2)
        const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
        const x1 = await ev(a0.from[0]), y1 = await ev(a0.from[1]);
        const x2 = await ev(a0.to[0]),   y2 = await ev(a0.to[1]);
        getOrCreateWindow(outputWindowId || 1, null, x2 - x1, y2 - y1);
        setOutputWindow(outputWindowId || 1);
      } else if (a0 && !a0.from) {
        // WINDOW id [, title [, (x1,y1)-(x2,y2) [, type]]]
        const wid = Math.floor(Number(await evalExpr(a0, env))) || 1;
        if (args.length === 1 && windowDefs[wid]) {
          // WINDOW ref — select the window: bring it forward and make it the
          // active one, but leave the *output* window alone. The two are
          // separate on the Mac (WINDOW(_activeWnd) vs WINDOW(_outputWnd)), and
          // only WINDOW OUTPUT moves drawing. PG:PRO switches windows on a click
          // in an inactive one with a bare `WINDOW gWhichWindow`, so redirecting
          // output here sent Supermarket's shopper carts into whichever help
          // window you had last clicked.
          bringToFront(wid);
        } else {
          const title = args[1] ? String(await evalExpr(args[1], env)) : null;
          let w = 512, h = 342;
          if (args[2] && args[2].from) {
            const ev = async x => typeof x === 'object' ? evalExpr(x, env) : x;
            const x1 = await ev(args[2].from[0]), y1 = await ev(args[2].from[1]);
            const x2 = await ev(args[2].to[0]),   y2 = await ev(args[2].to[1]);
            w = x2 - x1; h = y2 - y1;
          }
          getOrCreateWindow(wid, title, w, h);
          setOutputWindow(wid);
          if (title) document.title = title;
        }
      }
      showCanvas(); return;
    }

    // ── control ──────────────────────────────────────────────
    case 'GOTO':  throw new GotoSignal(labelOf(args[0]));
    // GOSUB is a call, not a jump: run the subroutine in place and carry on.
    // Raising a signal here would unwind out of any enclosing block (a LONG IF,
    // a FOR body, …) and silently abandon the rest of it. Fall back to the
    // signal only when the label is not a top-level one, so an enclosing block
    // can resolve a label defined inside a function body.
    case 'GOSUB': {
      const lbl = labelOf(args[0]);
      if (await callEventHandler(lbl, env, true)) return;
      throw new GosubSignal(lbl);
    }
    case 'RETURN': throw new ReturnSignal();
    case 'STOP':   throw new Error('STOP');

    // ── data ─────────────────────────────────────────────────
    case 'READ': {
      for (const arg of args) {
        if (!arg) continue;
        const val = dataStore[dataPtr++] ?? null;
        if (arg.type === 'variable') {
          writeVar(env, arg.name, val);
        } else if ((arg.type === 'callable' || arg.type === 'subscript') && arg.name) {
          // Array subscript: READ C$(M,C)
          const arr = env[arg.name] ?? globalVars[arg.name];
          if (Array.isArray(arr) && arg.args?.length > 0) {
            const idxs = await Promise.all(arg.args.map(x => x ? evalExpr(x, env) : 0));
            let a = arr;
            for (let d = 0; d < idxs.length - 1; d++) a = a[idxs[d]] || (a[idxs[d]] = []);
            a[idxs[idxs.length - 1]] = val;
          }
        }
      }
      return;
    }
    // RESTORE [expression] — reset the DATA pointer to the first item, or to the
    // item numbered by the expression (1-based, per the reference).
    case 'RESTORE': {
      if (args.length > 0 && args[0]) dataPtr = Math.max(0, Math.floor(await n(0)) - 1);
      else dataPtr = 0;
      return;
    }

    // ── menu ─────────────────────────────────────────────────
    case 'APPLE': {
      // APPLE MENU "item" — add item to Apple menu (ID 255)
      const title = await s(0);
      if (!menuDefs[255]) menuDefs[255] = makeMenu('🍎');
      const idx = Math.max(0, ...Object.keys(menuDefs[255].items).map(Number)) + 1;
      menuDefs[255].items[idx] = {title, enabled: true};
      renderMenuBar(); return;
    }

    // ── dialog / input ────────────────────────────────────────
    case 'DIALOG': {
      if (stmt.keyword === 'ON') {
        // DIALOG ON only re-enables the trap. It used to also zero a variable
        // literally named "D0", on the theory that `WHILE D0<>1` loops want to
        // start fresh — but that is the *program's* variable, and clearing it
        // throws away an event the trap has already delivered. MacPThy's budget
        // line tool runs `MENU ON:DIALOG ON` once per pass of its outer loop,
        // so a click on another tool set D0=1, and the very next statement put
        // it back to 0: the loop never ended and no other tool could be chosen.
        dialogOn = true;
        // Yield to the browser and dispatch anything already queued, like
        // EVENT ON. This sits inside event loops, so it uses the unclamped
        // macrotask rather than setTimeout.
        await macrotask();
        await fireEventHandlers();
        return;
      }
      if (stmt.keyword === 'OFF') { dialogOn = false; return; }
      const nn = await n(0);
      if (nn === 0) {
        const evt = await waitForEvent(0);
        if (debugMode) console.log(`▶ DIALOG 0 got event: ${evt?.type ?? 'null'}`);
        if (evt && evt.type === 'menu' && onMenuHandler) {
          lastMenu = evt.menu; lastItem = evt.item;
          await callEventHandler(onMenuHandler);
        } else if (evt && evt.type === 'mouse' && onMouseHandler) {
          await callEventHandler(onMouseHandler);
        } else if (evt && evt.type === 'timer' && onTimerHandler) {
          await callEventHandler(onTimerHandler);
        } else if (evt && evt.type === 'stop' && onStopHandler) {
          await callEventHandler(onStopHandler);
        } else if (evt && evt.type !== 'stop' && onDialogHandler) {
          await callEventHandler(onDialogHandler);
        }
      } else if (args.length >= 2) {
        const msg = await s(1);
        await alertUser('', msg);
      }
      return;
    }

    case 'INPUT': {
      let prompt = '';
      let varIdx = args.length - 1;
      if (args.length >= 2 && args[0] && args[0].type === 'literal') {
        prompt = args[0].value; varIdx = 1;
      }
      const txt = await promptUser('Input', prompt) || '';
      const target = args[varIdx];
      if (target && target.type === 'variable') {
        // String variables keep the raw text; numeric ones are converted.
        const v = target.name.endsWith('$') ? txt : (parseFloat(txt) || 0);
        writeVar(env, target.name, v);
      }
      return;
    }

    case 'BEEP': {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        osc.connect(ac.destination); osc.frequency.value = 880;
        osc.start(); osc.stop(ac.currentTime + 0.08);
      } catch(e) {}
      return;
    }

    // DELAY expression — the expression is in milliseconds (Standard Reference).
    case 'DELAY': { const ms = await n(0); if (ms > 0) await new Promise(r => setTimeout(r, ms)); return; }

    case 'SWAP': {
      if (args.length >= 2 && args[0].type === 'variable' && args[1].type === 'variable') {
        const a_ = args[0].name, b_ = args[1].name;
        const tmp = readVar(env, a_);
        writeVar(env, a_, readVar(env, b_));
        writeVar(env, b_, tmp);
      }
      return;
    }
    case 'INC': case 'DEC': {
      const delta = cmd === 'INC' ? 1 : -1;
      const a0 = args[0];
      if (!a0) return;
      if (a0.type === 'variable') {
        writeVar(env, a0.name, (Number(readVar(env, a0.name))||0) + delta);
      } else if (a0.type === 'chainAccess' && a0.args !== null) {
        // INC(gShopper.STargetLine%(i)) — flat array increment
        const flatName = (normVarName(a0.name) + '.' + a0.fields.map(normVarName).join('.')).toLowerCase();
        const idx = Math.floor(Number(await evalExpr(a0.args?.[0], env) ?? 0));
        let arr = env[flatName] ?? globalVars[flatName];
        if (!Array.isArray(arr)) { arr = []; globalVars[flatName] = arr; }
        arr[idx] = (Number(arr[idx])||0) + delta;
      }
      return;
    }

    case 'BREAK':
      // On Mac, BREAK ON/OFF enabled/disabled Command+Period interrupting the program. Not implemented.
      return;

    case 'MOUSE':
      if (stmt.keyword === 'ON')  { mouseOn = true;  return; }
      if (stmt.keyword === 'OFF') { mouseOn = false; return; }
      console.log(`unsupported: MOUSE ${stmt.keyword ?? ''}`); return;

    case 'TIMER': {
      if (stmt.keyword === 'ON') {
        timerOn = true;
        return;
      }
      if (stmt.keyword === 'OFF') {
        timerOn = false;
        return;
      }
      // TIMER n — set interval in ticks (1 tick ≈ 1/60 s)
      timerInterval = Math.round((await n(0)) * 1000 / 60);
      return;
    }

    case 'EVENT':
      // EVENT ON/OFF — global event enable. EVENT ON yields to the browser and
      // dispatches any pending events to their registered handlers.
      if (stmt.keyword === 'ON') {
        dialogOn = true;
        await new Promise(r => setTimeout(r, 0));
        await fireEventHandlers();
        // Fire null event when queue is empty (simulates Mac null event)
        if (onEventHandler) await callEventHandler(onEventHandler);
        return;
      }
      if (stmt.keyword === 'OFF') { dialogOn = false; return; }
      console.log(`unsupported: EVENT ${stmt.keyword ?? ''}`); return;

    case 'MENU':
      if (stmt.keyword === 'ON')  { renderMenuBar(); return; }
      if (stmt.keyword === 'OFF') { return; }
      // fall through to MENU menuId, itemId, state [, title] handling below
      {
        const a0 = args[0];
        let menuId, itemId, enabled, title;
        if (a0 && a0.x !== undefined) {
          // (menuId, state) parsed as exprPoint — 2-arg form: enable/disable whole menu
          menuId = Math.floor(Number(await evalExpr(a0.x, env))) || 0;
          const st = Math.floor(Number(await evalExpr(a0.y, env)));
          if (menuId > 0 && menuDefs[menuId]) {
            menuDefs[menuId].enabled = st !== 0;
            renderMenuBar();
          }
          return;
        }
        menuId  = Number(await a(0)) || 0;
        itemId  = Number(await a(1)) || 0;
        enabled = Number(await a(2));
        title   = args[3] ? String(await a(3)) : null;
        if (menuId === 0) return;
        // MENU menuId,-2,1 — insert sub-menu from MENU resource
        if (itemId === -2) {
          const menus = macResources['MENU'] ?? [];
          const menuRes = menus.find(m => m.id === menuId);
          if (menuRes) {
            const {title: mTitle, items} = parseMENU(menuRes.data);
            menuDefs[menuId] = makeMenu(mTitle);
            items.forEach((it, idx) => {
              menuDefs[menuId].items[idx + 1] = {title: it.name, enabled: it.enabled, checked: false};
            });
            renderMenuBar();
          }
          return;
        }
        if (title !== null) {
          // Pass the state through as a number: setMenu reads 0 as disabled and
          // 2 as checked, so coercing to a boolean lost every `_checked` that
          // was set at the same time as a new item title.
          setMenu(menuId, itemId, enabled, title);
        } else {
          if (menuDefs[menuId]) {
            if (itemId === 0) { menuDefs[menuId].enabled = enabled !== 0; menuDefs[menuId].checked = enabled === 2; }
            else if (menuDefs[menuId].items[itemId]) { menuDefs[menuId].items[itemId].enabled = enabled !== 0; menuDefs[menuId].items[itemId].checked = enabled === 2; }
            renderMenuBar();
          }
        }
        return;
      }

    case 'FLUSHEVENTS': {
      eventQueue.length = 0;
      return;
    }

    case 'BUTTON': {
      // BUTTON #14,… names the control by channel; otherwise it is args[0].
      const id = stmt.chan ? Math.floor(Number(await evalExpr(stmt.chan, env)))
                           : Math.floor(await n(0));
      if (stmt.chan) args = [null, ...args];   // keep the positional offsets

      if (stmt.keyword === 'CLOSE') { destroyCtrl(id); return; }

      if (args.length >= 3) {
        // BUTTON id, condition, title$, rect, type  OR
        // BUTTON id, condition, (rect), title$, type  (when literal rect in pos 2)
        //
        // The title may be omitted altogether: Grglflx builds every unlabelled
        // radio button as `BUTTON 21,1,,(169,6)-(186,22),3` and draws the
        // "UniCycle" caption beside it with TEXTBOX. Keying the create path off
        // a non-null args[2] skipped all of those, so the setup dialog came up
        // with no radio buttons at all — only the captions, which do nothing.
        let title = '', rectArg = null, hasTitle = false;
        if (args[2]?.from) {
          rectArg = args[2];
          if (args[3]) { hasTitle = true; title = String(await evalExpr(args[3], env) ?? ''); }
        } else {
          if (args[2] != null) { hasTitle = true; title = String(await evalExpr(args[2], env) ?? ''); }
          rectArg = args[3] ?? null;
        }
        const active = Math.floor(await n(1));
        const type = args[4] ? Math.floor(await n(4)) : 1;  // 1=push, 2=checkbox, 3=radio
        const rect = rectArg ? await resolveCtrlRect(rectArg, env) : null;

        if (!rect) {
          // No rect — update existing button state and text (BUTTON id, state, title$)
          const ctrl = getCtrl(id);
          if (ctrl) {
            ctrl.value = active;
            if (hasTitle) { ctrl.title = title; setBtnLabel(ctrl.el, title); }
            if (ctrl.el) {
              ctrl.el.disabled = (active === 0);
              if (active === 2) ctrl.el.classList.add('selected');
              else ctrl.el.classList.remove('selected');
            }
          }
          return;
        }

        createButtonCtrl(id, {title, type, state: active, rect});
        return;
      }

      // BUTTON id [, state] — state change (0=disable, 1=normal, 2=selected/invert)
      const state = args[1] ? Math.floor(await n(1)) : 1;
      const ctrl = getCtrl(id);
      if (ctrl) {
        ctrl.value = state;
        if (ctrl.el) {
          ctrl.el.disabled = (state === 0);
          if (state === 2) ctrl.el.classList.add('selected');
          else ctrl.el.classList.remove('selected');
        }
      }
      return;
    }

    case 'GLOBALS': {
      // GLOBALS GOSUB label / GLOBALS GOTO label — call subroutine in global context
      if (stmt.keyword === 'GOSUB' && args[0]) { if (debugMode) console.log(`[GLOBALS GOSUB] → ${labelOf(args[0])}`); throw new GosubSignal(labelOf(args[0])); }
      if (stmt.keyword === 'GOTO'  && args[0]) throw new GotoSignal(labelOf(args[0]));
      // GLOBALS "filename" — execute the GLBL file's DIM/equate statements
      if (args[0]?.type === 'literal' && typeof args[0].value === 'string') {
        const glblName = args[0].value;
        if (executedGlobals.has(glblName)) { /* already handled — skip silently */ }
        else if (!files[glblName]) {
          executedGlobals.add(glblName); // mark so we don't warn again on every event pass
          console.warn(`GLOBALS "${glblName}": file not loaded — upload it to define its constants`);
        } else {
          executedGlobals.add(glblName);
          try {
            const glblStmts = flattenIncludes(parser.parse(files[glblName], {parseFile: () => []}));
            // .GLBL files carry the DIM RECORD declarations, so their variable
            // types have to be registered before anything assigns to them.
            collectTypes(glblStmts);
            await execBlock(glblStmts, globalVars);
            console.log(`GLOBALS "${glblName}" done`);
          } catch(e) {
            console.warn(`GLOBALS "${glblName}" exec error: ${e.message ?? e}`, e);
          }
        }
      }
      return;
    }

    // WIDTH [LPRINT] [=] byte expression — characters per line before an
    // automatic CR/LF; 0 disables wrapping. It is NOT the graphics pen width.
    case 'WIDTH': {
      printWidth = Math.max(0, Math.floor(await n(0)));
      return;
    }

    case 'WAIT': {
      const ticks = await n(0);
      if (ticks > 0) await new Promise(r => setTimeout(r, ticks * 1000 / 60));
      return;
    }

    case 'TRACE':   { debugMode = true;  return; }
    case 'NOTRACE': { debugMode = false; return; }

    case 'PT': {
      showCanvas();
      const a0 = args[0];
      let px, py;
      if (a0?.x !== undefined) { px = await evalExpr(a0.x, env); py = await evalExpr(a0.y, env); }
      else                      { px = await n(0); py = await n(1); }
      ctx.fillStyle = currentFg;
      ctx.fillRect(Math.floor(px), Math.floor(py), 1, 1);
      return;
    }

    // SEGMENT / SEGMENT n — 68k code-segmentation directives, no runtime effect.
    // SEGMENT RETURN returns from the current segment, like RETURN.
    // (Pie and arc segments of a circle are drawn with CIRCLE … TO / … PLOT.)
    case 'SEGMENT': {
      if (stmt.keyword === 'RETURN') throw new ReturnSignal();
      return;
    }

    // VTAB row / HTAB column — move the text cursor (1-based, like LOCATE).
    case 'VTAB': { textY = Math.max(1, Math.floor(await n(0))) * lineH(); return; }
    case 'HTAB': { textX = Math.max(0, Math.floor(await n(0)) - 1) * charW(); return; }
    // LOCATE column, row [, cursor] — set the text cursor position.
    case 'LOCATE': {
      textX = Math.max(0, Math.floor(await n(0)) - 1) * charW();
      textY = Math.max(1, Math.floor(await n(1))) * lineH();
      return;
    }

    case 'INVERSE': { const tmp = currentFg; currentFg = currentBg; currentBg = tmp; return; }
    case 'NORMAL':  { currentFg = '#000000'; currentBg = '#ffffff'; return; }

    case 'KILL': {
      // KILL PICTURE handle — discard a picture buffer
      // KILL "filename" — delete file (no-op in browser)
      if (stmt.keyword === 'PICTURE' && args[0]) {
        const handle = String(await evalExpr(args[0], env));
        delete spriteBuffer[handle];
      }
      return;
    }

    case 'PICTURE': {
      // PICTURE (x,y), handle — draw a PICT resource at position
      if (!ctx || !args[0] || !args[1]) return;
      const px = Math.floor(Number(await evalExpr(args[0].x ?? args[0].from?.[0], env)));
      const py = Math.floor(Number(await evalExpr(args[0].y ?? args[0].from?.[1], env)));
      const handle = Math.floor(Number(await evalExpr(args[1], env)));
      const pict = pictHandleMap[handle];
      if (pict) {
        // Real bitmap when we could decode it; otherwise a placeholder block.
        if (!drawPictBitmap(pict, px, py)) {
          ctx.fillStyle = pict.color;
          ctx.fillRect(px, py, pict.w, pict.h);
        }
      }
      return;
    }

    case 'BLOCKMOVE': {
      // BLOCKMOVE src, dst, len — copy emulated memory into a variable.
      // The destination is written either as @v or as VARPTR(v); the latter is
      // what all four programs actually use, and it used to fall through as a
      // no-op, leaving ScrnT/ScrnL/ScrnB/ScrnR at zero.
      if (args.length < 2) return;
      let dst = args[1];
      if (dst && dst.type === 'callable' && normVarName(dst.name) === 'varptr' && dst.args?.[0])
        dst = {type: 'unary', operator: '@', expression: dst.args[0]};
      if (dst && dst.type === 'unary' && dst.operator === '@' && dst.expression?.type === 'variable') {
        const src = Math.floor(Number(await evalExpr(args[0], env)));
        const len = args[2] ? Math.floor(Number(await evalExpr(args[2], env))) : 8;
        // A rect written into four consecutive DIMmed scalars (DIM T,L,B,R) is
        // the shape resolveRect already understands; write it back the same way.
        if (len === 8) {
          const grp = dimGroups[normVarName(dst.expression.name)];
          if (grp && grp.length >= 4) {
            const vals = [fakeReadU16(src), fakeReadU16(src+2), fakeReadU16(src+4), fakeReadU16(src+6)];
            for (let i = 0; i < 4; i++) writeVar(env, grp[i], vals[i]);
            return;
          }
        }
        if (len === 8 || len === 4) {
          // Read as rect (top, left, bottom, right) or point (v, h)
          const top  = fakeReadU16(src);
          const left = fakeReadU16(src + 2);
          const bot  = len >= 8 ? fakeReadU16(src + 4) : 0;
          const rgt  = len >= 8 ? fakeReadU16(src + 6) : 0;
          const varName = dst.expression.name;
          const obj = len >= 8 ? {top, left, bottom: bot, right: rgt, v: top, h: left}
                                : {v: top, h: left};
          writeVar(env, varName, obj);
          // Also set individual fields if they exist in globalVars as a struct
          if (globalVars[varName] && typeof globalVars[varName] === 'object')
            Object.assign(globalVars[varName], obj);
        }
      }
      return;
    }

    case 'RESOURCES': {
      // If macResources already has MENU data, nothing to do
      if (macResources['MENU']?.length) { initMenuBarFromResources(); return; }
      // Try to auto-fetch the .rsrc sidecar from the server
      const rsrcFilename = stmt.args?.[0];
      const rsrcName = (typeof rsrcFilename === 'string' ? rsrcFilename
        : rsrcFilename?.type === 'literal' && typeof rsrcFilename.value === 'string' ? rsrcFilename.value : null);
      if (rsrcName && programDir) {
        const url = `progs/extracted/${programDir}/${rsrcName}.rsrc`;
        try {
          const resp = await fetch(url);
          if (resp.ok) {
            const buf = await resp.arrayBuffer();
            parseRsrcFile(buf);
          }
        } catch(e) { /* server not running or file absent — silently skip */ }
      }
      initMenuBarFromResources();
      return;
    }

    // No-op stubs — compiler directives or Mac-only features not available in a browser
    case 'COORDINATE':
    case 'COMPILE': case 'DEFSTR':
    case 'LIBRARY': case 'TOOLBOX': case 'INLINE': case 'CHAIN':
    case 'TALK':
    case 'MINWINDOW': case 'MAXWINDOW': case 'SETZOOM':
    case 'SPEED': case 'LPRINT': case 'LLIST':
    case 'HPLOT': case 'HCOLOR': case 'HGRAPH': case 'SCRN':
    case 'FLASH': case 'POKE': case 'RESUME':
    case 'ROUTE': case 'RATIO': case 'SETSELECT': case 'PUSH':
    case 'RANDOM':
      return;

    case 'EDIT': {
      if (stmt.keyword !== 'FIELD') return;

      // EDIT FIELD CLOSE id (via trailer)
      const closeTrailer = stmt.trailer?.find(t => t.keyword === 'CLOSE');
      if (closeTrailer) {
        const cid = Math.floor(Number(await evalExpr(closeTrailer.args[0], env)));
        destroyCtrl(cid);
        if (currentEditField === cid) currentEditField = null;
        return;
      }

      // Field ID: channel (#id) or expression
      const a0 = args[0];
      if (!a0) return;
      const fieldId = a0.type === 'channel'
        ? Math.floor(Number(await evalExpr(a0.n, env)))
        : Math.floor(await n(0));

      if (args.length <= 1 || args[1] === null) {
        // Focus: EDIT FIELD id
        currentEditField = fieldId;
        getCtrl(fieldId)?.el?.focus();
        return;
      }

      // Create/update: EDIT FIELD id, text$, rect, type, justify
      const text = args[1] ? String(await evalExpr(args[1], env) ?? '') : '';
      const rect = args[2] ? await resolveCtrlRect(args[2], env) : null;

      if (rect) destroyCtrl(fieldId);

      const wdef = ctrlWdef();
      if (!wdef) return;

      let ctrl = getCtrl(fieldId);
      if (!ctrl?.el) {
        const el = document.createElement('input');
        el.type = 'text';
        el.className = 'mac-ctrl mac-editfield';
        el.value = text;
        el.addEventListener('focus', () => {
          currentEditField = fieldId;
          lastDialogId = fieldId;
          pushEvent('editfield', {id: fieldId, code: 2});
        });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 6}); return; }
          if (e.key === 'Tab')   { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 7}); return; }
          // ON EDIT sees the key before the field does, so hold the keystroke
          // back and let the handler decide (it may blank TEKEY$ to reject it).
          if (!onEditHandler || e.ctrlKey || e.metaKey || e.altKey) return;
          let ch = null;
          if (e.key === 'Backspace') ch = '\b';
          else if (e.key.length === 1) ch = e.key;
          if (ch === null) return;
          e.preventDefault();
          teKey = ch;
          pendingEditKey = {fieldId, key: ctrlKey(fieldId), el};
          currentEditField = fieldId;
          pushEvent('edit', {id: fieldId});
        });
        wdef.container.appendChild(el);
        ctrl = controlStore[ctrlKey(fieldId)] = {el, type: 'editfield', value: text};
        currentEditField = fieldId;
      } else {
        ctrl.el.value = text;
        ctrl.value = text;
      }
      if (rect) placeCtrl(ctrl.el, rect[0], rect[1], rect[2], rect[3]);
      return;
    }

    case 'CURSOR': {
      // 0 normal, 1 text (I-beam), 2 selection cross, 3 "excell" cross, 4 watch
      const cursorMap = {0: 'default', 1: 'text', 2: 'crosshair', 3: 'cell', 4: 'wait', 5: 'wait'};
      const val = args.length > 0 ? await n(0) : 0;
      document.body.style.cursor = cursorMap[val] ?? 'default';
      return;
    }

    default: console.log(`unsupported syscall: ${cmd}`); return;
  }
}

// ── control flow ──────────────────────────────────────────────
async function execIf(stmt, env) {
  const cond = await evalExpr(stmt.condition, env);
  if (isTruthy(cond)) return execBlock(stmt.body, env);
  if (stmt.else)      return execBlock(stmt.else, env);
}

async function execFor(stmt, env) {
  const varName = stmt.variable;
  let val = await evalExpr(stmt.start, env);
  const end  = await evalExpr(stmt.end, env);
  // A zero or non-numeric STEP would spin forever; fall back to 1.
  const rawStep = stmt.step ? Number(await evalExpr(stmt.step, env)) : 1;
  const step = Number.isFinite(rawStep) && rawStep !== 0 ? rawStep : 1;
  while ((step > 0 && val <= end) || (step < 0 && val >= end)) {
    await maybeYield();
    // Must go through writeVar so the loop variable is stored under the same
    // normalised name readVar() looks up (FOR I% = … must be visible as I%).
    writeVar(env, varName, val);
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
    val += step;
  }
}

async function execWhile(stmt, env) {
  let iters = 0;
  while (isTruthy(await evalExpr(stmt.condition, env))) {
    iters++;
    // Busy-wait delay loops (WHILE FN TICKCOUNT < …) legitimately spin a long
    // time, so only report this once and only when tracing.
    if (debugMode && iters === 100000) {
      const condStr = JSON.stringify(stmt.condition).slice(0, 120);
      console.warn(`[while] 100000 iterations, cond=${condStr}`);
    }
    await maybeYield();
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  }
}

let _doLoopCount = 0;
async function execDoWhile(stmt, env) {
  do {
    _doLoopCount++;
    if (debugMode && (_doLoopCount <= 3 || _doLoopCount % 100 === 0)) console.log(`[DO loop] iteration ${_doLoopCount}, qLen=${eventQueue.length}, onDialog=${onDialogHandler}`);
    await maybeYield();
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  } while (!isTruthy(await evalExpr(stmt.condition, env)));
}

async function execSelect(stmt, env) {
  const val = await evalExpr(stmt.expr, env);
  for (const c of stmt.cases) {
    if (c.values === 'else') return execBlock(c.body, env);
    for (const cv of c.values) {
      let match = false;
      if (cv.type === 'range') {
        const from = await evalExpr(cv.from, env), to = await evalExpr(cv.to, env);
        match = Number(val) >= Number(from) && Number(val) <= Number(to);
      } else if (cv.type === 'relational') {
        match = compareOp(cv.op, val, await evalExpr(cv.expr, env));
      } else {
        const cval = await evalExpr(cv, env);
        match = val === cval || String(val).toLowerCase() === String(cval).toLowerCase();
      }
      if (match) return execBlock(c.body, env);
    }
  }
}

async function execOn(stmt, env) {
  const val = Math.floor(Number(await evalExpr(stmt.expr, env))) - 1;
  if (val < 0 || val >= stmt.targets.length) return;
  const tgt = stmt.targets[val];
  // Targets are label names stored as literal/variable/lineRef nodes.
  const lbl = labelOf(tgt);
  if (stmt.cmd === 'GOTO') throw new GotoSignal(lbl);
  if (stmt.cmd === 'GOSUB') {
    // Like a plain GOSUB: run in place so the enclosing block continues.
    if (await callEventHandler(lbl, env, true)) return;
    throw new GosubSignal(lbl);
  }
}

// `blankIsItem` is for APPENDMENU, where a blank string is a real (empty)
// item — CDraw builds its "f(x)=" menu with four APPENDMENU(h," ") calls and
// then fills each in with SETITEM. Dropping the blanks left that menu empty and
// there was no way to pick a function to plot.
function parseMenuItems(str, blankIsItem = false) {
  const items = [];
  const parts = str.split(';');
  for (const raw of parts) {
    let text = raw.trim();
    if (!text) {
      if (blankIsItem && parts.length === 1) items.push({title: ' ', enabled: true, checked: false});
      continue;
    }
    if (text === '-' || text === '(-' || text.startsWith('---')) { items.push({title: '-', enabled: false}); continue; }
    let enabled = true;
    if (text.startsWith('(')) { enabled = false; text = text.slice(1); }
    text = text.replace(/\/.$/, '');  // strip /K keyboard shortcut
    items.push({title: text.trim(), enabled, checked: false});
  }
  return items;
}

async function execProcCall(stmt, env) {
  const name = stmt.name;
  const ev = i => evalExpr(stmt.args?.[i], env);

  // Built-in Mac Toolbox calls
  switch (name) {
    case 'clearmenubar':
      Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
      menuSeq = 0;
      menuBarSig = null;
      renderMenuBar(); return;
    case 'drawmenubar': return;  // we render immediately; no-op here
    case 'setmenubar':
      if (savedMenuBar) {
        // The saved bar carries each menu's install order with it.
        Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
        menuBarSig = null;
        Object.assign(menuDefs, JSON.parse(JSON.stringify(savedMenuBar)));
        menuSeq = Math.max(0, ...Object.values(menuDefs).map(m => (m.order ?? 0) + 1));
        renderMenuBar();
      }
      return;
    case 'appendmenu': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const itemStr = String((await ev(1)) ?? '');
      if (!menuDefs[handle]) menuDefs[handle] = makeMenu('');
      const startIdx = Math.max(0, ...Object.keys(menuDefs[handle].items).map(Number)) + 1;
      parseMenuItems(itemStr, true).forEach((it, i) => { menuDefs[handle].items[startIdx + i] = it; });
      renderMenuBar(); return;
    }
    case 'insertmenu': { renderMenuBar(); return; }
    case 'enableitem': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = true;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = true;
        renderMenuBar();
      }
      return;
    }
    case 'disableitem': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = false;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = false;
        renderMenuBar();
      }
      return;
    }
    case 'checkitem': {
      const handle  = Math.floor(Number(await ev(0))) || 0;
      const item    = Math.floor(Number(await ev(1))) || 0;
      const checked = !!(await ev(2));
      if (menuDefs[handle]?.items[item]) {
        menuDefs[handle].items[item].checked = checked;
        renderMenuBar();
      }
      return;
    }
    case 'getitem': {
      // CALL GETITEM(hMenu, item, str$) — get menu item title into a string variable
      const handle = Math.floor(Number(await ev(0))) || 0;
      const item   = Math.floor(Number(await ev(1))) || 0;
      const strArg = stmt.args?.[2];
      if (strArg?.type === 'variable' && menuDefs[handle]?.items[item]) {
        writeVar(env, strArg.name, menuDefs[handle].items[item].title ?? '');
      }
      return;
    }
    case 'setitemstyle': return;  // menu item text style — not modelled
    case 'addresmenu': {
      // CALL ADDRESMENU(hMenu, type&) — append one item per resource of that type.
      const handle = Math.floor(Number(await ev(0))) || 0;
      const type   = await resTypeOf(stmt.args?.[1], env);
      if (!menuDefs[handle]) menuDefs[handle] = makeMenu('');
      let idx = Math.max(0, ...Object.keys(menuDefs[handle].items).map(Number));
      for (const res of macResources[type] ?? []) {
        if (!res.name) continue;
        menuDefs[handle].items[++idx] = {title: res.name, enabled: true, checked: false};
      }
      renderMenuBar();
      return;
    }
    case 'getfnum': {
      // CALL GETFNUM(name$, fontNum) — resolve a font name to its Mac font ID.
      const fonts = {chicago: 0, geneva: 3, monaco: 4, venice: 5, london: 6,
                     athens: 7, 'new york': 2, times: 20, helvetica: 21, courier: 22,
                     symbol: 23, palatino: 16};
      const nm = String((await ev(0)) ?? '').toLowerCase().trim();
      const outArg = stmt.args?.[1];
      if (outArg?.type === 'variable') writeVar(env, outArg.name, fonts[nm] ?? 0);
      return;
    }
    case 'deletemenu': case 'disposemenu': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      if (menuDefs[handle]) { delete menuDefs[handle]; renderMenuBar(); }
      return;
    }
    // ── Cursor ───────────────────────────────────────────────────
    case 'initcursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'default';
      return;
    }
    case 'setcursor': {
      const cursors = ['default','text','crosshair','cell','wait','pointer'];
      const idx = Math.floor(Number(await ev(0))) || 0;
      const cur = cursors[idx] ?? 'default';
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = cur;
      return;
    }
    case 'showcursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'default';
      return;
    }
    case 'hidecursor': {
      const w = canvas || document.getElementById('canvas-wrapper');
      if (w) w.style.cursor = 'none';
      return;
    }
    case 'getmouse': {
      // CALL GETMOUSE(pt) — writes current mouse position as packed Mac Point (v<<16|h)

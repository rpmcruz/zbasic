        el.dataset.font = String(textFont);
        el.dataset.size = String(textSize);
        el.dataset.type = String(type ?? 1);
        el.dataset.just = String(cls ?? 1);
        // A click in a field is the field's (DIALOG reports it), not a mouse
        // event in the window underneath.
        el.addEventListener('mousedown', e => e.stopPropagation());
        el.addEventListener('focus', () => {
          currentEditField = fieldId;
          lastDialogId = fieldId;
          pushEvent('editfield', {id: fieldId, code: 2});
        });
        el.addEventListener('keydown', e => {
          if (el.readOnly) return;
          if (e.key === 'Enter') { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 6}); return; }
          if (e.key === 'Tab')   { e.preventDefault(); pushEvent('editfield', {id: fieldId, code: 7}); return; }
          // ON EDIT sees the key before the field does, so hold the keystroke
          // back and let the handler decide (it may blank TEKEY$ to reject it).
          if (!onEditHandler || e.ctrlKey || e.metaKey || e.altKey) return;
          let ch = null;
          if (e.key === 'Backspace') ch = '\b';
          else if (e.key.length === 1) ch = e.key;
          if (ch === null) return;
          e.preventDefault();
          pushEvent('edit', {id: fieldId, key: ch, ctrlKey: ctrlKey(fieldId), el});
        });
        wdef.container.appendChild(el);
        ctrl = controlStore[ctrlKey(fieldId)] = {el, type: 'editfield', value: el.value};
        if (!quiet) currentEditField = fieldId;
        placeCtrl(el, rect[0], rect[1], rect[2], rect[3]);
      } else {
        if (text !== null) { ctrl.el.value = text; ctrl.value = text; }
        if (type !== null) ctrl.el.dataset.type = String(type);
        if (cls !== null)  ctrl.el.dataset.just = String(cls);
      }
      styleEditField(ctrl.el);
      return;
    }

    // SETSELECT start, end — select characters in the active edit field.
    // Supermarket selects a whole limit field (SETSELECT 0,300) when you tab
    // into it, so typing replaces the old number instead of appending to it.
    case 'SETSELECT': {
      const el = currentEditField ? getCtrl(currentEditField)?.el : null;
      if (el && el.setSelectionRange) {
        const len = el.value.length;
        el.setSelectionRange(Math.min(len, Math.max(0, await n(0))), Math.min(len, Math.max(0, await n(1))));
      }
      return;
    }

    case 'CURSOR': {
      // 0 arrow, 1 I-beam, 2 cross, 3 plus, 4 watch; else a CURS resource (see setMacCursor).
      const val = args[0] ? Math.floor(await n(0)) : 0;
      setMacCursor(STD_CURSORS[val] ?? cursorFromResource(val));
      return;
    }

    default: console.log(`unsupported syscall: ${cmd}`); return;
  }
}

// ── control flow ──────────────────────────────────────────────
async function execIf(stmt, env) {
  const cond = await evalExpr(stmt.condition, env);
  if (isTruthy(cond)) return execBlock(stmt.body, env);
  if (stmt.else)      return execBlock(stmt.else, env);
}

// FOR/NEXT as the manual defines it (Standard Reference "FOR", "NEXT"; manual
// chapter "Loops"):
//   • the body runs AT LEAST ONCE, with the start value, whatever the limit;
//   • NEXT adds STEP to the variable itself and leaves the loop once the
//     variable has passed the limit — so afterwards it holds limit+STEP ("X will
//     equal 22" after FOR X=0 TO 20 STEP 2).
// The counter therefore lives in the program variable, not in a JS local, and a
// program may move it. Seventeen loops across these programs do, mostly to exit
// early (PG:PRO's `loop = theCount`, MacPThy's `I = Xmax`). Supermarket removes a
// finished shopper with `shp = shp-1` inside `FOR Shp = 0 TO gNbrShoppers-1`;
// with the counter in a local that was ignored, the shopper shuffled into the
// freed slot skipped a turn, its SOldItems went stale, and the next XOR redraw
// erased the wrong number — the garbled counts at the checkouts.
async function execFor(stmt, env) {
  const varName = stmt.variable;
  writeVar(env, varName, await evalExpr(stmt.start, env));
  const end = Number(await evalExpr(stmt.end, env)) || 0;
  // STEP 0 loops forever on the Mac ("Note 1"); keep the browser usable instead.
  const rawStep = stmt.step ? Number(await evalExpr(stmt.step, env)) : 1;
  const step = Number.isFinite(rawStep) && rawStep !== 0 ? rawStep : 1;
  // ZBasic's reals are decimal (BCD), so FOR C# = 0 TO 1 STEP .01 reaches 1
  // exactly; binary doubles land a hair past it and would drop the last pass.
  const slack = Number.isInteger(step) ? 0 : Math.abs(step) * 1e-9;
  for (;;) {
    await maybeYield();
    if (stmt.headEol) await lineEnd(stmt.__traps);
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
    writeVar(env, varName, (Number(readVar(env, varName)) || 0) + step);
    const v = Number(readVar(env, varName)) || 0;   // after integer wrap-around
    if (step > 0 ? v > end + slack : v < end - slack) return;
  }
}

async function execWhile(stmt, env) {
  while (isTruthy(await evalExpr(stmt.condition, env))) {
    await maybeYield();
    if (stmt.headEol) await lineEnd(stmt.__traps);
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  }
}

async function execDoWhile(stmt, env) {
  do {
    await maybeYield();
    if (stmt.headEol) await lineEnd(stmt.__traps);
    const r = await execBlock(stmt.body, env);
    if (r instanceof ReturnSignal) return r;
  } while (!isTruthy(await evalExpr(stmt.condition, env)));
}

async function execSelect(stmt, env) {
  const val = await evalExpr(stmt.expr, env);
  for (const c of stmt.cases) {
    if (c.values === 'else') return execBlock(c.body, env);
    for (const cv of c.values) {
      let match = false;
      if (cv.type === 'range') {
        const from = await evalExpr(cv.from, env), to = await evalExpr(cv.to, env);
        match = Number(val) >= Number(from) && Number(val) <= Number(to);
      } else if (cv.type === 'relational') {
        match = compareOp(cv.op, val, await evalExpr(cv.expr, env));
      } else {
        const cval = await evalExpr(cv, env);
        match = val === cval || String(val).toLowerCase() === String(cval).toLowerCase();
      }
      if (match) return execBlock(c.body, env);
    }
  }
}

async function execOn(stmt, env) {
  const val = Math.floor(Number(await evalExpr(stmt.expr, env))) - 1;
  if (val < 0 || val >= stmt.targets.length) return;
  const tgt = stmt.targets[val];
  // Targets are label names stored as literal/variable/lineRef nodes.
  const lbl = labelOf(tgt);
  if (stmt.cmd === 'GOTO') throw new GotoSignal(lbl);
  if (stmt.cmd === 'GOSUB') {
    // Like a plain GOSUB: run in place so the enclosing block continues.
    if (await callEventHandler(lbl, env, true)) return;
    throw new GosubSignal(lbl);
  }
}

// APPENDMENU's item string, with the Menu Manager's metacharacters (Inside
// Macintosh): ";" separates items, "(" disables one, "!c" gives it the mark
// character c (Grglflx ticks its current font size with "9 point!" + CHR$(18)),
// "/c" a command key, "^n" an icon and "<s" a style. A lone "-" is a divider.
// `blankIsItem` keeps a blank string as a real, empty item: CDraw builds its
// "f(x)=" menu from APPENDMENU(h," ") calls and fills them in with SETITEM.
function parseMenuItems(str, blankIsItem = false) {
  const items = [];
  const parts = str.split(';');
  for (const raw of parts) {
    if (!raw.trim()) {
      if (blankIsItem && parts.length === 1) items.push({title: ' ', enabled: true, checked: false});
      continue;
    }
    let title = '', enabled = true, checked = false, cmd = null;
    for (let i = 0; i < raw.length; i++) {
      const ch = raw[i];
      if (ch === '(') enabled = false;
      else if ('!/^<'.includes(ch) && i + 1 < raw.length) {
        const arg = raw[++i];
        if (ch === '!') checked = arg.charCodeAt(0) !== 0;
        if (ch === '/') cmd = arg;
      } else title += ch;
    }
    title = title.trim();
    if (title === '-' || title.startsWith('---')) items.push({title: '-', enabled: false, checked: false});
    else items.push({title, enabled, checked, cmd});
  }
  return items;
}

async function execProcCall(stmt, env) {
  const name = stmt.name;
  const ev = i => evalExpr(stmt.args?.[i], env);

  // Built-in Mac Toolbox calls
  switch (name) {
    case 'clearmenubar':
      Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
      menuSeq = 0;
      menuBarSig = null;
      renderMenuBar(); return;
    case 'drawmenubar': return;  // we render immediately; no-op here
    case 'setmenubar':
      if (savedMenuBar) {
        // The saved bar carries each menu's install order with it.
        Object.keys(menuDefs).forEach(k => delete menuDefs[k]);
        menuBarSig = null;
        Object.assign(menuDefs, JSON.parse(JSON.stringify(savedMenuBar)));
        menuSeq = Math.max(0, ...Object.values(menuDefs).map(m => (m.order ?? 0) + 1));
        renderMenuBar();
      }
      return;
    case 'appendmenu': {
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const itemStr = String((await ev(1)) ?? '');
      if (!menuDefs[handle]) menuDefs[handle] = makeMenu('');
      const startIdx = Math.max(0, ...Object.keys(menuDefs[handle].items).map(Number)) + 1;
      parseMenuItems(itemStr, true).forEach((it, i) => { menuDefs[handle].items[startIdx + i] = it; });
      renderMenuBar(); return;
    }
    case 'insertmenu': { renderMenuBar(); return; }
    case 'enableitem': {
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = true;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = true;
        renderMenuBar();
      }
      return;
    }
    case 'disableitem': {
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const item   = Math.floor(Number(await ev(1))) || 0;
      if (menuDefs[handle]) {
        if (item === 0) menuDefs[handle].enabled = false;
        else if (menuDefs[handle].items[item]) menuDefs[handle].items[item].enabled = false;
        renderMenuBar();
      }
      return;
    }
    case 'checkitem': {
      const handle  = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const item    = Math.floor(Number(await ev(1))) || 0;
      const checked = !!(await ev(2));
      if (menuDefs[handle]?.items[item]) {
        menuDefs[handle].items[item].checked = checked;
        renderMenuBar();
      }
      return;
    }
    case 'getitem': {
      // CALL GETITEM(hMenu, item, str$) — get menu item title into a string variable
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const item   = Math.floor(Number(await ev(1))) || 0;
      const strArg = stmt.args?.[2];
      if (strArg?.type === 'variable' && menuDefs[handle]?.items[item]) {
        writeVar(env, strArg.name, menuDefs[handle].items[item].title ?? '');
      }
      return;
    }
    case 'setitemstyle': return;  // menu item text style — not modelled
    case 'addresmenu': {
      // CALL ADDRESMENU(hMenu, type&) — append one item per resource of that type.
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const type   = await resTypeOf(stmt.args?.[1], env);
      if (!menuDefs[handle]) menuDefs[handle] = makeMenu('');
      let idx = Math.max(0, ...Object.keys(menuDefs[handle].items).map(Number));
      for (const res of macResources[type] ?? []) {
        if (!res.name) continue;
        menuDefs[handle].items[++idx] = {title: res.name, enabled: true, checked: false};
      }
      renderMenuBar();
      return;
    }
    // CALL GETFNUM(name$, fontNum) and CALL GETFONTNAME(fontNum, name$) —
    // between Mac font names and font numbers. Font 1 is the application font.
    case 'getfnum': {
      const nm = String((await ev(0)) ?? '').toLowerCase().trim();
      const outArg = stmt.args?.[1];
      const num = Object.entries(MAC_FONT_NAMES).find(([, n]) => n.toLowerCase() === nm)?.[0];
      if (outArg?.name) await storeInto(outArg, Number(num ?? 0), env);
      return;
    }
    case 'getfontname': {
      const num = Math.floor(Number(await ev(0))) || 0;
      const outArg = stmt.args?.[1];
      if (outArg?.name) await storeInto(outArg, MAC_FONT_NAMES[num === 1 ? 3 : num] ?? '', env);
      return;
    }
    case 'deletemenu': case 'disposemenu': {
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      if (menuDefs[handle]) { delete menuDefs[handle]; renderMenuBar(); }
      return;
    }
    // ── Cursor ───────────────────────────────────────────────────
    case 'initcursor': setMacCursor('default'); return;
    // SETCURSOR(record) — a Cursor record, which MacPThy keeps in a row of an
    // integer array: CALL SETCURSOR(Cursr(D1,0)).
    case 'setcursor': {
      const words = await readWords(stmt.args?.[0], env, 34);
      setMacCursor(words ? cursorFromWords(words) : 'default');
      return;
    }
    case 'showcursor': cursorHidden = false; applyMacCursor(); return;
    case 'hidecursor': cursorHidden = true; applyMacCursor(); return;
    case 'getmouse': {
      // CALL GETMOUSE(pt) — the mouse position as a Point (v, h). CDraw passes
      // `My` from `DIM My,Mx`; packing both into My left Mx stale, so the
      // magnifying-glass test along its curves never matched.
      await writePoint(stmt.args?.[0], env, mouseY, mouseX);
      return;
    }

    // ── Regions ──────────────────────────────────────────────────
    case 'setclip': {
      const h = Math.floor(Number(await ev(0))) || 0;
      applyClip(h);
      return;
    }
    case 'cliprect': {
      // CALL CLIPRECT(rect) — rect in any of the three ZBasic shapes.
      // This used to read the array as (left,top,right,bottom) while SETRECT
      // stores the Mac order (top,left,bottom,right), so Grglflx's plot box
      // clipped to a tall narrow strip instead of the wide box and its curve
      // redraw spilled a stray line across the window.
      const r = await resolveRect(stmt.args?.[0], env);
      // An empty rect means "no clipping" rather than "hide everything": a
      // program that resets the clip with a screen rect it never managed to
      // fill in would otherwise blank the window.
      setClipRect(r && r.right > r.left && r.bottom > r.top ? r : null);
      return;
    }
    case 'disposergn': {
      const h = Math.floor(Number(await ev(0))) || 0;
      delete regionStore[h];
      return;
    }

    // CALL GETCLIP(rgn) — copy the port's current clip into the region. The
    // handle is written back when the caller had not allocated one, which is
    // how MacPThy and Grglflx use it ("save the clip, narrow it, put it back").
    case 'getclip': {
      const a0 = stmt.args?.[0];
      let h = Math.floor(Number(await ev(0))) || 0;
      if (!regionStore.hasOwnProperty(h)) {
        h = newRegion();
        if (a0 && (a0.type === 'variable' || a0.type === 'callable')) writeVar(env, a0.name, h);
      }
      const cur = windowClip[clipWid()];
      regionStore[h] = cur ? {left: cur.left, top: cur.top, right: cur.right, bottom: cur.bottom} : null;
      return;
    }
    // CALL SETRECTRGN(rgn, left, top, right, bottom) — coordinates are given in
    // that order here, unlike a stored Rect.
    case 'setrectrgn': {
      const h = Math.floor(Number(await ev(0))) || 0;
      setRegionRect(h, Number(await ev(1))||0, Number(await ev(2))||0,
                       Number(await ev(3))||0, Number(await ev(4))||0);
      return;
    }
    // CALL SECTRGN(a, b, dst) / DIFFRGN (a minus b) / UNIONRGN / XORRGN.
    case 'sectrgn': case 'diffrgn': case 'unionrgn': case 'xorrgn': {
      const ra = regionStore[Math.floor(Number(await ev(0))) || 0];
      const rb = regionStore[Math.floor(Number(await ev(1))) || 0];
      const dh = Math.floor(Number(await ev(2))) || 0;
      if (!dh) return;
      regionStore[dh] = rgnCombine(name.slice(0, -3), ra, rb);
      return;
    }
    case 'insetrgn': {
      const h = Math.floor(Number(await ev(0))) || 0;
      if (regionStore[h]) regionStore[h] = rgnInset(regionStore[h], Math.trunc(Number(await ev(1)) || 0), Math.trunc(Number(await ev(2)) || 0));
      return;
    }
    // Region drawing: FILLRGN with the pattern it is given, PAINTRGN with the
    // pen (its mode included), ERASERGN in the background colour, FRAMERGN
    // round the inside of the edge, INVERTRGN.
    case 'paintrgn': case 'framergn': case 'erasergn': case 'fillrgn':
    case 'invertrgn': case 'invertroundrgn': {
      let r = regionStore[Math.floor(Number(await ev(0))) || 0];
      if (!ctx || !r || r.right <= r.left || r.bottom <= r.top) return;
      showCanvas();
      if (!r.mask && name !== 'fillrgn') {   // a plain rectangle: the rect routines
        const w = r.right - r.left, hh = r.bottom - r.top;
        if (name === 'framergn') paintShape(pointBounds([[r.left, r.top], [r.right, r.bottom]]), c => penFrame(c, r.left, r.top, r.right, r.bottom));
        else if (name === 'erasergn') { ctx.fillStyle = currentBg; ctx.fillRect(r.left, r.top, w, hh); }
        else if (name === 'paintrgn') paintShape(pointBounds([[r.left, r.top], [r.right, r.bottom]], 0), c => c.fillRect(r.left, r.top, w, hh));
        else invertRectPixels(r.left, r.top, w, hh);
        return;
      }
      const fg = cssRgb(currentFg), bg = cssRgb(currentBg);
      if (name === 'fillrgn') {
        const rows = await patternRows(stmt.args?.[1], env);
        rgnPaint(r, (x, y) => (rows[y & 7] >> (7 - (x & 7))) & 1 ? fg : bg);
      } else if (name === 'erasergn') rgnPaint(r, () => bg);
      else if (name === 'invertrgn' || name === 'invertroundrgn') rgnPaint(r, () => [0, 0, 0], true);
      else {
        if (name === 'framergn') r = rgnFrame(r, penWidth, penHeight);
        const p = penPaint();
        if (p) rgnPaint(r, penPixel(p), p.op === 'difference');
      }
      return;
    }

    // ── Colour ───────────────────────────────────────────────────
    // Classic QuickDraw colour constants (Inside Macintosh): the eight values
    // below are the only ones these programs use.
    case 'forecolor': case 'backcolor': {
      const CLASSIC = {33:'#000000', 30:'#ffffff', 205:'#dd0000', 341:'#00aa00',
                       409:'#0000dd', 273:'#00cccc', 137:'#cc00cc', 69:'#cccc00'};
      const col = CLASSIC[Math.floor(Number(await ev(0))) || 0];
      if (col) { if (name === 'forecolor') currentFg = col; else currentBg = col; }
      return;
    }
    case 'rgbforecolor': case 'rgbbackcolor': {
      // The argument points at an RGBColor (three 16-bit components).
      const ptr = Math.floor(Number(await ev(0))) || 0;
      if (!ptr) return;
      const c = v => Math.max(0, Math.min(255, v >> 8));
      const col = `rgb(${c(fakeReadU16(ptr))},${c(fakeReadU16(ptr+2))},${c(fakeReadU16(ptr+4))})`;
      if (name === 'rgbforecolor') currentFg = col; else currentBg = col;
      return;
    }
    case 'backpixpat': return;   // pattern fills are drawn as flat colour here

    // ── Windows and controls ─────────────────────────────────────
    case 'setwtitle': {
      // CALL SETWTITLE(wPtr, title$) — the pointer is opaque here, so retitle
      // the window the program is currently drawing into.
      const title = String((await ev(1)) ?? '');
      const wid = clipWid();
      if (windowDefs[wid]) { windowDefs[wid].title = title; renderTabs(); }
      return;
    }
    case 'draw1control': case 'disposdialog': return;

    // ── Resource file writing ────────────────────────────────────
    // These persist data back into the .rsrc (high-score tables, saved setups).
    // The resource fork is read-only here, so they are accepted and dropped
    // rather than falling through to "undefined:" — the programs carry on.
    case 'addresource': case 'changedresource': case 'updateresfile':
    case 'rmveresource': case 'setresinfo': case 'setresattrs':
    case 'closeresfile':
      return;

    // CALL OPENRGN … CALL CLOSERGN(rgn) — everything drawn in between is
    // recorded as the region's outline instead of being painted. Our regions
    // are rectangles, so what is kept is the bounding box; the half that
    // matters here is the suppression. CDraw traces its derivative curve point
    // by point between these calls to build a hit-test region, and drawing
    // those ~850 lines put a second curve on screen that was never meant to be
    // there — and, once the erase pen mode was honoured, rubbed out the real
    // one and part of the x axis with it.
    case 'openrgn':
      rgnCollect = {left: penX, top: penY, right: penX, bottom: penY, segs: []};
      return;
    case 'closergn': {
      const a0 = stmt.args?.[0];
      let h = Math.floor(Number(await ev(0))) || 0;
      if (!regionStore.hasOwnProperty(h)) {
        h = newRegion();
        if (a0 && (a0.type === 'variable' || a0.type === 'callable')) writeVar(env, a0.name, h);
      }
      regionStore[h] = rgnCollect ? rgnFromSegments(rgnCollect.segs, rgnCollect) : null;
      rgnCollect = null;
      return;
    }
    case 'invalrect': case 'validrect': case 'beginupdate': case 'endupdate':
      return;
    case 'hilitemenu': {
      const mid = Math.floor(Number(await ev(0))) || 0;
      document.querySelectorAll('#dynamic-menubar .dyn-menu.open')
        .forEach(el => el.classList.remove('open'));
      if (mid !== 0) {
        const el = document.querySelector(`#dynamic-menubar .dyn-menu[data-menu-id="${mid}"]`);
        if (el) el.classList.add('open');
      }
      return;
    }
    case 'flashmenubar': {
      const mid = Math.floor(Number(await ev(0))) || 0;
      const sel = mid
        ? `#dynamic-menubar .dyn-menu[data-menu-id="${mid}"]`
        : '#dynamic-menubar';
      const el = document.querySelector(sel);
      if (el) {
        el.style.filter = 'invert(1)';
        setTimeout(() => { el.style.filter = ''; }, 80);
      }
      return;
    }

    // ── setrect / rect math — write back to array via AST arg ───
    // ── QuickDraw rect primitives ────────────────────────────
    // These were no-ops, which is why Grglflx's main window came up blank and
    // CDraw's palette never appeared: the programs draw their static furniture
    // (frames, labels, wrapped text) entirely through these calls.
    case 'framerect': case 'paintrect': case 'eraserect': case 'invertrect':
    case 'fillrect':  case 'frameoval': case 'paintoval': case 'eraseoval':
    case 'frameroundrect': case 'paintroundrect': case 'eraseroundrect': {
      if (!ctx) return;
      const r = await resolveRect(stmt.args?.[0], env);
      if (!r) return;
      const w = r.right - r.left, h = r.bottom - r.top;
      if (w <= 0 || h <= 0) return;
      const round = name.includes('round');
      const oval  = name.includes('oval');
      const rad = round ? Math.min(Math.abs(Number(await ev(1)) || 16) / 2, w / 2, h / 2) : 0;
      // Frame… and Paint… draw with the pen — its pattern and its mode, so in
      // XOR they can be undone by drawing again — Erase… with the background,
      // FillRect with the pattern it is given, InvertRect inverts. (Frames
      // and paints used to ignore the pen, so CDraw's XOR-painted
      // change-in-f rectangle could never be erased and piled up in black.)
      // i insets the shape: a frame is drawn inside it, as QuickDraw does.
      const shape = (c, i = 0) => {
        c.beginPath();
        if (oval) c.ellipse(r.left + w/2, r.top + h/2, Math.max(0, w/2 - i), Math.max(0, h/2 - i), 0, 0, Math.PI*2);
        else c.roundRect(r.left + i, r.top + i, w - 2*i, h - 2*i, rad);
      };
      const box = pointBounds([[r.left, r.top], [r.right, r.bottom]], 0);
      if (name.startsWith('frame')) {
        if (oval || round) paintShape(box, c => { c.lineWidth = penWidth; shape(c, penWidth / 2); c.stroke(); });
        else paintShape(box, c => penFrame(c, r.left, r.top, r.right, r.bottom));
      } else if (name.startsWith('paint')) {
        paintShape(box, c => { if (oval || round) { shape(c); c.fill(); } else c.fillRect(r.left, r.top, w, h); });
      } else if (name.startsWith('erase')) {
        ctx.fillStyle = currentBg;
        if (oval || round) { shape(ctx); ctx.fill(); } else ctx.fillRect(r.left, r.top, w, h);
      } else if (name === 'invertrect') {
        invertRectPixels(r.left, r.top, w, h);
      } else {   // FILLRECT(rect, pattern)
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = patternFill(ctx, await patternRows(stmt.args?.[1], env), currentFg, currentBg);
        ctx.fillRect(r.left, r.top, w, h);
      }
      showCanvas();
      return;
    }

    case 'textbox': {
      // CALL TEXTBOX(ptr, length, rect, justification) — wrapped text in a rect.
      // The pointer normally comes from VARPTR(s$)+1, i.e. past the Pascal
      // length byte, so it is read straight out of the emulated heap.
      if (!ctx) return;
      const ptr = Math.floor(Number(await ev(0))) || 0;
      const len = Math.floor(Number(await ev(1))) || 0;
      const r   = await resolveRect(stmt.args?.[2], env);
      const just = Math.floor(Number(await ev(3))) || 0;
      if (!r || len <= 0) return;
      drawTextBox(macRomanToStr(fakeReadBytes(ptr, len)), r, just);
      showCanvas();
      return;
    }

    case 'drawstring': case 'drawtext': case 'drawchar': {
      if (!ctx) return;
      let txt;
      if (name === 'drawchar') txt = String.fromCharCode(Math.floor(Number(await ev(0))) || 32);
      else {
        const v = await ev(0);
        txt = typeof v === 'string' ? v : macRomanToStr(fakeReadBytes(Math.floor(Number(v)) || 0, Math.floor(Number(await ev(1))) || 0));
      }
      gfxText(txt, penX, penY);
      penX = gfxPenX;
      showCanvas();
      return;
    }

    case 'setrect': case 'offsetrect': case 'insetrect': {
      const arg0 = stmt.args?.[0];
      if (arg0?.type === 'variable') {
        // CALL SETRECT(rect, left, top, right, bottom) — write struct to variable
        const varName = arg0.name;
        const cur = readVar(env, varName) ?? {};
        // `DIM T,L,B,R` — four consecutive scalars standing in for one Rect.
        // The call names only the first, so the other three have to be written
        // as well. CDraw walks its x-axis numbering along the axis with
        //   CALL OFFSETRECT(T, Hunit, 0)
        // between TEXTBOX calls; with only the number in "T" to work on the
        // call did nothing, and every tick label was drawn on top of the last
        // under the first tick.
        const grp = (cur && typeof cur === 'object') ? null : dimGroups[normVarName(varName)];
        if (grp && grp.length >= 4) {
          const g = grp.map(n => Number(readVar(env, n)) || 0);   // top, left, bottom, right
          const dh = Number(await ev(1)) || 0, dv = Number(await ev(2)) || 0;
          const r = name === 'setrect'
            ? [Number(await ev(2)) || 0, Number(await ev(1)) || 0,   // top, left
               Number(await ev(4)) || 0, Number(await ev(3)) || 0]   // bottom, right
            : name === 'offsetrect'
              ? [g[0] + dv, g[1] + dh, g[2] + dv, g[3] + dh]
              : [g[0] + dv, g[1] + dh, g[2] - dv, g[3] - dh];       // insetrect
          for (let i = 0; i < 4; i++) writeVar(env, grp[i], r[i]);
          return;
        }
        if (name === 'setrect') {
          const obj = {left: Number(await ev(1))||0, top: Number(await ev(2))||0,
                       right: Number(await ev(3))||0, bottom: Number(await ev(4))||0};
          writeVar(env, varName, {...(typeof cur==='object'?cur:{}), ...obj});
        } else if (name === 'offsetrect') {
          const dh = Number(await ev(1))||0, dv = Number(await ev(2))||0;
          if (typeof cur === 'object') { cur.top+=dv; cur.left+=dh; cur.bottom+=dv; cur.right+=dh; writeVar(env, varName, cur); }
        } else if (name === 'insetrect') {
          const dh = Number(await ev(1))||0, dv = Number(await ev(2))||0;
          if (typeof cur === 'object') { cur.top+=dv; cur.left+=dh; cur.bottom-=dv; cur.right-=dh; writeVar(env, varName, cur); }
        }
        return;
      }
      if (arg0?.type === 'callable') {
        const arrName = arg0.name;
        const i0 = arg0.args?.[0] ? Math.floor(Number(await evalExpr(arg0.args[0], env))) : 0;
        const i1 = arg0.args?.[1] ? Math.floor(Number(await evalExpr(arg0.args[1], env))) : null;
        const arr = readVar(env, arrName);
        if (Array.isArray(arr)) {
          let target = arr, base = i0;
          if (i1 !== null && Array.isArray(arr[i0])) { target = arr[i0]; base = i1; }
          // SETRECT's arguments are (left, top, right, bottom) but a Rect is
          // stored top, left, bottom, right — CDraw relies on that layout when
          // it reads PaletteRect(n,1) and PaletteRect(n,3) back as x coordinates.
          if (name === 'setrect') {
            target[base]   = Number(await ev(2)) || 0;   // top
            target[base+1] = Number(await ev(1)) || 0;   // left
            target[base+2] = Number(await ev(4)) || 0;   // bottom
            target[base+3] = Number(await ev(3)) || 0;   // right
          } else if (name === 'offsetrect') {
            const dh = Number(await ev(1)) || 0, dv = Number(await ev(2)) || 0;
            target[base]   += dv; target[base+1] += dh;
            target[base+2] += dv; target[base+3] += dh;
          } else if (name === 'insetrect') {
            const dh = Number(await ev(1)) || 0, dv = Number(await ev(2)) || 0;
            target[base]   += dv; target[base+1] += dh;
            target[base+2] -= dv; target[base+3] -= dh;
          }
        }
      }
      return;
    }

    case 'unionrect': {
      // CALL UNIONRECT(src1(i), src2(i), dst(i))
      const readRect = async argN => {
        const a = stmt.args?.[argN];
        if (a?.type !== 'callable') return null;
        const arr = readArray(env, a.name);
        if (!Array.isArray(arr)) return null;
        const i = a.args?.[0] ? Math.floor(Number(await evalExpr(a.args[0], env))) : 0;
        return { arr, i };
      };
      const s1 = await readRect(0), s2 = await readRect(1), dst = await readRect(2);
      if (s1 && s2 && dst) {
        dst.arr[dst.i]   = Math.min(s1.arr[s1.i],   s2.arr[s2.i]);
        dst.arr[dst.i+1] = Math.min(s1.arr[s1.i+1], s2.arr[s2.i+1]);
        dst.arr[dst.i+2] = Math.max(s1.arr[s1.i+2], s2.arr[s2.i+2]);
        dst.arr[dst.i+3] = Math.max(s1.arr[s1.i+3], s2.arr[s2.i+3]);
      }
      return;
    }

    case 'rectrgn': {
      // CALL RECTRGN(rgnHandle, rect) — same Mac rect order as CLIPRECT.
      const h = Math.floor(Number(await ev(0))) || 0;
      const rr = await resolveRect(stmt.args?.[1], env);
      if (rr) setRegionRect(h, rr.left, rr.top, rr.right, rr.bottom);
      return;
    }

    // ── TextEdit ──────────────────────────────────────────────────
    case 'tenew': {
      // CALL TENEW(outVar, viewRect) — write handle into outVar
      const arg0 = stmt.args?.[0];
      let varName = null;
      if (arg0?.type === 'variable') varName = arg0.name;
      else if (arg0?.type === 'callable' && !arg0.args?.length) varName = arg0.name;
      const handle = await makeTeHandle(stmt.args?.[1], env);
      if (varName) writeVar(env, varName, handle);
      return;
    }
    case 'tesettext': {
      // CALL TESETTEXT(textPtr, len, hTE) — Mac API order
      const textPtr = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const len     = Math.floor(Number(await evalExpr(stmt.args?.[1], env))) || 0;
      const handle  = Math.floor(Number(await evalExpr(stmt.args?.[2], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        rec.text = macRomanToStr(fakeReadBytes(textPtr, len));
        renderTeDiv(rec);
      }
      return;
    }
    case 'tecaltext': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        const lines = rec.text.split('\r').length;
        fakeWriteU16(fakeReadU32(handle) + 94, lines);
      } else console.warn(`TE TECALTEXT: no record for handle ${handle}`);
      return;
    }
    case 'teupdate': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[1], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) renderTeDiv(rec);
      return;
    }
    case 'tescroll': {
      const dH     = Number(await evalExpr(stmt.args?.[0], env)) || 0;
      const dV     = Number(await evalExpr(stmt.args?.[1], env)) || 0;
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[2], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) { rec.div.scrollLeft += dH; rec.div.scrollTop += dV; }
      return;
    }
    case 'tedispose': {
      const handle = Math.floor(Number(await evalExpr(stmt.args?.[0], env))) || 0;
      const rec = teHandleMap[handle];
      if (rec) { rec.div.remove(); delete teHandleMap[handle]; }
      return;
    }
    case 'teactivate': case 'teleactivate': case 'drawcontrols':
      return;

    // TextEdit selection and editing. The TE record is backed by a scrollable
    // <div>, so "select" and "scroll into view" are expressed as a scroll
    // position derived from the line height.
    case 'tesetselect': {
      const start  = Math.floor(Number(await ev(0))) || 0;
      const end    = Math.floor(Number(await ev(1))) || 0;
      const handle = Math.floor(Number(await ev(2))) || 0;
      const rec = teHandleMap[handle];
      if (rec) { rec.selStart = start; rec.selEnd = end; }
      return;
    }
    case 'teselview': {
      // Scroll the selection into view — this is how MacPThy's help window and
      // CDraw's scrolling help move the text when the scroll bar is clicked.
      const handle = Math.floor(Number(await ev(0))) || 0;
      const rec = teHandleMap[handle];
      if (rec && rec.div) {
        const before = rec.text.slice(0, rec.selStart ?? 0);
        const line = before.split('\r').length - 1;
        rec.div.scrollTop = Math.max(0, line * (rec.lineHeight || 12));
      }
      return;
    }
    case 'teinsert': {
      // CALL TEINSERT(ptr, len, hTE) — insert text at the selection.
      const ptr    = Math.floor(Number(await ev(0))) || 0;
      const len    = Math.floor(Number(await ev(1))) || 0;
      const handle = Math.floor(Number(await ev(2))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        const at = rec.selStart ?? rec.text.length;
        const ins = macRomanToStr(fakeReadBytes(ptr, len));
        rec.text = rec.text.slice(0, at) + ins + rec.text.slice(rec.selEnd ?? at);
        rec.selStart = rec.selEnd = at + ins.length;
        renderTeDiv(rec);
      }
      return;
    }
    case 'tedelete': case 'tecut': {
      const handle = Math.floor(Number(await ev(0))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        const a = rec.selStart ?? 0, b = rec.selEnd ?? a;
        rec.text = rec.text.slice(0, a) + rec.text.slice(b);
        rec.selEnd = rec.selStart = a;
        renderTeDiv(rec);
      }
      return;
    }
    case 'tekey': {
      // CALL TEKEY(char, hTE)
      const code   = Math.floor(Number(await ev(0))) || 0;
      const handle = Math.floor(Number(await ev(1))) || 0;
      const rec = teHandleMap[handle];
      if (rec) {
        const a = rec.selStart ?? rec.text.length, b = rec.selEnd ?? a;
        if (code === 8) {                       // backspace
          const from = a === b ? Math.max(0, a - 1) : a;
          rec.text = rec.text.slice(0, from) + rec.text.slice(b);
          rec.selStart = rec.selEnd = from;
        } else if (code >= 32 || code === 13) {
          const ch = code === 13 ? '\r' : String.fromCharCode(code);
          rec.text = rec.text.slice(0, a) + ch + rec.text.slice(b);
          rec.selStart = rec.selEnd = a + 1;
        }
        renderTeDiv(rec);
      }
      return;
    }
    case 'testylpaste': return;   // styled paste — no styled scrap here

    case 'setitem': {
      // CALL SETITEM(hMenu, item, str$) — set menu item title
      const handle = menuIdOf(Math.floor(Number(await ev(0))) || 0);
      const item   = Math.floor(Number(await ev(1))) || 0;
      const title  = String((await ev(2)) ?? '');
      if (menuDefs[handle]?.items[item]) {
        menuDefs[handle].items[item].title = title;
        renderMenuBar();
      }
      return;
    }

    // Mac Toolbox stubs — not fully implemented
    // CALL GETPENSTATE(s$) / CALL SETPENSTATE(s$) — save and restore the pen.
    // The program only ever hands the saved record straight back, so what it
    // holds is ours to choose; it is stashed in the variable it was given so
    // that nesting works. CDraw and Grglflx bracket their whole window-format
    // routine with these, and that routine ends with the pen left in erase mode
    // by the palette frame: with the restore doing nothing, the next redraw
    // drew the axes with an erasing pen and the graph came up blank.
    case 'getpenstate': case 'setpenstate': {
      const a0 = stmt.args?.[0];
      const state = () => ({penWidth, penHeight, gfxPenMode, penPat, currentFg, penX, penY});
      if (name === 'getpenstate') {
        const s = JSON.stringify(state());
        if (a0?.type === 'variable') writeVar(env, a0.name, s); else savedPenState = state();
        return;
      }
      let st = savedPenState;
      if (a0?.type === 'variable') {
        try { st = JSON.parse(String(readVar(env, a0.name) ?? '')); } catch (e) { /* not ours */ }
      }
      if (st && typeof st === 'object') {
        penWidth = st.penWidth ?? penWidth; penHeight = st.penHeight ?? penHeight;
        gfxPenMode = st.gfxPenMode ?? gfxPenMode; currentFg = st.currentFg ?? currentFg;
        if ('penPat' in st) penPat = st.penPat;
        penX = st.penX ?? penX; penY = st.penY ?? penY;
        if (ctx) ctx.lineWidth = penWidth;
      }
      return;
    }
    case 'moveto': case 'move': {
      penX = Number(await ev(0)) || 0;
      penY = Number(await ev(1)) || 0;
      // MOVETO also moves where PRINT writes. The manual documents the
      // equivalence from the other side — PRINT %(x,y) is "same as the toolbox
      // MOVETO function" — so the print position and the QuickDraw pen are one
      // and the same. MacPThy labels its axes with
      //   CALL MOVETO(Xo-4,Yv-5) : PRINT "Y";
      // and prints the "U=" caption inside the indifference-curve tool the same
      // way; with the two positions kept apart both landed wherever the previous
      // PRINT had left off, so "Y" appeared next to "X" at the foot of the graph
      // and "U=" in the window's top-left corner.
      textX = penX; textY = penY;
      // OpenRgn starts the outline at the pen, so a MoveTo inside one counts.
      rgnNote({x: penX, y: penY, w: 0, h: 0});
      return;
    }
    case 'lineto': case 'line': {
      const tx = Number(await ev(0)) || 0, ty = Number(await ev(1)) || 0;
      const fx = penX, fy = penY;
      ctx.lineWidth = penWidth;
      paintShape(pointBounds([[fx, fy], [tx, ty]]), c => {
        c.lineWidth = penWidth;
        penLine(c, fx, fy, tx, ty);
      });
      penX = tx; penY = ty; textX = tx; textY = ty;
      return;
    }
    case 'penmode': {
      gfxPenMode = Math.round(Number(await ev(0)) || 0);
      return;
    }
    case 'pensize': {
      const pw = Number(await ev(0)) || 1, ph = Number(await ev(1)) || pw;
      penWidth = Math.max(1, pw); penHeight = Math.max(1, ph);
      ctx.lineWidth = penWidth;
      return;
    }
    // Stubs — these must NOT fall through into GETCTITLE below, which writes
    // to its second argument and would clobber a caller variable.
    case 'textfont': { textFont = Math.floor(Number(await ev(0)) || 0); return; }
    case 'textsize': { textSize = Math.max(1, Math.floor(Number(await ev(0)) || 12)); return; }
    case 'textface': case 'textmode':
    case 'setport': case 'initport': case 'getwtitle':
    case 'sysclosedeskfiles': case 'nop':
    case 'getport': case 'setctype':
    case 'selitext': case 'setitext': case 'getitext':
      return;

    // CALL PARAMTEXT(a$,b$,c$,d$) — the four strings ^0…^3 stand for in any
    // dialog text drawn afterwards. MacPThy names the thing you ran out of
    // this way ("You may not use more than 50 ^0"), so without it every alert
    // it puts up would read with a hole in the sentence.
    case 'paramtext': {
      for (let i = 0; i < 4; i++) paramText[i] = String((await ev(i)) ?? '');
      return;
    }

    // CALL GETWMGRPORT(port&) — hand back a port whose portRect (at offset 8)
    // holds the screen bounds, because that is the only field the programs
    // read: `BLOCKMOVE WMgrPort&+8, VARPTR(ScrnT), 8` is how both Grglflx and
    // CDraw learn the screen size, and they centre every window with it.
    case 'getwmgrport': {
      const a0 = stmt.args?.[0];
      if (a0 && (a0.type === 'variable' || a0.type === 'callable')) {
        writeVar(env, a0.name, wMgrPortPtr());
      }
      return;
    }
    case 'getctitle': {
      // CALL GETCTITLE(handle&, title$) — read control title into variable
      const handle = Math.floor(Number(await ev(0)));
      const titleArg = stmt.args?.[1];
      if (titleArg?.type === 'variable' || titleArg?.type === 'callable') {
        const varName = titleArg.name;
        const ctrl = getCtrl(handle);
        writeVar(env, varName, ctrl?.title ?? '');
      }
      return;
    }
    case 'getditem': case 'setditem': case 'setctitle':
    case 'getresinfo': case 'releaseresource': case 'useresfile':
    // CALL PENNORMAL — back to a 1x1 black pen in patCopy. Programs lean on
    // this to undo a PEN they set earlier; as a no-op an XOR or erase pen leaked
    // into everything drawn afterwards.
    case 'pennormal':
      penWidth = 1; penHeight = 1; gfxPenMode = 8; penPat = null; currentFg = '#000000';
      if (ctx) ctx.lineWidth = 1;
      return;
    case 'penpat':
    case 'modaldialog': case 'begindialog': case 'enddialog':
    case 'teautoview': return;
    // CALL GETKEYS(keyMap) — the 128-bit KeyMap, one bit per Mac key code: key
    // k is bit k MOD 8 of byte k \ 8. Only the modifier keys are tracked
    // (modifiersDown). CDraw's FN ShiftDown reads Shift (key 56) with
    // FN BITTST(VARPTR(KeyRecord(3)), 15); a Shift-drag over a curve shades the
    // area under the derivative, which with no keyboard never appeared.
    case 'getkeys': {
      const bytes = new Array(16).fill(0);
      for (const [code, on] of [[56, modifiersDown.shift], [57, modifiersDown.caps], [58, modifiersDown.option],
                                [59, modifiersDown.control], [55, modifiersDown.command]])
        if (on) bytes[code >> 3] |= 1 << (code & 7);
      const words = [];
      for (let i = 0; i < 16; i += 2) words.push(((bytes[i] << 8) | bytes[i + 1]) << 16 >> 16);
      await writeWords(stmt.args?.[0], env, words);
      return;
    }
    case 'getfontinfo': {
      // CALL GETFONTINFO(info) — the FontInfo record (ascent, descent, widMax,
      // leading) of the current TEXT font, into the variables that hold it.
      // It used to fill CDraw's FAsc… by name whatever was passed, so MacPThy's
      // Ploc%(0…3) stayed 0: FN Message measured each line as 1 pixel tall and
      // printed its prompts above the top of the window.
      await writeWords(stmt.args?.[0], env, fontInfo());
      return;
    }
    case 'getpen': {
      // CALL GETPEN(arr) — fill arr[0]=v(y), arr[1]=h(x) with current text pen position
      await writePoint(stmt.args?.[0], env, Math.round(gfxPenY), Math.round(gfxPenX));
      return;
    }
    case 'scrollrect': {
      // CALL SCROLLRECT(rect, dh, dv, updateRgn) — shift the pixels in a rect.
      const r = await resolveCtrlRect(stmt.args?.[0], env);
      const dh = Math.round(Number(await ev(1)) || 0);
      const dv = Math.round(Number(await ev(2)) || 0);
      if (!ctx || !r || (!dh && !dv)) return;
      const [x1, y1, x2, y2] = r;
      const w = Math.max(0, x2 - x1), h = Math.max(0, y2 - y1);
      if (!w || !h) return;
      const img = ctx.getImageData(dev(x1), dev(y1), dev(x1 + w) - dev(x1), dev(y1 + h) - dev(y1));
      ctx.fillStyle = currentBg;
      ctx.fillRect(x1, y1, w, h);
      ctx.putImageData(img, dev(x1 + dh), dev(y1 + dv));
      return;
    }
    case 'localtoglobal': case 'globaltolcal': return;  // coordinate conversion no-op
  }

  const fn = funcDefs[name];
  if (!fn) { console.log(`undefined: ${name}`); return; }
  const local = makeLocalScope(fn);
  await bindArgs(fn, local, stmt.args, env);
  await execBlock(fn.body, local);
}

let savedMenuBar = null;

// Bind a function's parameters in its new scope. They go under the normalised
// name that readVar() tries first: stored as the raw `x%`, a read of x% inside a
// LOCAL FN found any global `x` through the scope's prototype chain before it
// ever got to the parameter. They are typed like an assignment, too.
async function bindArgs(fn, local, args, env) {
  const params = fn.args ?? [];
  // All arguments are evaluated before any is bound: with global parameters,
  // binding the first could change what the second evaluates to.
  const vals = [];
  for (let i = 0; i < params.length; i++) vals.push(await evalExpr(args?.[i], env));
  params.forEach((p, i) => {
    const n = normVarName(p.name);
    local[n] = coerceVar(n, vals[i]);
  });
}

// PG:PRO's object layer — the buttons, fields, pictures and scroll bars its
// windows are built from (pG3c resources) — is emulated natively, like pGbuild
// below: buildPgObjects makes real controls of them. PG:PRO's own functions for
// that layer read, draw and hit-test object records that do not exist here, so
// running them over the emulation fights it (windows stopped closing, typed
// checkout limits were lost); they are not run. The rest of its runtime — the
// menus, the File menu, closing windows — runs as written.
const PG_NATIVE = new Set(['pgcountobj', 'pggetobj', 'pgputobj', 'pggetref', 'pggettext$',
  'pgdrawcontrols', 'pgframebtn', 'pggetgroup', 'pgsetgroup', 'pgpointinobj', 'pgdepthofpoint',
  'pguseobjcolor', 'pgfield', 'pgtab', 'pgfixeditor', 'pgbtnaction', 'pgmouse', 'pgupdate',
  'pgcursor', 'pgblackandwhite']);

async function execUserFuncCall(stmt, env) {
  // Intercept pGbuild — the actual LOCAL FN body never pushes a window-update
  // event (it relies on Mac OS event machinery). We create the window and push
  // a dialog event (code 5 = WUpd) so DIALOG ON fires "PG:WUpd" → RefreshMain.
  if (stmt.name.replace(/\s+/g,'').toLowerCase() === 'pgbuild') {
    const wndArg = Math.floor(Number(await evalExpr(stmt.args?.[0], env) ?? 1));
    let wndNum = wndArg < 0 ? -wndArg : wndArg;
    if (wndNum < 1) wndNum = 1;
    // Geometry and title come from the window's own pG3w resource, the same
    // one PG:PRO reads in FN pGgetWnd$ — otherwise every window came up
    // 512x342 and titled with its number.
    const spec = pg3wInfo(wndNum);
    const prevOut = outputWindowId;
    getOrCreateWindow(wndNum, spec ? spec.title : null,
                      spec ? spec.w : 512, spec ? spec.h : 342);
    bringToFront(wndNum);
    buildPgObjects(wndNum);
    eventQueue.push({type:'dialog', code:5, winRef:wndNum});
    // Do NOT leave drawing pointed at the new window. PG:PRO's own update
    // handler brackets the dispatch with `gOutputWas = WINDOW(_outputWnd) …
    // WINDOW OUTPUT gWhichWindow … WINDOW OUTPUT gOutputWas`, so redirecting
    // permanently here sent the running simulation into the Help window.
    if (prevOut != null && windowDefs[prevOut]) setOutputWindow(prevOut);
    else setOutputWindow(wndNum);
    // A window whose pG3w attributes carry the splash bit and which is not a
    // text editor draws at once and then waits for a click or key before
    // closing itself; the 140-tick timeout applies only when pGbuild was
    // called with a positive window number (Supermarket's About window is
    // opened as `FN pGbuild(-_AboutWnd)`, so it waits for the user).
    if (spec && (spec.attrs & PG_SPLASH_MASK) && !spec.vMax) {
      armSplashWindow(wndNum, wndArg > 0 ? 140 : 0);
    }
    return null;
  }
  if (PG_NATIVE.has(stmt.name)) return 0;
  const fn = funcDefs[stmt.name];
  // Anything that is not one of the program's own functions is a built-in or
  // a Toolbox function — the same table a bare name(...) call goes through.
  if (!fn) return evalCallable({name: stmt.name, args: stmt.args}, env, true);
  if (fn.using) {
    // DEF FN foo USING bar& — dispatch through function pointer stored in bar&
    const ptrName = fn.using.name;
    const handle = Math.floor(Number(readVar(env, ptrName) ?? 0));
    const targetName = fnPtrTable[handle];
    if (!targetName || !funcDefs[targetName]) return null;
    return execUserFuncCall({...stmt, name: targetName}, env);
  }
  const local = makeLocalScope(fn);
  await bindArgs(fn, local, stmt.args, env);
  if (fn.type === 'defFn') return evalExpr(fn.value, local);
  // A RETURN in a function's own body leaves the function: compiled ZBasic
  // calls an FN as a subroutine, so RETURN is the return to its caller.
  // MacPThy's FN Message starts `IF Xmes=-1 THEN GOSUB "cancel":RETURN`;
  // carried on out to the caller's GOSUB instead, it ended DSM's main routine
  // each time it cleared a message, and DSM went round and round its loop
  // without ever drawing anything.
  try {
    if (await execBlock(fn.body, local) instanceof ReturnSignal) return null;
  } catch (e) {
    if (e instanceof ReturnSignal) return null;
    throw e;
  }
  return fn.ret ? evalExpr(fn.ret, local) : null;
}

// ── Expression evaluator ──────────────────────────────────────
// Is this expression *level* evaluated as floating point?
//
// Manual, "Understanding expressions that are optimized for integer math":
// "integer is assumed UNLESS one of the following is found in an expression:
// decimal Point, scientific function, \\ (floating point divide), #, ! or a
// constant > 65,535" — and only the outermost portion of the expression counts,
// so a parenthesised sub-expression has a level of its own. The practical
// consequence is that `/` is *integer* divide inside an integer level; Grglflx's
//   PointsLeft = LevelPts*(1+(Xmax-Xmin))/DeltaX
// is meant to yield 81, not 81.4, and printed the raw fraction without this.

    case 'variable':
      return /[!#]$/.test(node.name || '');

      // only the identity of the function matters here — a scientific
      // function, or a real array element or FN (BVal!(i), FN X6!(…)).
      if (/[!#]$/.test(node.name || '')) return true;
      return SCI_FNS.has(String(node.name || '').toLowerCase().replace(/[!#%&$]$/, ''));

      return node.expression && !node.expression.paren && levelIsReal(node.expression);

}

async function evalExpr(node, env, lvlReal) {

    case 'constant':    return node.value;
    case 'literal':     return node.value;

      if (normVarName(node.name) === 'tekey$') return teKey;

      if (recordOf[normVarName(node.name)]) return readRecord(normVarName(node.name), null);
      const rv = readVar(env, node.name);
      if (rv !== undefined && rv !== null) return rv;
      if (node.name.startsWith('_')) console.warn(`Undefined constant: ${node.name}`);

      // otherwise "x" + B$ would concatenate the number and yield "x0".

    case 'unary':       return evalUnary(node, env);

async function evalBinary(node, env, lvlReal) {
  if (lvlReal === undefined) lvlReal = levelIsReal(node);
  // A parenthesised operand starts a fresh level; anything else inherits ours.
  const L = await evalExpr(node.left,  env, node.left  && node.left.paren  ? undefined : lvlReal);
  const R = await evalExpr(node.right, env, node.right && node.right.paren ? undefined : lvlReal);

  // real: the manual's own examples give B+(.23)+1200 = 1210 and
  // B+(200*(.001^2)) = 10 for B=10. Only arithmetic is folded this way —
  // comparisons already return -1/0 and "+" doubles as string concatenation.
  const arith = v => lvlReal ? v : Math.trunc(v);

    case '+': return (typeof L === 'string' || typeof R === 'string') ? String(L??'') + String(R??'') : arith((Number(L)||0) + (Number(R)||0));
    case '-': return arith((Number(L)||0) - (Number(R)||0));
    case '*': return arith((Number(L)||0) * (Number(R)||0));
    // Manual, "Integer and floating point divide symbols": with "Optimize
    // expressions as Integer" (the default) "/" is Integer Divide and "\\" is
    // Floating Point Divide. Integer divide only applies where the level is
    // itself integer — a level carrying a decimal point, ! or # divides normally.
    case '/': {
      const d = Number(R);
      if (!d) return 0;
      return arith((Number(L)||0)/d);

    // Reference, operator table: "\ DIVIDE (Floating point Divide or Integer
    // Divide) — if configured as 'Optimize Expressions as Integer' the \ is
    // forced floating point divide, otherwise it is forced integer divide."
    // That option defaults to Y, and every program here relies on it:
    // CDraw's XFactor! = 1\Hunit and MacPThy's Slope! = (Iyf-Iyo)*YFactor!\(Ixf-Ixo)
    // are both nonsense as integer division (CDraw plotted a flat line).
    case '\\': { const d = Number(R); return d ? (Number(L)||0)/d : 0; }
    case '^': return arith(Math.pow(Number(L)||0, Number(R)||0));
    case 'MOD': { const d = Number(R)|0; return d ? (Number(L)|0)%d : 0; }
    case '&': return String(L??'') + String(R??'');

    case '<>': return cmpVals(L, R) !== 0 ? -1 : 0;
    case '<':  return cmpVals(L, R) <  0 ? -1 : 0;
    case '>':  return cmpVals(L, R) >  0 ? -1 : 0;
    case '<=': return cmpVals(L, R) <= 0 ? -1 : 0;
    case '>=': return cmpVals(L, R) >= 0 ? -1 : 0;
    // AND/OR/XOR are bitwise in ZBasic (see the truth tables in the reference:
    // "PRINT 4 AND 255" → 4). They double as logical operators because TRUE is
    // -1 (all bits set) and FALSE is 0.
    case 'AND': return (Number(L)|0) & (Number(R)|0);
    case 'OR':  return (Number(L)|0) | (Number(R)|0);
    case 'XOR': return (Number(L)|0) ^ (Number(R)|0);

    // an integer number)", and "89.34<<2 = 357.36": on a real level a shift

    // Surplus&(I)=Y!<<10, and shifting only the whole part made the marginal
    // revenue curve it draws from it a sawtooth.
    case '<<': case '>>': {
      const n = Math.trunc(Number(R)) || 0, x = Number(L) || 0;
      if (lvlReal) return node.operator === '<<' ? x * 2 ** n : x / 2 ** n;
      return node.operator === '<<' ? (x | 0) << n : (x | 0) >> n;
    }
    default: return 0;
  }
}

async function evalUnary(node, env) {
  if (node.operator === '@') {
    // Address-of: @FN name → stable integer handle mapped to the function name.
    // @varName (non-function) → 0 (real memory layout unsupported).
    const expr = node.expression;
    const fnName = expr?.name;
    if (!fnName) return 0;
    for (const [h, n] of Object.entries(fnPtrTable)) { if (n === fnName) return Number(h); }
    const h = nextFnPtrHandle++;
    fnPtrTable[h] = fnName;
    return h;
  }
  const v = await evalExpr(node.expression, env);
  switch(node.operator) {
    case '-': return -(Number(v)||0);
    case '+': return Number(v)||0;

    // canonical TRUE=-1 / FALSE=0 this is also the logical negation.
    case 'NOT': return ~(Number(v)|0);

    case 'peek': case 'peek byte': { const a = Math.floor(await N(0)); return fakeReadU16(a) & 0xFF; }
    case 'peek word': { const a = Math.floor(await N(0)); return fakeReadU16(a); }
    case 'peek long': { const a = Math.floor(await N(0)); return fakeReadU32(a); }
    case 'usr': case 'usr_': return 0;
    case 'screenbits': return 8;
    case 'systemversion': return 0x0700;
    case 'noevent': return -1;
    case 'system': {
      const n_ = await N(0);
      // Mac System globals at well-known offsets
      if (n_ === 4)  return 0;      // refNum of system resource file
      if (n_ === 6)  return 512;    // screen width
      if (n_ === 7)  return 342;    // screen height
      if (n_ === 8)  return 0x0700; // system version (7.0)
      if (n_ === 11) return 8;      // screen depth (bits)
      return 0;
    }

    // Array / misc
    case 'ubound': { const [arr] = await all(); return Array.isArray(arr) ? arr.length-1 : 0; }
    case 'lbound': return 0;
    case 'vartype': return 0;

    case 'ptinrect': return ptInRect(rawArgs, env);

    // POINT(x,y) — 1 if the pixel is foreground, 0 if background, -1 off-screen.
    case 'point': {
      const px = Math.floor(await N(0)), py = Math.floor(await N(1));
      const wdef = windowDefs[outputWindowId ?? frontWindowId];
      if (!ctx || !wdef) return -1;
      if (px < 0 || py < 0 || px >= (wdef.logW ?? 512) || py >= (wdef.logH ?? 342)) return -1;
      const d = ctx.getImageData(dev(px + 0.5) , dev(py + 0.5), 1, 1).data;
      // Anything appreciably darker than white counts as the foreground.
      return (d[0] + d[1] + d[2]) < 384 ? 1 : 0;
    }

    // FN PTINRGN(pt, rgn) / FN RECTINRGN(rect, rgn): does the point, or any
    // pixel of the rectangle, lie in the region?
    case 'ptinrgn': {
      const p = await readPoint(rawArgs[0], env), r = regionStore[Math.floor(await N(1))];
      return p && rgnHas(r, p.h, p.v) ? -1 : 0;
    }
    case 'rectinrgn': {
      const q = await resolveRect(rawArgs[0], env), r = regionStore[Math.floor(await N(1))];
      if (!q || !r) return 0;
      for (let y = Math.max(q.top, r.top); y < Math.min(q.bottom, r.bottom); y++)
        for (let x = Math.max(q.left, r.left); x < Math.min(q.right, r.right); x++) if (rgnHas(r, x, y)) return -1;
      return 0;
    }

    // FN BITTST(ptr, n) — the Toolbox's bit numbering: bit 0 is the high bit of
    // the byte at ptr.
    case 'bittst': {
      const ptr = Math.floor(await N(0)), bit = Math.floor(await N(1));
      return (fakeReadBytes(ptr + (bit >> 3), 1)[0] >> (7 - (bit & 7))) & 1 ? -1 : 0;
    }
    case 'stringwidth': {
      const str = String(await A(0) ?? '');
      if (!ctx) return str.length * Math.round(textSize * 0.6);
      ctx.save(); ctx.font = textFontCss();
      const w = Math.round(ctx.measureText(str).width);
      ctx.restore(); return w;
    }
    case 'sizeresource': return 0;
    case 'finderinfo': return 0;   // FN FINDERINFO(...) — no document from Finder
    case 'gestalt': return 0;      // FN GESTALT(...) stub
    case 'countresources': case 'count1resources': {
      const typeArg = rawArgs[0];
      const typeStr = await resTypeOf(typeArg, env);
      if (!typeStr) return 0;
      return (macResources[typeStr] ?? []).length;
    }
    case 'getindresource': case 'get1indresource': case 'getindtype': {
      const typeArg = rawArgs[0];
      const typeStr = await resTypeOf(typeArg, env);
      if (!typeStr) return 0;
      const idx = Math.floor(Number(await N(1))) - 1;
      const resources = macResources[typeStr] ?? [];
      if (idx < 0 || idx >= resources.length) return 0;
      return handleForResource(resources[idx]);
    }
    case 'pstr$': {
      const addr = Math.floor(Number(await A(0)) ?? 0);
      if (!addr) return '';
      const len = fakeReadBytes(addr, 1)[0];
      return macRomanToStr(fakeReadBytes(addr + 1, len));
    }
    case 'curresfile': return 0;
    case 'countmitems': {
      const handle = menuIdOf(Math.floor(Number(await N(0))) || 0);
      return menuDefs[handle] ? Object.keys(menuDefs[handle].items).length : 0;
    }
    case 'handtohand': return 0;
    case 'gethandlesize': return 0;
    case 'sectrect': return 0;
    case 'equalrect': return 0;
    case 'getcrefcon': return 0;
    case 'alert': case 'stopalert': case 'cautionalert': case 'notealert':
    case 'caution': case 'stop':
      return showAlert(Math.floor(await N(0)), ALERT_ICONS[name] ?? 'ℹ️');

    // ── Toolbox functions (normally written FN Name(...)) ─────────
    case 'newmenu': {
      const menuId = Math.floor(Number(await A(0))) || 0;
      const title  = String((await A(1)) ?? '');
      menuDefs[menuId] = makeMenu(title);
      renderMenuBar();
      return menuHandle(menuId);
    }
    case 'getmenubar':
      savedMenuBar = JSON.parse(JSON.stringify(menuDefs));
      return 1;
    case 'getmhandle': {
      const mid = Math.floor(Number(await A(0))) || 0;
      return menuDefs[mid] ? menuHandle(mid) : 0;
    }
    case 'getresource': case 'get1resource': {
      // FN GETRESOURCE(type&, id%) — a handle to the resource's bytes, or 0
      // (NIL) when there is no such resource, which programs test for.
      const res = findRes(await resTypeOf(rawArgs[0], env), Math.floor(await N(1)));
      if (!res) return 0;
      const handle = handleForResource(res);
      // PICTURE draws a picture from its decoded bitmap.
      if (res.type === 'PICT' && !pictHandleMap[handle]) {
        const bitmap = decodePictBitmap(res.data);
        const d = res.data, rd = o => ((d[o] << 8) | d[o + 1]) << 16 >> 16;
        pictHandleMap[handle] = bitmap ?? {w: rd(8) - rd(4), h: rd(6) - rd(2), mask: null};
      }
      return handle;
    }
    case 'getnamedresource': case 'get1namedresource': {
      // FN GETNAMEDRESOURCE(type&, name$) -> handle or 0
      const type = await resTypeOf(rawArgs?.[0], env);
      const name = String((await A(1)) ?? '');
      const res = (macResources[type] ?? []).find(r => r.name.toLowerCase() === name.toLowerCase());
      if (res) {
        const handle = handleForResource(res);
        return handle;
      }
      // Fall back to the TEXT cache, stored as [2-byte length][bytes].
      const text = rsrcTexts[name.toLowerCase()];
      if (!text) { console.warn(`GETNAMEDRESOURCE '${type}' "${name}" not found`); return 0; }
      const bytes = new Uint8Array(text.length);
      for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xFF;
      const dataAddr = fakeMalloc(2 + bytes.length);
      fakeWriteU16(dataAddr, bytes.length);
      fakeWriteBytes(dataAddr + 2, bytes);
      const handle = fakeMalloc(4);
      fakeWriteU32(handle, dataAddr);
      return handle;
    }
    case 'openresfile': case 'openrfperm': case 'homeresfile': return 0;
    case 'newrgn': return newRegion();
    case 'zeroscrap': case 'putscrap': case 'aeinstalleventhandler': return 0;
    case 'getnewdialog': case 'getcref': case 'tehandle': return 0;
    case 'getctitle': return '';
    case 'tenew': return makeTeHandle(rawArgs[1], env);

    case 'tickcount': return tickCount();

    default: {
      // A bare Name(...) is an array (or record) reference. User functions live
      // in their own namespace and can only be reached through `FN Name(...)`,
      // which the grammar parses as a userFuncCall — so when the two names
      // collide the array has to win. MacPThy keeps its marker coordinates in
      // `Markx()` and also defines `LONG FN MarkX`, and reading the array called
      // the function instead: every X, O and • marker came back with a null x
      // coordinate and was never drawn, so those three tools looked dead.
      // gShopper(i) — a whole record, gathered from its field arrays.
      if (fnCall) return 0;   // an FN with no definition and no built-in
      if (recordOf[normVarName(name)])
        return readRecord(normVarName(name), subIdx(await A(0)));
      const arr = readArray(env, name);
      if (Array.isArray(arr)) {
        const idxs = (await all()).map(subIdx);
        let v = arr;
        for (const idx of idxs) { if (Array.isArray(v)) v = v[idx]; else break; }
        if (typeof v === 'boolean') return v ? -1 : 0;
        return (typeof v === 'number' || typeof v === 'string') ? v : 0;
      }
      if (funcDefs[name]) return execUserFuncCall({type:'userFuncCall', name, args: rawArgs}, env);
      return 0;
    }
  }
}

// ── Mac 16-colour palette ─────────────────────────────────────
function mac16(idx) {
  const p = ['#ffffff','#ffff00','#ff6600','#dd0000','#ff0099','#330099',
             '#0000cc','#0099ff','#00bb00','#006600','#663300','#996633',
             '#cccccc','#888888','#444444','#000000'];
  return p[((idx%16)+16)%16];
}

// ── Sound ─────────────────────────────────────────────────────
// One AudioContext for the page: browsers allow only a few.
let audioCtx = null;
function tone(freq, ms, volume = 1) {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = Math.min(10000, Math.max(20, freq || 880));
    gain.gain.value = 0.15 * Math.min(1, Math.max(0, volume));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) { /* no audio available */ }
}

// ── Disk files ────────────────────────────────────────────────
// A Mac program kept its documents on a disk shared by every application,
// each file tagged with a four-letter type and creator (DEF OPEN) that the
// Open dialog filtered on: FILES$(1,"BIDr") lists only Price Theory's saved
// screens. Here that disk is the browser's localStorage, shared by the
// programs on this page; the file dialogs import files from the computer and
// export them back to it.
const DISK_KEY = 'zbasic-disk';
const DISK_VOL = -1;   // the volume reference FILES$ hands back; only OPEN takes it
let diskFiles = null;  // lowercased name → {name, type, creator, data: Uint8Array, date}

function disk() {
  if (diskFiles) return diskFiles;
  diskFiles = {};
  try {
    for (const [k, f] of Object.entries(JSON.parse(localStorage.getItem(DISK_KEY) || '{}'))) {
      const bin = atob(f.data);
      diskFiles[k] = {...f, data: Uint8Array.from(bin, c => c.charCodeAt(0))};
    }
  } catch (e) { /* no storage here (a private window): the disk lasts as long as the page */ }
  return diskFiles;
}
function saveDisk() {
  try {
    const out = {};
    for (const [k, f] of Object.entries(disk())) {
      let bin = '';
      for (let i = 0; i < f.data.length; i += 0x8000) bin += String.fromCharCode(...f.data.subarray(i, i + 0x8000));
      out[k] = {...f, data: btoa(bin)};
    }
    localStorage.setItem(DISK_KEY, JSON.stringify(out));
  } catch (e) { console.warn(`documents not saved in the browser: ${e.message}`); }
}
const diskGet = name => disk()[String(name).toLowerCase()] ?? null;   // HFS ignores case
function diskPut(name, data, type, creator) {
  disk()[String(name).toLowerCase()] = {name, type, creator, data, date: Date.now()};
  saveDisk();
}
function diskDelete(name) { delete disk()[String(name).toLowerCase()]; saveDisk(); }

// A file travels to and from the computer with its type as the extension
// ("Budget.BIDr"), so that importing it back gives it the same type.
function exportFile(f) {
  const ext = f.type === 'TEXT' ? 'txt' : f.type.trim();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([f.data]));
  a.download = ext ? `${f.name}.${ext}` : f.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function importFile(file, defType) {
  let name = file.name, type = defType;
  const m = name.match(/^(.+)\.([^.]{3,4})$/);
  if (m && /^txt$/i.test(m[2])) [name, type] = [m[1], 'TEXT'];
  else if (m && m[2].length === 4) [name, type] = [m[1], m[2]];
  diskPut(name, new Uint8Array(await file.arrayBuffer()), type, '????');
  return name;
}

// ── OPEN, CLOSE, PRINT#, INPUT#, READ FILE, WRITE FILE ──
// OPEN "I"|"O"|"R"|"A", n, name$ [, record length [, volume]] (manual, OPEN):
// "I" reads an existing file, "O" replaces it, "R" reads and writes it,
// creating it if need be, and "A" appends. A file is a byte stream with one
// position, so INPUT#'s text and READ FILE's raw bytes can share it, as CDraw's
// documents do. What was written reaches the disk at CLOSE.
const openFiles = new Map();   // file number → {name, mode, type, creator, data, len, pos, recLen, changed}
let defOpen = 'TEXT????';      // DEF OPEN "typecrea" — for the files OPEN creates

async function fileOpen(mode, num, name, recLen) {
  mode = mode.trim().toUpperCase()[0];
  if (!'IORA'.includes(mode)) return;   // "C" (serial port), OPEN TALK — not files
  if (!(num >= 1 && num <= 99)) return diskError(6, num);
  if (!name || name.includes(':')) return diskError(5, num);
  const old = diskGet(name);
  if (mode === 'I' && !old) return diskError(3, num);
  await fileClose(num);
  const keep = old && mode !== 'O';
  const data = keep ? old.data.slice() : new Uint8Array(0);
  openFiles.set(num, {
    name: old && keep ? old.name : name, mode, data, len: data.length,
    pos: mode === 'A' ? data.length : 0, recLen: recLen > 0 ? recLen : 256, changed: mode === 'O' || !old,
    type: keep ? old.type : defOpen.slice(0, 4), creator: keep ? old.creator : defOpen.slice(4, 8),
  });
}
async function fileClose(num) {
  const f = openFiles.get(num);
  if (!f) return;
  openFiles.delete(num);
  if (f.changed) diskPut(f.name, f.data.slice(0, f.len), f.type, f.creator);
}
async function closeAllFiles() { for (const num of [...openFiles.keys()]) await fileClose(num); }

// The open file `num`, or null after reporting why it cannot be used that way.
async function fileFor(num, writing) {
  const f = openFiles.get(num);
  if (!f) { if (num >= 0) await diskError(4, num); return null; }   // -1/-2 are serial ports
  if (writing && f.mode === 'I') { await diskError(8, num); return null; }
  if (!writing && (f.mode === 'O' || f.mode === 'A')) { await diskError(7, num); return null; }
  return f;
}
async function fileWrite(num, bytes) {
  const f = await fileFor(num, true);
  if (!f) return;
  const end = f.pos + bytes.length;
  if (end > f.data.length) {
    const grown = new Uint8Array(Math.max(end, 2 * f.data.length, 256));
    grown.set(f.data.subarray(0, f.len));
    f.data = grown;
  }
  f.data.set(bytes, f.pos);
  f.pos = end; f.len = Math.max(f.len, end); f.changed = true;
}
// READ FILE: up to `len` bytes; fewer at the end of the file, which is an error.
async function fileRead(num, len) {
  const f = await fileFor(num, false);
  if (!f) return null;
  const got = f.data.slice(f.pos, Math.min(f.len, f.pos + len));
  f.pos += got.length;
  if (got.length < len) await diskError(1, num);
  return got;
}
// INPUT# reads an item up to a comma, a carriage return, the end of the file or
// 255 characters, skipping leading blanks and line feeds; quotes let an item
// hold commas (manual, INPUT#). Null at the end of the file.
async function fileInputItem(num) {
  const f = await fileFor(num, false);
  if (!f) return null;
  const d = f.data, out = [];
  while (f.pos < f.len && (d[f.pos] === 32 || d[f.pos] === 10)) f.pos++;
  if (f.pos >= f.len) { await diskError(1, num); return null; }
  if (d[f.pos] === 34) {
    for (f.pos++; f.pos < f.len && d[f.pos] !== 34; ) out.push(d[f.pos++]);
    while (f.pos < f.len && d[f.pos] !== 44 && d[f.pos] !== 13) f.pos++;
  } else {
    while (f.pos < f.len && d[f.pos] !== 44 && d[f.pos] !== 13 && out.length < 255) out.push(d[f.pos++]);
  }
  if (d[f.pos] === 44 || d[f.pos] === 13) f.pos++;
  return macRomanToStr(out);
}

// Disk errors (manual, "Disk Errors"). ERROR is the code plus 256 times the
// file number: 259 is "File Not Found Error in File #01". After ON ERROR GOSUB
// 65535 the program checks ERROR itself; ON ERROR GOSUB label sends errors
// there; otherwise ZBasic reports the error and asks whether to go on.
const DISK_ERRORS = ['', 'End of File', 'Disk Full', 'File Not Found', 'File Not Open',
                     'Bad File Name', 'Bad File Number', 'Write Only', 'Read Only'];
let errorTrap = null;   // null: ZBasic reports errors; '': the program does; or a label
async function diskError(code, num) {
  if (errorTrap === null) {
    const msg = `${DISK_ERRORS[code] || 'Disk'} Error in File #${String(Math.abs(num)).padStart(2, '0')}`;
    console.warn(msg);
    const go = await messageBox('⚠️', msg, [{label: 'Stop', value: 0}, {label: 'Continue', value: 1}], 1, 1);
    if (!go) throw new Error('STOP');
    return;
  }
  globalVars.error = ((num & 0xFF) << 8) | code;
  if (errorTrap) await callEventHandler(errorTrap, globalVars, true);
}

// ── The Standard File dialog ──
// FILES$(1, types$) puts up the Open dialog, listing the files of up to four
// four-letter types (all files when types$ is ""); FILES$(0, prompt$, name$)
// the Save dialog. They resolve to the chosen name, or "" when cancelled.
function fileDialog({mode, types = [], prompt = '', name = ''}) {
  return openModal((box, finish) => {
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    box.classList.add('sf');
    let sel = null, confirm = null;
    const title = el('div', 'sf-title', mode === 'open' ? 'Open' : prompt || 'Save as:');
    const list = el('div', 'sf-list');
    list.tabIndex = 0;
    const side = el('div', 'sf-side');
    const body = el('div', 'sf-body');
    body.append(list, side);
    const input = mode === 'save' ? el('input', 'sf-name') : null;
    const note = el('div', 'sf-note');
    const setNote = (text, warn = false) => {
      note.textContent = text ?? 'Documents are kept in this browser. Import and Export move them to and from your computer.';
      note.classList.toggle('warn', warn);
    };
    setNote();
    box.append(title, body);
    if (input) { input.value = name; box.append(input); }
    box.append(note);

    const files = () => Object.values(disk())
      .filter(f => mode !== 'open' || !types.length || types.includes(f.type))
      .sort((a, b) => a.name.localeCompare(b.name));
    const button = (label, fn, isDefault) => {
      const b = el('button', 'mac-alert-btn' + (isDefault ? ' default' : ''), label);
      b.onclick = fn;
      side.append(b);
      return b;
    };
    const ok = () => {
      if (mode === 'open') { if (sel) finish(sel); return; }
      const n = input.value.trim();
      if (!n) return;
      if (n.includes(':')) { setNote('A name cannot contain ":".', true); return; }
      const old = diskGet(n);
      if (old && confirm !== n) {
        confirm = n;
        setNote(`Replace the existing "${old.name}"? Click Save again to replace it.`, true);
        return;
      }
      finish(n);
    };
    const pick = (n, open) => {
      sel = n; confirm = null;
      if (input && n) input.value = n;
      setNote();
      render();
      if (open) ok();
    };
    const okBtn = button(mode === 'open' ? 'Open' : 'Save', ok, true);
    button('Cancel', () => finish(''));
    side.append(el('hr'));
    const picker = el('input');
    picker.type = 'file';
    picker.multiple = true;
    picker.hidden = true;
    picker.onchange = async () => {
      let last = null;
      for (const file of picker.files) last = await importFile(file, types[0] || 'TEXT');
      picker.value = '';
      if (last) pick(last);
    };
    side.append(picker);
    button('Import…', () => picker.click());
    const exportBtn = button('Export', () => { const f = sel && diskGet(sel); if (f) exportFile(f); });
    let deleting = null;
    const deleteBtn = button('Delete', () => {
      if (!sel) return;
      if (deleting !== sel) { deleting = sel; setNote(`Delete "${sel}"? This cannot be undone. Click Delete again to delete it.`, true); return; }
      diskDelete(sel);
      deleting = null;
      pick(null);
    });

    function render() {
      list.innerHTML = '';
      const all = files();
      if (sel && !all.some(f => f.name === sel)) sel = null;
      if (!all.length) list.append(el('div', 'sf-empty', mode === 'open' ? 'No documents of this kind' : 'No documents'));
      for (const f of all) {
        const row = el('div', 'sf-item' + (f.name === sel ? ' sel' : ''));
        row.append(el('span', null, f.name), el('span', 'sf-type', f.type));
        row.onclick = () => pick(f.name);
        row.ondblclick = () => pick(f.name, true);
        list.append(row);
      }
      if (mode === 'open') okBtn.disabled = !sel;
      exportBtn.disabled = deleteBtn.disabled = !sel;
      if (deleting !== sel) deleting = null;
    }
    render();
    setTimeout(() => { if (input) { input.focus(); input.select(); } else list.focus(); });
    return e => {
      if (e.key === 'Escape') { e.preventDefault(); finish(''); }
      else if (e.key === 'Enter') { e.preventDefault(); ok(); }
      else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && document.activeElement !== input) {
        e.preventDefault();
        const names = files().map(f => f.name);
        const i = names.indexOf(sel) + (e.key === 'ArrowDown' ? 1 : -1);
        if (names.length) pick(names[Math.max(0, Math.min(names.length - 1, i))]);
      }
    };
  }, '');
}

// ── Dialog helpers ────────────────────────────────────────────
function promptUser(title, msg) {
  const label = [title, msg].filter(Boolean).join('\n');
  return Promise.resolve(window.prompt(label) ?? null);
}
function alertUser(title, msg) {
  const label = [title, msg].filter(Boolean).join('\n');
  window.alert(label);
  return Promise.resolve(1);
}

// ── Init ──────────────────────────────────────────────────────
console.log('ZBasic emulator ready.');
</script>
</body>
</html>
